<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DocuSalud">
  <!-- App-icon background (mist) -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="#E3E7DA"/>
  <!-- Letter D (forest), notebook-style with spiral binding on the left -->
  <path fill="#1F3A2A" fill-rule="evenodd"
        d="M150 104 H300 C384 104 426 170 426 256 C426 342 384 408 300 408 H150 Z
           M212 166 V346 H300 C346 346 364 308 364 256 C364 204 346 166 300 166 Z"/>
  <!-- Brass spiral binding rings on the left edge (5) -->
  <g fill="#D2B385">
    <rect x="108" y="150" width="92" height="20" rx="10"/>
    <rect x="108" y="196" width="92" height="20" rx="10"/>
    <rect x="108" y="242" width="92" height="20" rx="10"/>
    <rect x="108" y="288" width="92" height="20" rx="10"/>
    <rect x="108" y="334" width="92" height="20" rx="10"/>
    <!-- Small brass underline mark inside the lower bowl -->
    <rect x="228" y="372" width="120" height="18" rx="9"/>
  </g>
</svg>
