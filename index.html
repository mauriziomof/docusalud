<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuSalud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div class="lbg" id="loginBg">
  <div class="lbox">
    <!-- LOGO: D-portapapeles -->
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:16px">
      <rect width="52" height="52" rx="12" fill="#1F3A2A"/>
      <rect x="14" y="9" width="24" height="34" rx="3" fill="#DCE3D2" opacity="0.15" stroke="#DCE3D2" stroke-width="1.5"/>
      <rect x="20" y="6" width="12" height="6" rx="2" fill="#1F3A2A" stroke="#DCE3D2" stroke-width="1.5"/>
      <line x1="19" y1="22" x2="33" y2="22" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="27" x2="33" y2="27" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="24" y1="17" x2="28" y2="17" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="15" x2="26" y2="19" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
      <line x1="19" y1="33" x2="28" y2="33" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </svg>
    <h2>DocuSalud</h2>
    <p>Historias clínicas · Acceso privado</p>
    <input type="password" id="loginPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkLogin()">
    <button onclick="checkLogin()">Entrar</button>
    <div class="lerr" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="topbar">
  <div class="brand">
    <button id="menuBtn" onclick="toggleSidebar()" style="display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--text2)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <svg width="28" height="28" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="52" height="52" rx="12" fill="#1F3A2A"/>
      <rect x="14" y="9" width="24" height="34" rx="3" fill="#DCE3D2" opacity="0.15" stroke="#DCE3D2" stroke-width="1.5"/>
      <rect x="20" y="6" width="12" height="6" rx="2" fill="#1F3A2A" stroke="#DCE3D2" stroke-width="1.5"/>
      <line x1="19" y1="22" x2="33" y2="22" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="27" x2="33" y2="27" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="24" y1="17" x2="28" y2="17" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="15" x2="26" y2="19" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
      <line x1="19" y1="33" x2="28" y2="33" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </svg>
    <div>
      <div class="brand-name"><span style="font-weight:700">docu</span>salud</div>
      <div class="brand-sub">Historias clínicas</div>
    </div>
  </div>
  <div class="sync-wrap"><div class="dot ing" id="syncDot"></div><span id="syncLabel">Conectando...</span></div>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn" title="Modo oscuro">🌙</button>
    <button class="tbtn" onclick="exportar()">⬇ Exportar</button>
    <button class="tbtn" onclick="document.getElementById('impFile').click()">⬆ Importar</button>
    <input type="file" id="impFile" style="display:none" accept=".json" onchange="importar(event)">
    <button class="tbtn" onclick="window.print()">🖨 Imprimir</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="stop">
      <div class="swrap"><input type="text" id="search" placeholder="Buscar paciente..." oninput="filtrar()"></div>
      <button class="bnew" onclick="modalNuevo()">+ Nuevo paciente</button>
    </div>
    <div class="plist" id="plist"></div>
    <div class="sfoot" id="sfooter"></div>
  </div>
  <div class="main" id="mainArea">
    <div class="panel"><div class="empty">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" style="opacity:.25">
        <rect width="52" height="52" rx="12" fill="#1F3A2A"/>
        <rect x="14" y="9" width="24" height="34" rx="3" fill="#DCE3D2" opacity="0.15" stroke="#DCE3D2" stroke-width="1.5"/>
        <rect x="20" y="6" width="12" height="6" rx="2" fill="#1F3A2A" stroke="#DCE3D2" stroke-width="1.5"/>
        <line x1="19" y1="22" x2="33" y2="22" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="19" y1="27" x2="33" y2="27" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="24" y1="17" x2="28" y2="17" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="15" x2="26" y2="19" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
        <line x1="19" y1="33" x2="28" y2="33" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <h3>DocuSalud</h3>
      <p>Selecciona un paciente o crea uno nuevo.</p>
    </div></div>
  </div>
</div>

<div class="bottom-nav" id="bottomNav">
  <button class="bn-btn on" id="bn-pacientes" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    Pacientes
  </button>
  <button class="bn-btn" onclick="modalNuevo()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Nuevo
  </button>
  <button class="bn-btn" onclick="exportar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Exportar
  </button>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
