<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuSalud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────────────── */
:root {
  --forest:   #1F3A2A;
  --sage:     #2F5D3A;
  --olive:    #7A8A6E;
  --mist:     #DCE3D2;
  --charcoal: #1A1A17;
  --slate:    #5C5C56;
  --cream:    #F5F1E8;
  --bone:     #FBFAF6;
  --terra:    #B8553E;
  --brass:    #C9A961;
  --petrol:   #4A6B7C;

  --bg:       var(--cream);
  --surface:  var(--bone);
  --surface2: #EDE9DF;
  --border:   rgba(31,58,42,0.12);
  --border2:  rgba(31,58,42,0.22);
  --text:     var(--charcoal);
  --text2:    var(--slate);
  --text3:    var(--olive);
  --accent:   var(--forest);
  --accent-light: var(--mist);
  --accent-border: rgba(31,58,42,0.3);
  --danger:   var(--terra);
  --danger-light: #F7EAE7;
  --warn:     var(--brass);
  --warn-light: #F7F1E0;
  --info:     var(--petrol);
  --info-light: #E5EDF0;

  --r: 8px;
  --rl: 12px;
  --border-default: 0.5px solid var(--border);
}

/* DARK MODE */
[data-theme="dark"] {
  --bg:       #141410;
  --surface:  #1E1E19;
  --surface2: #252520;
  --border:   rgba(220,227,210,0.1);
  --border2:  rgba(220,227,210,0.18);
  --text:     #EDEAE0;
  --text2:    #9A9A8E;
  --text3:    #7A8A6E;
  --accent:   #2F5D3A;
  --accent-light: rgba(31,58,42,0.25);
  --accent-border: rgba(47,93,58,0.5);
  --danger-light: rgba(184,85,62,0.15);
  --warn-light: rgba(201,169,97,0.15);
  --info-light: rgba(74,107,124,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

/* ── LOGIN ──────────────────────────────────────────────────────────── */
.lbg {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.lbox {
  background: var(--surface);
  border: var(--border-default);
  border-radius: var(--rl);
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  text-align: center;
}
.lbox h2 {
  font-family: 'Fraunces', serif;
  font-size: 28px; font-weight: 300;
  color: var(--text); margin-bottom: 4px;
}
.lbox p { font-size: 12px; color: var(--text3); margin-bottom: 28px; letter-spacing: 0.04em; text-transform: uppercase; }
.lbox input {
  width: 100%; padding: 11px 14px;
  font-size: 14px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text);
  outline: none; text-align: center; letter-spacing: 0.12em;
  margin-bottom: 12px; transition: border 0.15s;
}
.lbox input:focus { border-color: var(--forest); }
.lbox button {
  width: 100%; padding: 12px;
  font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist);
  border: none; border-radius: var(--r); cursor: pointer;
  letter-spacing: 0.04em; transition: opacity 0.15s;
}
.lbox button:hover { opacity: 0.88; }
.lerr { font-size: 12px; color: var(--terra); margin-top: 10px; min-height: 16px; }

/* ── TOPBAR ─────────────────────────────────────────────────────────── */
.topbar {
  background: var(--surface);
  border-bottom: var(--border-default);
  padding: 0 20px; height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 700; color: var(--forest);
  letter-spacing: -0.01em;
}
.brand-name span { font-weight: 400; }
.brand-sub { font-size: 9px; color: var(--text3); letter-spacing: 0.18em; text-transform: uppercase; }
.sync-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
.dot.ok { background: #4CAF7D; }
.dot.ing { background: var(--brass); animation: pu 1s infinite; }
.dot.err { background: var(--terra); }
@keyframes pu { 0%,100%{opacity:1} 50%{opacity:.3} }
.tbtn {
  padding: 6px 11px; font-size: 11px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: transparent; color: var(--text2); cursor: pointer;
  letter-spacing: 0.02em; transition: all 0.12s;
}
.tbtn:hover { background: var(--surface2); }
.dark-toggle {
  width: 32px; height: 32px; border-radius: 50%;
  border: var(--border-default); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.12s; color: var(--text2);
}
.dark-toggle:hover { background: var(--surface2); }

/* ── LAYOUT ─────────────────────────────────────────────────────────── */
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 252px; min-width: 252px;
  background: var(--surface);
  border-right: var(--border-default);
  display: flex; flex-direction: column;
}
.stop { padding: 12px; }
.swrap { position: relative; margin-bottom: 8px; }
.swrap::before { content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; color: var(--text3); }
.swrap input {
  width: 100%; padding: 7px 10px 7px 30px;
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none;
  transition: border 0.12s;
}
.swrap input:focus { border-color: var(--forest); }
.bnew {
  width: 100%; padding: 8px;
  font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist);
  border: none; border-radius: var(--r); cursor: pointer;
  letter-spacing: 0.02em; transition: opacity 0.12s;
}
.bnew:hover { opacity: 0.88; }
.plist { flex: 1; overflow-y: auto; padding: 6px; }
.pi {
  padding: 10px 11px; border-radius: var(--r);
  cursor: pointer; margin-bottom: 2px;
  border: 0.5px solid transparent; transition: all 0.1s;
}
.pi:hover { background: var(--surface2); }
.pi.on { background: var(--accent-light); border-color: var(--accent-border); }
.pn { font-size: 13px; font-weight: 500; color: var(--text); }
.pi.on .pn { color: var(--forest); }
.pm { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sfoot { padding: 10px 12px; border-top: var(--border-default); font-size: 11px; color: var(--text3); text-align: center; letter-spacing: 0.04em; }

/* ── MAIN ───────────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.phdr {
  background: var(--surface); border-bottom: var(--border-default);
  padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.pav {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--mist); border: 0.5px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--forest); flex-shrink: 0;
  letter-spacing: -0.02em;
}
.phn { font-size: 15px; font-weight: 500; color: var(--text); }
.phm { font-size: 11px; color: var(--text3); margin-top: 2px; letter-spacing: 0.02em; }
.tabbar {
  background: var(--surface); border-bottom: var(--border-default);
  padding: 0 16px; display: flex; overflow-x: auto; flex-shrink: 0;
}
.tabbar::-webkit-scrollbar { height: 0; }
.tab {
  padding: 12px 13px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  color: var(--text3); border: none; background: none; cursor: pointer;
  border-bottom: 1.5px solid transparent; margin-bottom: -0.5px;
  white-space: nowrap; transition: all 0.1s; letter-spacing: 0.01em;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--forest); border-bottom-color: var(--forest); font-weight: 500; }
.panel { flex: 1; overflow-y: auto; padding: 20px; }

/* ── EMPTY ──────────────────────────────────────────────────────────── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; }
.empty h3 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 300; color: var(--text2); }
.empty p { font-size: 13px; color: var(--text3); }

/* ── CARDS ──────────────────────────────────────────────────────────── */
.card { background: var(--surface); border: var(--border-default); border-radius: var(--rl); padding: 16px 18px; margin-bottom: 14px; }
.ct { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: var(--text3); text-transform: uppercase; margin-bottom: 14px; }
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.fg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.f { display: flex; flex-direction: column; gap: 4px; }
.f.full { grid-column: 1/-1; }
.f label { font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
.f input,.f select,.f textarea {
  padding: 8px 10px; font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none; transition: border 0.12s;
}
.f input:focus,.f select:focus,.f textarea:focus { border-color: var(--forest); background: var(--surface); }
.f textarea { resize: vertical; min-height: 68px; line-height: 1.65; }

/* ── BUTTONS ────────────────────────────────────────────────────────── */
.bs {
  padding: 9px 20px; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist); border: none; border-radius: var(--r);
  cursor: pointer; letter-spacing: 0.03em; transition: opacity 0.12s;
}
.bs:hover { opacity: 0.88; }
.bd {
  padding: 9px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  background: none; color: var(--terra); border: 0.5px solid rgba(184,85,62,0.35);
  border-radius: var(--r); cursor: pointer; transition: all 0.12s;
}
.bd:hover { background: var(--danger-light); }
.ba {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface); color: var(--text2); cursor: pointer;
  margin-bottom: 12px; transition: all 0.12s; letter-spacing: 0.01em;
}
.ba:hover { background: var(--surface2); border-color: var(--border2); }

/* ── ODONTOGRAMA ────────────────────────────────────────────────────── */
.ow { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.al { font-size: 9px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.12em; }
.tr { display: flex; gap: 3px; }
.tooth {
  width: 30px; height: 38px; border: var(--border-default); border-radius: 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; background: var(--surface2); transition: all 0.1s; gap: 1px;
}
.tooth:hover { transform: translateY(-1px); border-color: var(--border2); }
.tooth .tn { font-size: 8px; color: var(--text3); line-height: 1; }
.tooth .ts { font-size: 10px; font-weight: 500; line-height: 1; }
.tooth.caries { background: var(--danger-light); border-color: rgba(184,85,62,0.4); } .tooth.caries .ts { color: var(--terra); }
.tooth.tratado { background: var(--accent-light); border-color: var(--accent-border); } .tooth.tratado .ts { color: var(--forest); }
.tooth.ausente { opacity: .4; } .tooth.ausente .ts { color: var(--text3); }
.tooth.corona { background: var(--info-light); border-color: rgba(74,107,124,0.35); } .tooth.corona .ts { color: var(--petrol); }
.tooth.endodoncia { background: var(--warn-light); border-color: rgba(201,169,97,0.4); } .tooth.endodoncia .ts { color: var(--brass); }
.tooth.protesis { background: #F0EBF7; border-color: rgba(120,80,160,0.3); } .tooth.protesis .ts { color: #785090; }
.ml { width: 0.5px; background: var(--border2); height: 36px; margin: 0 3px; align-self: center; }
.tleg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
.leg {
  display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2);
  cursor: pointer; padding: 4px 10px; border-radius: 20px;
  border: var(--border-default); background: var(--surface); user-select: none; transition: all 0.1s;
}
.leg:hover { border-color: var(--border2); }
.leg.sel { border-color: var(--forest); background: var(--accent-light); color: var(--forest); font-weight: 500; }
.ld { width: 10px; height: 10px; border-radius: 2px; border: 0.5px solid; }

/* ── TABLES ─────────────────────────────────────────────────────────── */
.ptbl,.otbl,.rtbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.ptbl th,.otbl th,.rtbl th {
  font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.08em;
  padding: 6px 8px; border-bottom: var(--border-default); background: var(--surface2); text-align: left; text-transform: uppercase;
}
.ptbl td,.otbl td { padding: 5px 7px; border-bottom: var(--border-default); vertical-align: middle; }
.ptbl td:first-child { color: var(--text2); min-width: 180px; }
.rtbl td { padding: 8px 10px; border-bottom: var(--border-default); color: var(--text); vertical-align: top; }
.rtbl tr:last-child td { border-bottom: none; }
.rtbl tr:hover td { background: var(--surface2); }
.ptbl input,.otbl input {
  width: 100%; padding: 5px 7px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: 6px; background: var(--surface2); color: var(--text); outline: none;
}
.ptbl input:focus,.otbl input:focus { border-color: var(--forest); }
.bdel { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.12s var(--ease, ease); }
.bdel:hover { color: var(--terra); }
.bdel.bedit:hover { color: var(--forest); }

/* ── CONSULTAS ──────────────────────────────────────────────────────── */
.cc { background: var(--surface); border: var(--border-default); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; transition: border 0.1s; }
.cc:hover { border-color: var(--border2); }
.cch { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.ccd { font-size: 10px; color: var(--text3); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.cct { font-size: 14px; font-weight: 500; color: var(--text); margin-top: 2px; }
.ccn { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.65; }
.ccc { font-size: 11px; font-weight: 500; color: var(--forest); background: var(--mist); padding: 2px 9px; border-radius: 20px; }

/* ── MODAL ──────────────────────────────────────────────────────────── */
.mbg { position: fixed; inset: 0; background: rgba(26,26,23,0.5); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; backdrop-filter: blur(2px); }
.mbox { background: var(--surface); border-radius: var(--rl); padding: 24px; width: 100%; max-width: 420px; border: var(--border-default); max-height: 90vh; overflow-y: auto; }
.mbox h3 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; margin-bottom: 18px; color: var(--text); }
.mact { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.bc { padding: 8px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: transparent; color: var(--text2); cursor: pointer; }
.mf { margin-bottom: 12px; }
.mf label { display: block; font-size: 10px; font-weight: 500; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
.mf input,.mf textarea,.mf select { width: 100%; padding: 8px 10px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: var(--surface2); color: var(--text); outline: none; }
.mf textarea { min-height: 68px; resize: vertical; }
.mf input:focus,.mf textarea:focus { border-color: var(--forest); }

/* ── FIRMAS ─────────────────────────────────────────────────────────── */
.fr { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
.fb { text-align: center; }
.fl { border-top: var(--border-default); margin-top: 44px; padding-top: 6px; font-size: 11px; color: var(--text3); letter-spacing: 0.04em; }

/* ── TOAST ──────────────────────────────────────────────────────────── */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--charcoal); color: var(--cream); padding: 10px 18px; border-radius: var(--r); font-size: 12px; opacity: 0; transition: opacity 0.2s; z-index: 999; pointer-events: none; letter-spacing: 0.02em; }
.toast.show { opacity: 1; }
.badge { background: var(--mist); color: var(--forest); font-size: 10px; padding: 1px 7px; border-radius: 20px; margin-left: 4px; font-weight: 500; }

/* ── SCROLLBAR ──────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

/* ── MOBILE ─────────────────────────────────────────────────────────── */
@media(max-width:768px){
  body { height: 100dvh; }
  .layout { flex-direction: column; height: calc(100dvh - 54px - 58px); }
  .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: var(--border-default); display: none; }
  .sidebar.open { display: flex; flex-direction: column; position: fixed; inset: 54px 0 58px 0; z-index: 100; }
  .main { flex: 1; overflow: hidden; }
  .panel { padding: 12px; }
  .topbar { padding: 0 12px; }
  .brand-sub { display: none; }
  .sync-wrap span { display: none; }
  .tbtn { padding: 5px 8px; font-size: 11px; }
  .fg { grid-template-columns: 1fr; }
  .fg3 { grid-template-columns: 1fr 1fr; }
  .tab { padding: 10px 9px; font-size: 11px; }
  .phdr { padding: 10px 12px; }
  .card { padding: 12px 14px; }
  .mbox { padding: 18px; }
  .tooth { width: 24px; height: 30px; }
  .tooth .tn { font-size: 7px; }
  .tooth .ts { font-size: 9px; }
  .ml { height: 28px; }
  .bottom-nav { display: flex; }
  #menuBtn { display: block !important; }
}

/* ── BOTTOM NAV ─────────────────────────────────────────────────────── */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: 58px; background: var(--surface); border-top: var(--border-default);
  z-index: 99; align-items: stretch;
}
.bn-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; border: none; background: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 9px; color: var(--text3);
  padding: 0; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.1s;
}
.bn-btn.on { color: var(--forest); }
.bn-btn svg { width: 20px; height: 20px; }

/* ── PRINT ──────────────────────────────────────────────────────────── */
@media print {
  .sidebar,.topbar,.tabbar,.bs,.ba,.bnew,.bd,.tbtn,.bottom-nav { display: none !important; }
  body,html { overflow: visible; height: auto; }
  .layout,.main { overflow: visible; }
  .panel { overflow: visible; padding: 0; }
}

/* ── PREVIEW: NEW COMPONENT STYLES (Tasks 3.x) ──────────────────────── */

/* Save status indicators (3.5.2) */
.save-status { font-size: 10px; color: var(--text3); letter-spacing: 0.04em; min-height: 12px; }
.save-status.pending { color: var(--brass); }
.save-status.saving { color: var(--text3); }
.save-status.saved { color: #4CAF7D; }
.save-status.error { color: var(--terra); }
.ct-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.ct-row .ct { margin-bottom: 0; }

/* CI input (3.2.1) */
.ci-input { display: flex; gap: 6px; }
.ci-input select { width: 56px; flex-shrink: 0; padding: 8px 6px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: var(--surface2); color: var(--text); outline: none; }
.ci-input input { flex: 1; }

/* Today's patients widget (3.3.2) */
.landing-grid { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px 20px; max-width: 560px; margin: 0 auto; }
.today-card { width: 100%; max-width: 520px; }
.today-card-empty { width: 100%; max-width: 520px; }
.today-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-top: 0.5px solid var(--border); cursor: pointer; transition: background 0.1s; }
.today-row:first-of-type { border-top: none; }
.today-row:hover { background: var(--surface2); }
.today-time { font-size: 13px; font-weight: 500; color: var(--forest); min-width: 50px; }
.today-body { flex: 1; min-width: 0; }
.today-name { font-size: 13px; font-weight: 500; color: var(--text); }
.today-treatment { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Calendar (3.3.4) */
.cal-nav { background: var(--surface); border-bottom: var(--border-default); padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.cal-time { font-size: 14px; font-weight: 500; color: var(--forest); min-width: 60px; }
.cal-row { cursor: pointer; }
.cal-row:hover { border-color: var(--border2); background: var(--surface2); }

/* Calendar view toggle */
.cal-view-toggle { display: inline-flex; background: var(--surface2); border: var(--border-default); border-radius: var(--r); padding: 2px; gap: 0; }
.cal-view-btn { padding: 6px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; border: none; background: transparent; color: var(--text2); border-radius: 6px; cursor: pointer; transition: all 0.15s var(--ease, ease); letter-spacing: 0.02em; }
.cal-view-btn:hover { color: var(--text); }
.cal-view-btn.on { background: var(--surface); color: var(--forest); box-shadow: 0 1px 2px rgba(31,58,42,0.06); }

/* Calendar panel keeps grid airy */
.cal-panel { padding: 20px 24px !important; overflow: auto; }

/* Month grid */
.mes-weekrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
.mes-weekday { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); text-align: center; padding: 6px 0; }
.mes-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.mes-cell {
  background: var(--surface);
  border: var(--border-default);
  border-radius: var(--r);
  min-height: 92px;
  padding: 8px 9px;
  cursor: pointer;
  transition: border-color 0.15s var(--ease, ease), background 0.15s var(--ease, ease), transform 0.15s var(--ease, ease), box-shadow 0.15s var(--ease, ease);
  display: flex; flex-direction: column; gap: 3px;
  position: relative;
  overflow: hidden;
}
.mes-cell:hover { border-color: var(--border2); transform: translateY(-1px); box-shadow: 0 2px 6px rgba(31,58,42,0.06); }
.mes-cell.off { background: transparent; border: none; cursor: default; pointer-events: none; }
.mes-cell.wknd { background: var(--bg); }
.mes-cell.d1 { background: color-mix(in srgb, var(--mist) 35%, var(--surface) 65%); }
.mes-cell.d2 { background: color-mix(in srgb, var(--mist) 60%, var(--surface) 40%); }
.mes-cell.d3 { background: color-mix(in srgb, var(--mist) 85%, var(--surface) 15%); border-color: var(--accent-border); }
.mes-cell.hoy { box-shadow: inset 0 0 0 2px var(--forest); }
.mes-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.mes-num { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); line-height: 1; }
.mes-cell.hoy .mes-num { color: var(--forest); font-weight: 700; }
.mes-badge { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600; color: var(--forest); background: var(--surface); border: 0.5px solid var(--accent-border); border-radius: 20px; padding: 1px 7px; min-width: 18px; text-align: center; line-height: 1.4; }
.mes-cell.d3 .mes-badge { background: var(--forest); color: var(--bone); border-color: var(--forest); }
.mes-item { font-size: 10.5px; line-height: 1.3; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mes-item-h { color: var(--forest); font-weight: 500; font-variant-numeric: tabular-nums; }
.mes-item-n { color: var(--text); }
.mes-more { font-size: 10px; color: var(--text3); margin-top: auto; font-style: italic; }

/* Month grid — fallback if color-mix not supported */
@supports not (background: color-mix(in srgb, red, blue)) {
  .mes-cell.d1 { background: #F0EFE4; }
  .mes-cell.d2 { background: #E6E6D5; }
  .mes-cell.d3 { background: var(--mist); }
}

/* Dark mode tints */
[data-theme="dark"] .mes-cell { background: var(--surface); }
[data-theme="dark"] .mes-cell.wknd { background: var(--bg); }
[data-theme="dark"] .mes-cell.d1 { background: rgba(47,93,58,0.12); }
[data-theme="dark"] .mes-cell.d2 { background: rgba(47,93,58,0.22); }
[data-theme="dark"] .mes-cell.d3 { background: rgba(47,93,58,0.35); }
[data-theme="dark"] .mes-cell.hoy { box-shadow: inset 0 0 0 2px var(--mist); }
[data-theme="dark"] .mes-num { color: var(--text); }
[data-theme="dark"] .mes-cell.hoy .mes-num { color: var(--mist); }
[data-theme="dark"] .mes-badge { background: var(--surface2); color: var(--mist); border-color: var(--border2); }
[data-theme="dark"] .mes-cell.d3 .mes-badge { background: var(--mist); color: var(--forest); border-color: var(--mist); }
[data-theme="dark"] .cal-view-btn.on { background: var(--surface2); color: var(--mist); }

/* Mobile: compact cells */
@media (max-width: 720px) {
  .cal-panel { padding: 12px !important; }
  .mes-cell { min-height: 68px; padding: 6px 7px; }
  .mes-item, .mes-more { display: none; }
  .mes-num { font-size: 12px; }
  .mes-badge { font-size: 9px; padding: 0 6px; }
  .cal-view-btn { padding: 5px 10px; font-size: 11px; }
}

/* Odontograma controls (3.4.1) */
.odonto-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; padding: 8px 12px; background: var(--surface2); border-radius: var(--r); font-size: 12px; }
.ctl-lbl { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.odonto-controls select { padding: 4px 8px; font-size: 12px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: 6px; background: var(--surface); color: var(--text); }

/* Mixed-dentition smaller teeth row (3.4.1) */
.tr-decidua { display: flex; gap: 3px; opacity: 0.85; }
.tooth-sm { width: 22px; height: 28px; }
.tooth-sm .tn { font-size: 7px; }
.tooth-sm .ts { font-size: 8px; }
.tooth.has-surfaces { box-shadow: inset 0 0 0 1px var(--brass); }

/* Firmas (3.6.1, 3.6.2) */
.firmas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
.firma-pad-wrap { display: flex; flex-direction: column; gap: 8px; }
.firma-label { font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
.firma-canvas { border: 0.5px solid var(--border2); border-radius: var(--r); background: var(--surface2); width: 100%; height: 120px; touch-action: none; cursor: crosshair; }
.firma-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.firma-actions .ba { font-size: 11px; padding: 4px 10px; }
.terms-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.terms-check input { width: auto; }

/* Procedimientos restructured (3.6.5) */
.proc-group { margin-bottom: 18px; }
.proc-group-title { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 0.5px solid var(--border); }
.proc-card { background: var(--surface2); border-radius: var(--r); padding: 10px 12px; margin-bottom: 6px; border: 0.5px solid transparent; transition: border 0.1s; }
.proc-card:hover { border-color: var(--border); }
.proc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.proc-name { font-size: 13px; color: var(--text); flex: 1; min-width: 140px; }
.proc-notes { margin-top: 8px; }
.proc-notes textarea { width: 100%; min-height: 60px; padding: 8px 10px; font-size: 12px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: var(--surface); color: var(--text); outline: none; resize: vertical; }
.proc-preview { margin-top: 6px; font-size: 11px; color: var(--text3); font-style: italic; }

/* Récord audit chips (3.8.1) */
.rec-chip { padding: 6px 12px; font-size: 12px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: 20px; background: var(--surface); color: var(--text2); cursor: pointer; transition: all 0.1s; }
.rec-chip:hover { border-color: var(--border2); }
.rec-chip.on { border-color: var(--forest); background: var(--accent-light); color: var(--forest); }
.rec-chip .badge { background: var(--surface2); color: var(--text2); font-size: 10px; }
.rec-chip.on .badge { background: var(--mist); color: var(--forest); }
.rec-tag { font-size: 10px; padding: 2px 8px; border-radius: 12px; letter-spacing: 0.04em; }
.rec-tag-tratamiento { background: var(--accent-light); color: var(--forest); }
.rec-tag-acceso { background: var(--info-light); color: var(--petrol); }
.rec-tag-edicion { background: var(--warn-light); color: #8a6f30; }

/* Resizable sidebar (3.6.6) */
.resize-handle { position: absolute; right: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 5; }
.resize-handle:hover, .resize-handle:active { background: rgba(31,58,42,0.18); }
.sidebar { position: relative; }
@media(max-width: 768px) { .resize-handle { display: none; } }

/* Search highlight (3.3.1) */
mark { background: var(--mist); color: var(--forest); padding: 0 2px; border-radius: 2px; }

/* Mobile scroll fix (3.5.4) */
@media(max-width: 768px) {
  .panel { padding-bottom: 80px; }
  .firmas-grid { grid-template-columns: 1fr; }
}

/* Dark mode tweaks for new components */
[data-theme="dark"] .save-status.saved { color: #5fc89b; }
[data-theme="dark"] .firma-canvas { background: var(--surface2); }
[data-theme="dark"] .rec-tag-tratamiento { background: rgba(47,93,58,0.25); color: #a8d4af; }
[data-theme="dark"] .rec-tag-acceso { background: rgba(74,107,124,0.25); color: #92b6c4; }


/* ── POLISH: UX & aesthetic improvements (May 14, 2026) ─────────────────── */

/* Custom easing curve — gives transitions physical weight */
:root { --ease: cubic-bezier(0.4, 0, 0.2, 1); }

/* Topbar tbtn — icon + label, label hides on narrow screens */
.tbtn { display: inline-flex; align-items: center; gap: 6px; }
.tbtn .ico { width: 14px; height: 14px; flex-shrink: 0; }
.tbtn .lbl { font-size: 11px; letter-spacing: 0.02em; }
@media (max-width: 900px) {
  .tbtn .lbl { display: none; }
  .tbtn { padding: 6px 8px; }
}

/* Logo subtle pulse while syncing (matches the sync-dot rhythm) */
@keyframes logoBreathe { 0%,100% { opacity: 1; } 50% { opacity: 0.78; } }
.topbar .brand svg { transition: opacity 0.3s var(--ease); }
.dot.ing ~ * .topbar .brand svg,
body:has(.dot.ing) .topbar .brand svg { animation: logoBreathe 1.5s var(--ease) infinite; }

/* Tab fade transition */
.panel { transition: opacity 0.15s var(--ease); }
.panel.changing { opacity: 0.45; }

/* Tooth hover — slightly more expressive lift */
.tooth { transition: transform 0.12s var(--ease), border-color 0.12s var(--ease), box-shadow 0.12s var(--ease); }
.tooth:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(31,58,42,0.08); }

/* Patient list hover — soft sage tint */
.pi { transition: background 0.12s var(--ease), border-color 0.12s var(--ease); }
.pi:hover { background: rgba(31,58,42,0.04); }
.pi.on { background: var(--mist); border-color: var(--accent-border); }
[data-theme="dark"] .pi:hover { background: rgba(220,227,210,0.05); }
[data-theme="dark"] .pi.on { background: rgba(31,58,42,0.4); }

/* Soft success flash on inputs after save */
@keyframes savedFlash { 0% { border-color: #4CAF7D; } 100% { border-color: var(--border); } }
.f input.just-saved, .f select.just-saved, .f textarea.just-saved { animation: savedFlash 1.2s var(--ease); }

/* Empty state — breathing logo, more inviting */
.empty { gap: 16px; }
.empty .empty-logo { opacity: 0.30; transition: opacity 0.6s var(--ease); animation: emptyBreathe 4s var(--ease) infinite; }
@keyframes emptyBreathe { 0%,100% { opacity: 0.30; } 50% { opacity: 0.18; } }
.empty h3 { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 300; }
.empty p { font-family: 'Fraunces', serif; font-size: 14px; font-style: italic; color: var(--text2); }

/* Patient header — Fraunces for the name (editorial moment) */
.phn { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 400; letter-spacing: -0.01em; }

/* Cards — more generous padding on desktop */
@media (min-width: 768px) {
  .card { padding: 20px 22px; margin-bottom: 16px; }
  .ct-row { margin-bottom: 16px; }
}

/* "Consultas de hoy" widget — stronger hierarchy */
.today-card, .today-card-empty { border-left: 3px solid var(--forest); }
.today-card .ct, .today-card-empty .ct { color: var(--sage); }

/* Undo toast — distinct from regular toast (terra-tinted to match "destructive" semantics) */
.undo-toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--charcoal); color: var(--cream);
  padding: 10px 14px 10px 18px; border-radius: var(--rl);
  font-size: 12px; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 10px;
  z-index: 1000; max-width: 90vw;
  box-shadow: 0 4px 12px rgba(26,26,23,0.18);
  animation: undoIn 0.2s var(--ease);
}
@keyframes undoIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.undo-toast .undo-btn {
  background: var(--brass); color: var(--charcoal);
  border: none; padding: 5px 12px; border-radius: var(--r);
  font-size: 11px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  cursor: pointer; letter-spacing: 0.04em; transition: opacity 0.12s var(--ease);
}
.undo-toast .undo-btn:hover { opacity: 0.85; }
@media (max-width: 768px) {
  .undo-toast { bottom: 70px; }
}

/* Form field focus glow — confirms attention */
.f input:focus, .f select:focus, .f textarea:focus,
.mf input:focus, .mf select:focus, .mf textarea:focus {
  box-shadow: 0 0 0 2px rgba(31,58,42,0.10);
}

/* Save status — keep last text visible by default (don't go blank) */
.save-status { font-style: italic; opacity: 0.85; }
.save-status.saved { color: #4CAF7D; opacity: 1; }
[data-theme="dark"] .save-status.saved { color: #5fc89b; }

/* Mobile: scroll bottom-nav-aware padding on panel */
@media (max-width: 768px) {
  .topbar { gap: 4px; }
  .sync-wrap { font-size: 10px; }
}

/* Signature canvas — slightly higher contrast in dark mode (was too dark to draw on) */
[data-theme="dark"] .firma-canvas { background: #3a3a35; }

function getDebounce(){return isMobile()?3000:1000}
function autosave(formKey,getData,statusElId){
  if(autosaveTimers[formKey])clearTimeout(autosaveTimers[formKey]);
  if(statusElId)updateSaveStatus(statusElId,'pending');
  autosaveTimers[formKey]=setTimeout(async()=>{
    if(statusElId)updateSaveStatus(statusElId,'saving');
    try{
      const data=getData();
      if(data)await guardar(data);
      if(statusElId)updateSaveStatus(statusElId,'saved');
    }catch(err){
      if(statusElId)updateSaveStatus(statusElId,'error');
    }
  },getDebounce());
}
function updateSaveStatus(id,state){
  const el=document.getElementById(id);
  if(!el)return;
  if(autosaveStatusTimers[id])clearTimeout(autosaveStatusTimers[id]);
  el.classList.remove('saving','saved','error','pending');
  el.classList.add(state);
  if(state==='pending'){el.textContent='Sin guardar';}
  else if(state==='saving'){el.textContent='Guardando…';}
  else if(state==='saved'){
    el.dataset.savedAt=Date.now();
    el.textContent='Guardado';
    autosaveStatusTimers[id]=setTimeout(()=>tickSavedTime(id),5000);
  }
  else if(state==='error'){el.textContent='Error al guardar';}
}
function tickSavedTime(id){
  const el=document.getElementById(id);
  if(!el||!el.dataset.savedAt)return;
  const seconds=Math.floor((Date.now()-parseInt(el.dataset.savedAt))/1000);
  if(seconds<5)el.textContent='Guardado';
  else if(seconds<60)el.textContent=`Guardado hace ${seconds}s`;
  else el.textContent=`Guardado hace ${Math.floor(seconds/60)} min`;
  autosaveStatusTimers[id]=setTimeout(()=>tickSavedTime(id),5000);
}

async function importarJSON(text){
  try{
    const d=JSON.parse(text);
    if(!d.pacientes){alert('Archivo JSON inválido (falta el campo "pacientes").');return;}
    if(!confirm(`¿Importar ${d.pacientes.length} pacientes desde JSON?`))return;

        const{id,...data}=p;
        await setDoc(doc(db,'pacientes',p.id),data);
        count++;
      }
    }
    toast(`${count} pacientes importados`);
  }catch(err){alert('Error al leer el archivo JSON');}
}
async function importarCSV(text){
  try{
    const rows=parseCSV(text);
    if(rows.length<2){alert('El CSV debe tener al menos una fila de encabezado y una de datos.');return;}
    const header=rows[0].map(h=>h.trim().toLowerCase());
    const colNombre=findCol(header,['nombre','name','paciente']);
    const colCI=findCol(header,['ci','cedula','cédula']);
    const colTel=findCol(header,['telefono','teléfono','phone','celular']);
    const colNac=findCol(header,['nacimiento','fecha_nacimiento','dob','birth']);
    const colSexo=findCol(header,['sexo','sex','genero','género']);
    if(colNombre===-1){alert('CSV sin columna "nombre". Encabezados encontrados: '+header.join(', '));return;}
    const errors=[];
    const records=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      if(r.length===1&&!r[0].trim())continue;
      const nombre=(r[colNombre]||'').trim();
      if(!nombre){errors.push(`Fila ${i+1}: nombre vacío`);continue;}
      records.push({
        nombre,
        ci:colCI>=0?(r[colCI]||'').trim():'',
        telefono:colTel>=0?(r[colTel]||'').trim():'',
        nacimiento:colNac>=0?(r[colNac]||'').trim():'',
        sexo:colSexo>=0?(r[colSexo]||'').trim():''
      });
    }
    if(errors.length){alert(`Errores antes de importar:\n${errors.slice(0,5).join('\n')}${errors.length>5?'\n…':''}`);return;}
    if(!confirm(`¿Importar ${records.length} pacientes desde CSV?`))return;
    let count=0;
    for(const r of records){
      const data={...r,telefono2:'',email:'',especialidad:'general',motivo:'',antecedentes:'',patologias:'',oclusion:'',diagnostico:'',plan:'',plan_aceptado:'',restauracion:'',material:'',color_dental:'',color_deseado:'',laboratorio:'',indicaciones_tecnico:'',obs_importantes:'',teeth:{},teeth_obs:'',operatorias:[],procs:{},especialistas:[],records:[],consultas:[],firmas:{}};
      await addDoc(collection(db,'pacientes'),data);
      count++;
    }
    toast(`${count} pacientes importados desde CSV`);
  }catch(err){console.error(err);alert('Error al procesar el CSV');}
}
function parseCSV(text){
  const rows=[];let row=[];let cur='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];const nx=text[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){cur+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else cur+=ch;
    }else{
      if(ch==='"'){inQ=true;}
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch==='\r'){}
      else cur+=ch;
    }
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function findCol(header,candidates){for(const c of candidates){const i=header.indexOf(c);if(i>=0)return i;}return -1;}

}

// ─── CALENDAR (3.3.4) ─────────────────────────────────────────────────────
const MESES_LARGO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WEEKDAYS_CORTO=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];

window.toggleCalendar=function(){
  if(viewActual==='calendario'){
    viewActual='paciente';
    if(idActual)renderPaciente();else renderEmpty();
  }else{
    viewActual='calendario';calendarDate=new Date();calendarView='mes';renderCalendar();
  }
}
function renderCalendar(){
  if(calendarView==='dia')renderCalendarDia();
  else renderCalendarMes();
}
function consultasByDayInMonth(year,month0){
  const map=new Map();
  for(const p of pacientes){
    for(const c of(p.consultas||[])){
      if(!c.fecha)continue;
      const parts=c.fecha.split('-');
      if(parts.length!==3)continue;
      const cy=parseInt(parts[0]);const cm=parseInt(parts[1]);
      if(cy===year&&cm===month0+1){
        if(!map.has(c.fecha))map.set(c.fecha,[]);
        map.get(c.fecha).push({...c,patientName:p.nombre,patientId:p.id});
      }
    }
  }
  // Sort each day's consultas by hour
  for(const arr of map.values())arr.sort((a,b)=>(a.hora||'00:00').localeCompare(b.hora||'00:00'));
  return map;
}
function renderCalendarMes(){
  const year=calendarDate.getFullYear();
  const month0=calendarDate.getMonth();
  const mes=MESES_LARGO[month0];
  const firstDay=new Date(year,month0,1);
  const lastDay=new Date(year,month0+1,0);
  const daysInMonth=lastDay.getDate();
  // shift Sunday(0) → 6, Monday(1) → 0
  let startWeekday=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startWeekday+daysInMonth)/7)*7;
  const byDay=consultasByDayInMonth(year,month0);
  const today=hoy();

  // Total this month for header
  let totalMes=0;
  for(const arr of byDay.values())totalMes+=arr.length;

  let gridHtml='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startWeekday+1;
    if(dayNum<1||dayNum>daysInMonth){
      gridHtml+=`<div class="mes-cell off"></div>`;
      continue;
    }
    const ds=`${year}-${String(month0+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const consultas=byDay.get(ds)||[];
    const count=consultas.length;
    const density=count===0?'':count<=2?'d1':count<=4?'d2':'d3';
    const isToday=ds===today;
    const dow=(i%7); // 0=Mon ... 5=Sat, 6=Sun
    const weekend=dow>=5?'wknd':'';
    const preview=consultas.slice(0,2).map(c=>{
      const firstName=(c.patientName||'').split(' ')[0]||'';
      const h=(c.hora||'').slice(0,5);
      return `<div class="mes-item"><span class="mes-item-h">${e(h||'--:--')}</span> <span class="mes-item-n">${e(firstName)}</span></div>`;
    }).join('');
    const more=count>2?`<div class="mes-more">+${count-2} más</div>`:'';
    gridHtml+=`<div class="mes-cell ${density} ${isToday?'hoy':''} ${weekend}" onclick="calVerDia('${ds}')" title="${count} consulta${count===1?'':'s'}">
      <div class="mes-head">
        <span class="mes-num">${dayNum}</span>
        ${count>0?`<span class="mes-badge">${count}</span>`:''}
      </div>
      ${preview}${more}
    </div>`;
  }

  document.getElementById('mainArea').innerHTML=`
    <div class="phdr">
      <div style="flex:1">
        <div class="phn">Calendario</div>
        <div class="phm">${mes} de ${year}${totalMes>0?` · ${totalMes} consulta${totalMes===1?'':'s'} este mes`:''}</div>
      </div>
      <button class="ba" onclick="toggleCalendar()">Cerrar calendario</button>
    </div>
    <div class="cal-nav">
      <div class="cal-view-toggle">
        <button class="cal-view-btn on" onclick="calVerMes()">Mes</button>
        <button class="cal-view-btn" onclick="calVerDia('${today}')">Día</button>
      </div>
      <div style="flex:1"></div>
      <button class="ba" onclick="calMesPrev()" title="Mes anterior">‹</button>
      <button class="ba" onclick="calToday()">Hoy</button>
      <button class="ba" onclick="calMesNext()" title="Mes siguiente">›</button>
    </div>
    <div class="panel cal-panel">
      <div class="mes-weekrow">
        ${WEEKDAYS_CORTO.map(w=>`<div class="mes-weekday">${w}</div>`).join('')}
      </div>
      <div class="mes-grid">
        ${gridHtml}
      </div>
    </div>`;
}
function renderCalendarDia(){
  const dateStr=calendarDate.toISOString().split('T')[0];
  const consultas=[];
  for(const p of pacientes){
    for(const c of(p.consultas||[])){
      if(c.fecha===dateStr)consultas.push({...c,patientName:p.nombre,patientId:p.id});
    }
  }
  consultas.sort((a,b)=>(a.hora||'00:00').localeCompare(b.hora||'00:00'));
  const dia=calendarDate.getDate();
  const mes=MESES_LARGO[calendarDate.getMonth()];
  const anio=calendarDate.getFullYear();
  const isToday=dateStr===hoy();
  document.getElementById('mainArea').innerHTML=`
    <div class="phdr">
      <div style="flex:1">
        <div class="phn">Calendario</div>
        <div class="phm">${dia} de ${mes} de ${anio}${isToday?' · hoy':''}${consultas.length>0?` · ${consultas.length} consulta${consultas.length===1?'':'s'}`:''}</div>
      </div>
      <button class="ba" onclick="toggleCalendar()">Cerrar calendario</button>
    </div>
    <div class="cal-nav">
      <div class="cal-view-toggle">
        <button class="cal-view-btn" onclick="calVerMes()">Mes</button>
        <button class="cal-view-btn on" onclick="calVerDia('${dateStr}')">Día</button>
      </div>
      <div style="flex:1"></div>
      <button class="ba" onclick="calPrev()" title="Día anterior">‹</button>
      <button class="ba" onclick="calToday()">Hoy</button>
      <button class="ba" onclick="calNext()" title="Día siguiente">›</button>
    </div>
    <div class="panel">
      ${consultas.length===0?
        `<div class="empty"><h3>Sin consultas</h3><p>No hay consultas agendadas para este día.</p><button class="ba" style="margin-top:14px" onclick="calVerMes()">← Volver al mes</button></div>`:
        `<div>${consultas.map(c=>`
          <div class="cc cal-row">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:14px">
              <div class="cal-time">${e(c.hora||'--:--')}</div>
              <div style="flex:1;min-width:0;cursor:pointer" onclick="abrirPacienteConsultas('${c.patientId}')">
                <div class="cct">${e(c.patientName)}</div>
                <div class="ccn" style="margin-top:2px">${e(c.tratamiento||'')}</div>
              </div>
              ${c.costo?`<span class="ccc">$${parseFloat(c.costo).toLocaleString()}</span>`:''}
              <button class="bdel bedit" onclick="event.stopPropagation();editConsFromCalendar('${c.patientId}','${c.id}')" title="Editar consulta">✎</button>
            </div>
          </div>`).join('')}
        </div>`}
    </div>`;
}

function ciInputHTML(id,value=''){
  const m=(value||'').match(/^([VJE])-?(.*)$/);
  const prefix=m?m[1]:'V';
  const num=m?m[2].replace(/\D/g,''):(value||'').replace(/\D/g,'');
  const max=prefix==='J'?9:8;
  return `<div class="ci-input">
    <select id="${id}_p" onchange="updateCIMax('${id}')">
      <option value="V"${prefix==='V'?' selected':''}>V</option>
      <option value="J"${prefix==='J'?' selected':''}>J</option>
      <option value="E"${prefix==='E'?' selected':''}>E</option>
    </select>
    <input id="${id}_n" type="text" inputmode="numeric" value="${e(num)}" maxlength="${max}" oninput="this.value=this.value.replace(/\\D/g,'')" placeholder="0000000">
  </div>`;
}
window.updateCIMax=function(id){
  const p=document.getElementById(id+'_p');
  const inp=document.getElementById(id+'_n');
  if(!p||!inp)return;
  const max=p.value==='J'?9:8;
  inp.maxLength=max;
  if(inp.value.length>max)inp.value=inp.value.slice(0,max);
}
function getCIValue(id){
  const p=document.getElementById(id+'_p');
  const n=document.getElementById(id+'_n');
  if(!p||!n)return '';
  if(!n.value)return '';
  return p.value+'-'+n.value;
}

}

// ─── ODONTOGRAMA (3.4.1 age-aware, 3.4.2 surfaces) ────────────────────────
function getOdontoMode(p){
  if(odontoMode)return odontoMode;
  const a=edadAnios(p.nacimiento);
  if(a===null||a>=12)return 'permanente';
  if(a<6)return 'decidua';
  return 'mixta';
}
function getToothState(p,n){
  const t=(p.teeth||{})[n];
  if(!t)return{dominant:'sano',surfaces:null};
  if(typeof t==='string')return{dominant:t,surfaces:null};
  // object form: {m,d,o,v,l}
  const states=SURFACE_KEYS.map(k=>t[k]||'sano').filter(s=>s!=='sano');
  if(states.length===0)return{dominant:'sano',surfaces:t};
  const counts={};
  for(const s of states)counts[s]=(counts[s]||0)+1;
  const dominant=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  return{dominant,surfaces:t};
}
function renderOdonto(){
  const p=gp();
  const mode=getOdontoMode(p);
  const legs=[
    {k:'caries',l:'Caries',bg:'var(--danger-light)',bc:'rgba(184,85,62,0.4)'},
    {k:'tratado',l:'Tratado',bg:'var(--accent-light)',bc:'var(--accent-border)'},
    {k:'ausente',l:'Ausente',bg:'var(--surface2)',bc:'var(--border)'},
    {k:'corona',l:'Corona',bg:'var(--info-light)',bc:'rgba(74,107,124,0.35)'},
    {k:'endodoncia',l:'Endodoncia',bg:'var(--warn-light)',bc:'rgba(201,169,97,0.4)'},
    {k:'protesis',l:'Prótesis',bg:'#F0EBF7',bc:'rgba(120,80,160,0.3)'},
    {k:'sano',l:'Restablecer',bg:'var(--surface2)',bc:'var(--border)'}
  ];
  function tooth(n,small=false){
    const{dominant,surfaces}=getToothState(p,n);
    const cls=`tooth ${dominant}${small?' tooth-sm':''}${surfaces?' has-surfaces':''}`;
    return `<div class="${cls}" onclick="mDiente(${n})" oncontextmenu="rDiente(event,${n})" title="Diente ${n}">
      <span class="tn">${n}</span>
      <span class="ts">${SIMBOLOS[dominant]||''}</span>
    </div>`;
  }
  function rowHTML(nums,small=false){
    const mid=nums.length/2;
    return nums.map((n,i)=>(i===mid?'<div class="ml"></div>':'')+tooth(n,small)).join('');
  }
  let chart='';
  if(mode==='permanente'){
    chart=`<div class="ow"><span class="al">Superior</span><div class="tr">${rowHTML(UPPER)}</div><div style="height:8px"></div><div class="tr">${rowHTML(LOWER)}</div><span class="al">Inferior</span></div>`;
  }else if(mode==='decidua'){
    chart=`<div class="ow"><span class="al">Superior · Decidua</span><div class="tr">${rowHTML(DECIDUOUS_UPPER)}</div><div style="height:8px"></div><div class="tr">${rowHTML(DECIDUOUS_LOWER)}</div><span class="al">Inferior · Decidua</span></div>`;
  }else{

function abrirSurfaceModal(n){
  const p=gp();
  const cur=(p.teeth||{})[n];

  const body=`<p style="font-size:12px;color:var(--text3);margin-bottom:14px">Diente ${n} — selecciona el estado de cada cara.</p>`+
    SURFACE_KEYS.map(k=>`<div class="mf"><label>${SURFACE_LABELS[k]}</label><select id="surf_${k}">
      ${states.map(s=>`<option value="${s}"${surfaces[k]===s?' selected':''}>${s}</option>`).join('')}

function initFirmas(p){

function setupSignaturePad(id,role,initialData){
  const canvas=document.getElementById(id);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#1A1A17';
  if(initialData){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src=initialData;
  }
  let drawing=false;let last=null;let touched=!!initialData;
  function pos(ev){
    const r=canvas.getBoundingClientRect();
    const e=ev.touches?ev.touches[0]:ev;
    return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
  }
  function start(ev){ev.preventDefault();drawing=true;last=pos(ev);}
  function move(ev){if(!drawing)return;ev.preventDefault();const p2=pos(ev);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();last=p2;touched=true;}
  function end(){if(!drawing)return;drawing=false;if(touched)saveFirma(role);}
  canvas.addEventListener('pointerdown',start);
  canvas.addEventListener('pointermove',move);
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('pointerleave',end);
}

window.clearFirma=async function(role){

window.updOp=function(i,k,v){

window.delOp=async function(i){

// ─── PROCEDIMIENTOS ESTÉTICOS (3.6.5 restructured) ────────────────────────
function procKey(label){return label.replace(/[^a-z0-9]/gi,'_').toLowerCase();}
function renderEst(){
  const p=gp();
  const pr=p.procs||{};
  const expanded=window.__procExpanded||(window.__procExpanded=new Set());
  let html=`<div class="card"><div class="ct-row"><div class="ct">Procedimientos estéticos / protésicos</div>${statusEl('est')}</div>`;
  for(const group of PROCS_GROUPED){
    html+=`<div class="proc-group"><div class="proc-group-title">${group.label}</div>`;
    for(const proc of group.procs){
      const k=procKey(proc);
      const d=pr[k]||{fecha:'',obs:''};
      const showDate=!PROC_NO_DATE.has(k);
      const isExp=expanded.has(k);
      html+=`<div class="proc-card">
        <div class="proc-head">
          <div class="proc-name">${proc}</div>
          ${showDate?`<input type="date" value="${e(d.fecha||'')}" onchange="updProc('${k}','fecha',this.value)" style="width:140px">`:'<span style="font-size:11px;color:var(--text3)">Sin fecha</span>'}
          <button class="ba" onclick="toggleProc('${k}')" style="font-size:11px;padding:4px 8px">${isExp?'Ocultar notas':'Notas…'}</button>
        </div>
        ${isExp?`<div class="proc-notes"><textarea oninput="updProc('${k}','obs',this.value)" placeholder="Observaciones extensas, pasos completados, decisiones técnicas…">${e(d.obs||'')}</textarea></div>`:(d.obs?`<div class="proc-preview">${e(d.obs.slice(0,120))}${d.obs.length>120?'…':''}</div>`:'')}
      </div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;
  document.getElementById('panel').innerHTML=html;
}
window.toggleProc=function(k){
  const exp=window.__procExpanded;
  if(exp.has(k))exp.delete(k);else exp.add(k);
  renderEst();
}
window.updProc=function(k,f,v){
  const p=gp();if(!p.procs)p.procs={};if(!p.procs[k])p.procs[k]={fecha:'',obs:''};
  p.procs[k][f]=v;
  autosave('est',()=>p,'ss-est');
}

let recordFilter='all';
function logAccess(patientId){
  if(accessLogged.has(patientId))return;
  accessLogged.add(patientId);
  const p=pacientes.find(x=>x.id===patientId);
  if(!p)return;
  if(!p.records)p.records=[];
  p.records.push({
    id:'a'+Date.now().toString(),
    fecha:hoy(),
    hora:ahora(),
    tipo:'acceso',
    user:auth.currentUser?.email||'desconocido',
    tratamiento:'Acceso a la historia clínica'
  });
  guardar(p).catch(()=>{});
}
function renderRec(){
  const p=gp();
  const all=[...(p.records||[])];
  const filtered=recordFilter==='all'?all:all.filter(r=>(r.tipo||'tratamiento')===recordFilter);
  const sorted=filtered.sort((a,b)=>{
    const da=(a.fecha||'')+(a.hora||'');
    const db=(b.fecha||'')+(b.hora||'');
    return db.localeCompare(da);
  });
  const counts={
    all:all.length,
    tratamiento:all.filter(r=>(r.tipo||'tratamiento')==='tratamiento').length,
    acceso:all.filter(r=>r.tipo==='acceso').length,
    edicion:all.filter(r=>r.tipo==='edicion').length
  };
  const chips=[
    {k:'all',l:'Todos',c:counts.all},
    {k:'tratamiento',l:'Tratamientos',c:counts.tratamiento},
    {k:'acceso',l:'Accesos',c:counts.acceso},
    {k:'edicion',l:'Ediciones',c:counts.edicion}
  ];
  document.getElementById('panel').innerHTML=`
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${chips.map(c=>`<button class="rec-chip${recordFilter===c.k?' on':''}" onclick="setRecFilter('${c.k}')">${c.l} <span class="badge">${c.c}</span></button>`).join('')}
      <div style="flex:1"></div>
      <button class="ba" onclick="modalRec()">+ Agregar tratamiento</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
      <table class="rtbl" style="min-width:440px"><thead><tr><th style="width:110px">Fecha</th><th style="width:80px">Tipo</th><th>Detalle</th><th style="width:36px"></th></tr></thead>
      <tbody>${sorted.length===0?
        '<tr><td colspan="4" style="font-size:12px;color:var(--text3);padding:12px">Sin registros con este filtro.</td></tr>':
        sorted.map(r=>{
          const tipo=r.tipo||'tratamiento';
          const tipoLbl={tratamiento:'Tratamiento',acceso:'Acceso',edicion:'Edición'}[tipo]||tipo;
          return `<tr>
            <td style="white-space:nowrap;color:var(--text3);font-size:11px">${ff(r.fecha)}${r.hora?' '+e(r.hora):''}</td>
            <td><span class="rec-tag rec-tag-${tipo}">${tipoLbl}</span></td>
            <td>${e(r.tratamiento||'')}${r.user?` <span style="color:var(--text3);font-size:11px">· ${e(r.user)}</span>`:''}</td>
            <td>${tipo==='tratamiento'?`<button class="bdel" onclick="delRec('${r.id}')">✕</button>`:''}</td>
          </tr>`;
        }).join('')}</tbody></table></div></div>`;
}
window.setRecFilter=function(k){recordFilter=k;renderRec();};
window.modalRec=function(){
  const today=hoy();
  abrirModal('Nuevo tratamiento',
    `<div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${today}"></div>
     <div class="mf"><label>Tratamiento realizado</label><textarea id="m_tr" placeholder="Describe el tratamiento…"></textarea></div>`,
    async()=>{
      const tr=g('m_tr').trim();
      if(!tr){alert('Ingresa el tratamiento.');return;}
      const p=gp();if(!p.records)p.records=[];
      p.records.push({id:Date.now().toString(),fecha:g('m_fe'),tipo:'tratamiento',user:auth.currentUser?.email||'',tratamiento:tr});
      await guardar(p);cerrarModal();renderRec();toast('Registro agregado');
    });
}
window.delRec=async function(rid){
  const p=gp();if(!p)return;
  const r=(p.records||[]).find(r=>r.id===rid);if(!r)return;
  p.records=(p.records||[]).filter(x=>x.id!==rid);
  await guardar(p);renderRec();
  undoToast('Registro eliminado',async()=>{
    const now=gp();if(!now)return;
    now.records=[...(now.records||[]),r];
    await guardar(now);renderRec();
  });
}

// ─── CONSULTAS (3.3.3 double-book) ────────────────────────────────────────
function renderCons(){
  const p=gp();
  const sorted=[...(p.consultas||[])].sort((a,b)=>{
    const ka=(a.fecha||'')+(a.hora||'');
    const kb=(b.fecha||'')+(b.hora||'');
    return kb.localeCompare(ka);
  });
  const total=(p.consultas||[]).reduce((s,c)=>s+(parseFloat(c.costo)||0),0);
  let html=`<button class="ba" onclick="modalCons()">+ Nueva consulta</button>`;
  if(sorted.length>0)html+=`<p style="font-size:12px;color:var(--text2);margin-bottom:14px">Total acumulado: <strong style="color:var(--forest)">$${total.toLocaleString()}</strong></p>`;
  else html+=`<p style="font-size:13px;color:var(--text3)">Sin consultas registradas aún.</p>`;
  sorted.forEach(c=>{
    html+=`<div class="cc">
      <div class="cch">
        <div>
          <div class="ccd">${ff(c.fecha)}${c.hora?' · '+e(c.hora):''}</div>
          <div class="cct">${e(c.tratamiento)}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${c.costo?`<span class="ccc">$${parseFloat(c.costo).toLocaleString()}</span>`:''}
          <button class="bdel bedit" onclick="editCons('${c.id}')" title="Editar consulta">✎</button>
          <button class="bdel" onclick="delCons('${c.id}')" title="Eliminar consulta">✕</button>
        </div>
      </div>
      ${c.notas?`<div class="ccn">${e(c.notas)}</div>`:''}
      ${c.dientes?`<div style="font-size:11px;color:var(--text3);margin-top:4px">Dientes: ${e(c.dientes)}</div>`:''}
    </div>`;
  });
  document.getElementById('panel').innerHTML=html;
}
window.modalCons=function(){
  const today=hoy();
  abrirModal('Nueva consulta',
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${today}" oninput="checkConflict()"></div>
      <div class="mf"><label>Hora</label><input type="time" id="m_ho" oninput="checkConflict()"></div>
    </div>
    <div class="mf" id="conflict-row" style="display:none"><div style="font-size:12px;color:var(--terra);padding:8px 10px;background:var(--danger-light);border-radius:6px" id="conflict-msg"></div></div>
    <div class="mf"><label>Costo ($)</label><input type="number" id="m_co" placeholder="0"></div>
    <div class="mf"><label>Tratamiento realizado *</label><input id="m_tr" placeholder="Limpieza, extracción, etc."></div>
    <div class="mf"><label>Dientes involucrados</label><input id="m_di" placeholder="Ej: 16, 17"></div>
    <div class="mf"><label>Notas clínicas</label><textarea id="m_no" placeholder="Observaciones…"></textarea></div>`,
    async()=>{
      const tr=g('m_tr').trim();
      if(!tr){alert('El tratamiento es obligatorio.');return;}
      const fecha=g('m_fe');const hora=g('m_ho');
      if(fecha&&hora){
        const conflict=consultasIndex.get(fecha+' '+hora);
        if(conflict&&conflict.patientId!==idActual){
          if(!confirm(`Ya hay una consulta a las ${hora} con ${conflict.patientName}. ¿Guardar de todos modos?`))return;
        }
      }
      const p=gp();if(!p.consultas)p.consultas=[];
      p.consultas.push({id:Date.now().toString(),fecha,hora,tratamiento:tr,notas:g('m_no'),costo:g('m_co'),dientes:g('m_di')});
      await guardar(p);cerrarModal();renderLista();renderCons();toast('Consulta registrada');
    });
}
window.editCons=function(cid){
  const p=gp();if(!p)return;
  const c=(p.consultas||[]).find(x=>x.id===cid);if(!c){toast('Consulta no encontrada');return;}
  const fechaVal=e(c.fecha||'');
  const horaVal=e(c.hora||'');
  const costoVal=e(c.costo||'');
  const trVal=e(c.tratamiento||'');
  const diVal=e(c.dientes||'');
  const noVal=e(c.notas||'');
  abrirModal('Editar consulta',
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${fechaVal}" oninput="checkConflict('${cid}')"></div>
      <div class="mf"><label>Hora</label><input type="time" id="m_ho" value="${horaVal}" oninput="checkConflict('${cid}')"></div>
    </div>
    <div class="mf" id="conflict-row" style="display:none"><div style="font-size:12px;color:var(--terra);padding:8px 10px;background:var(--danger-light);border-radius:6px" id="conflict-msg"></div></div>
    <div class="mf"><label>Costo ($)</label><input type="number" id="m_co" placeholder="0" value="${costoVal}"></div>
    <div class="mf"><label>Tratamiento realizado *</label><input id="m_tr" placeholder="Limpieza, extracción, etc." value="${trVal}"></div>
    <div class="mf"><label>Dientes involucrados</label><input id="m_di" placeholder="Ej: 16, 17" value="${diVal}"></div>
    <div class="mf"><label>Notas clínicas</label><textarea id="m_no" placeholder="Observaciones…">${noVal}</textarea></div>`,
    async()=>{
      const tr=g('m_tr').trim();
      if(!tr){alert('El tratamiento es obligatorio.');return;}
      const fecha=g('m_fe');const hora=g('m_ho');
      if(fecha&&hora){
        const conflict=consultasIndex.get(fecha+' '+hora);
        if(conflict&&!(conflict.patientId===idActual&&conflict.consultaId===cid)){
          if(!confirm(`Ya hay una consulta a las ${hora} con ${conflict.patientName}. ¿Guardar de todos modos?`))return;
        }
      }
      const now=gp();if(!now)return;
      const idx=(now.consultas||[]).findIndex(x=>x.id===cid);
      if(idx<0){toast('Consulta no encontrada');return;}
      now.consultas[idx]={...now.consultas[idx],fecha,hora,tratamiento:tr,notas:g('m_no'),costo:g('m_co'),dientes:g('m_di')};
      await guardar(now);cerrarModal();renderLista();renderCons();toast('Consulta actualizada');
    });
}
window.checkConflict=function(currentCid){
  const fecha=g('m_fe');const hora=g('m_ho');
  const row=document.getElementById('conflict-row');
  const msg=document.getElementById('conflict-msg');
  if(fecha&&hora){
    const c=consultasIndex.get(fecha+' '+hora);
    if(c&&!(c.patientId===idActual&&(currentCid?c.consultaId===currentCid:false))){
      if(c.patientId!==idActual||c.consultaId!==currentCid){
        row.style.display='block';
        msg.textContent=`Ya hay una consulta a esa hora con ${c.patientName}.`;
        return;
      }
    }
  }
  row.style.display='none';
}
window.delCons=async function(cid){
  const p=gp();if(!p)return;
  const c=(p.consultas||[]).find(c=>c.id===cid);if(!c)return;
  p.consultas=(p.consultas||[]).filter(x=>x.id!==cid);
  await guardar(p);renderLista();renderCons();
  undoToast('Consulta eliminada',async()=>{
    const now=gp();if(!now)return;
    now.consultas=[...(now.consultas||[]),c];
    await guardar(now);renderLista();renderCons();
  });
}

// ─── MODAL ────────────────────────────────────────────────────────────────
function abrirModal(titulo,body,fn){
  modalFn=fn;
  const div=document.createElement('div');
  div.className='mbg';div.id='MB';
  div.innerHTML=`<div class="mbox"><h3>${titulo}</h3>${body}<div class="mact"><button class="bc" onclick="cerrarModal()">Cancelar</button><button class="bs" onclick="confirmarModal()">Guardar</button></div></div>`;
  document.body.appendChild(div);
  setTimeout(()=>{const f=div.querySelector('input,textarea,select');if(f)f.focus();},50);
}
function cerrarModal(){const m=document.getElementById('MB');if(m)m.remove();}
function confirmarModal(){if(modalFn)modalFn();}
window.cerrarModal=cerrarModal;window.confirmarModal=confirmarModal;
window.abrirModal=abrirModal;

// ─── SIDEBAR RESIZE (3.6.6) ───────────────────────────────────────────────
function initSidebarResize(){
  const sidebar=document.getElementById('sidebar');
  if(!sidebar)return;
  const stored=parseInt(localStorage.getItem('ds_sidebar_w')||'252');
  if(stored>=200&&stored<=500&&!isMobile())sidebar.style.width=stored+'px';
  let handle=sidebar.querySelector('.resize-handle');
  if(!handle){
    handle=document.createElement('div');
    handle.className='resize-handle';
    sidebar.appendChild(handle);
  }
  let dragging=false;
  handle.addEventListener('pointerdown',e=>{
    if(isMobile())return;
    dragging=true;e.preventDefault();
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  window.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const w=Math.max(200,Math.min(500,e.clientX));
    sidebar.style.width=w+'px';
  });
  window.addEventListener('pointerup',()=>{
    if(!dragging)return;
    dragging=false;
    document.body.style.cursor='';
    document.body.style.userSelect='';
    const w=parseInt(sidebar.style.width)||252;
    localStorage.setItem('ds_sidebar_w',w.toString());
  });
}

// ─── KEYBOARD SHORTCUTS (UX polish) ───────────────────────────────────────
document.addEventListener('keydown',ev=>{
  // Cmd/Ctrl+K → focus búsqueda
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){
    ev.preventDefault();
    const s=document.getElementById('search');
    if(s){if(isMobile())document.getElementById('sidebar').classList.add('open');s.focus();s.select();}
    return;
  }
  // Ignore when typing
  const t=ev.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  // j/k navigate filtered patient list
  if(ev.key==='j'||ev.key==='k'){
    const list=Array.from(document.querySelectorAll('.pi'));
    if(list.length===0)return;
    const curIdx=list.findIndex(el=>el.classList.contains('on'));
    let next;
    if(ev.key==='j')next=list[Math.min(list.length-1,curIdx+1)]||list[0];
    else next=list[Math.max(0,curIdx-1)]||list[0];
    next?.click();
  }
  // Esc closes open modal
  if(ev.key==='Escape'){
    const mb=document.getElementById('MB');
    if(mb)cerrarModal();
  }
});

// ─── UNDO TOAST (UX polish) ───────────────────────────────────────────────
function undoToast(msg,doUndo,duration=5000){
  const old=document.getElementById('undoToast');if(old)old.remove();
  const el=document.createElement('div');
  el.id='undoToast';el.className='undo-toast';
  el.innerHTML=`<span>${msg}</span><button class="undo-btn">Deshacer</button>`;
  document.body.appendChild(el);
  let cancelled=false;
  el.querySelector('.undo-btn').addEventListener('click',async()=>{cancelled=true;el.remove();await doUndo();toast('Restaurado');});
  setTimeout(()=>{if(!cancelled&&el.parentNode)el.remove();},duration);
}
