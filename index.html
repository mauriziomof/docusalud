function ciInputHTML(id,value=''){
  const m=(value||'').match(/^([VJE])-?(.*)$/);
  const prefix=m?m[1]:'V';
  const num=m?m[2].replace(/\D/g,''):(value||'').replace(/\D/g,'');
  const max=prefix==='J'?9:8;
  return `<div class="ci-input">
    <select id="${id}_p" onchange="updateCIMax('${id}')">
      <option value="V"${prefix==='V'?' selected':''}>V</option>
      <option value="J"${prefix==='J'?' selected':''}>J</option>
      <option value="E"${prefix==='E'?' selected':''}>E</option>
    </select>
    <input id="${id}_n" type="text" inputmode="numeric" value="${e(num)}" maxlength="${max}" oninput="this.value=this.value.replace(/\\D/g,'')" placeholder="0000000">
  </div>`;
}
window.updateCIMax=function(id){
  const p=document.getElementById(id+'_p');
  const inp=document.getElementById(id+'_n');
  if(!p||!inp)return;
  const max=p.value==='J'?9:8;
  inp.maxLength=max;
  if(inp.value.length>max)inp.value=inp.value.slice(0,max);
}
function getCIValue(id){
  const p=document.getElementById(id+'_p');
  const n=document.getElementById(id+'_n');
  if(!p||!n)return '';
  if(!n.value)return '';
  return p.value+'-'+n.value;
}

}

    p.motivo=g('c_mo');p.antecedentes=g('c_an');p.patologias=g('c_pa');p.oclusion=g('c_oc');p.diagnostico=g('c_di');
    const _ant={};ANTEC_LIST.forEach(([k])=>{const el=document.getElementById('ant_'+k);if(el)_ant[k]=el.value;});const _ao=document.getElementById('ant_otras');if(_ao)_ant.otras=_ao.value;p.antecedentes_struct=_ant;
    const _hab={};HABIT_LIST.forEach(([k])=>{const s=document.getElementById('hab_'+k);if(s)_hab[k]=s.value;const d=document.getElementById('hab_'+k+'_d');if(d)_hab[k+'_d']=d.value;});const _ho=document.getElementById('hab_otros');if(_ho)_hab.otros=_ho.value;p.habitos=_hab;

// ─── ODONTOGRAMA (3.4.1 age-aware, 3.4.2 surfaces) ────────────────────────
function getOdontoMode(p){
  if(odontoMode)return odontoMode;
  const a=edadAnios(p.nacimiento);
  if(a===null||a>=12)return 'permanente';
  if(a<6)return 'decidua';
  return 'mixta';
}
function getToothState(p,n){
  const t=(p.teeth||{})[n];
  if(!t)return{dominant:'sano',surfaces:null};
  if(typeof t==='string')return{dominant:t,surfaces:null};
  // object form: {m,d,o,v,l}
  const states=SURFACE_KEYS.map(k=>t[k]||'sano').filter(s=>s!=='sano');
  if(states.length===0)return{dominant:'sano',surfaces:t};
  const counts={};
  for(const s of states)counts[s]=(counts[s]||0)+1;
  const dominant=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  return{dominant,surfaces:t};
}
// ─── TOOTH VISUALIZATION (large interactive SVG) ─────────────────────────
function getToothType(n){
  const last=n%10;
  if(last===1||last===2)return 'incisivo';
  if(last===3)return 'canino';
  if(last===4||last===5)return 'premolar';
  return 'molar';
}
function isUpperTooth(n){
  const q=Math.floor(n/10);
  return q===1||q===2||q===5||q===6;
}
function isDeciduous(n){return n>=51&&n<=85;}
function toothPosLabel(n){
  const q=Math.floor(n/10);
  const type=getToothType(n);
  const labels={incisivo:'Incisivo',canino:'Canino',premolar:'Premolar',molar:'Molar'};
  const side=(q===1||q===4||q===5||q===8)?'der.':'izq.';
  const arch=isUpperTooth(n)?'sup.':'inf.';
  const decid=isDeciduous(n)?' · temporal':'';
  return `${labels[type]} ${arch} ${side}${decid}`;
}
function getSurfaceState(p,n,k){
  const t=(p.teeth||{})[n];
  if(!t)return 'sano';
  if(typeof t==='string')return t;
  return t[k]||'sano';
}
function surfaceColors(st){
  const map={
    sano:{fill:'var(--surface)',stroke:'var(--border2)'},
    caries:{fill:'var(--danger-light)',stroke:'var(--terra)'},
    tratado:{fill:'var(--accent-light)',stroke:'var(--forest)'},
    ausente:{fill:'#E5E4DD',stroke:'var(--border2)'},
    corona:{fill:'var(--info-light)',stroke:'var(--petrol)'},
    endodoncia:{fill:'var(--warn-light)',stroke:'var(--brass)'},
    protesis:{fill:'#F0EBF7',stroke:'#7850A0'}
  };
  return map[st]||map.sano;
}

  if(type==='premolar')return `<rect x="32" y="28" width="136" height="144" rx="22" ${attrs}/>`;

  return `<rect x="22" y="50" width="156" height="100" rx="16" ${attrs}/>`; // incisivo

function renderRealisticLateral(p,n,states,type,upper,tState){
  const paths=getToothPaths(type);
  const isWhole=typeof tState==='string';
  const isAusente=isWhole&&tState==='ausente';
  const isCorona=isWhole&&tState==='corona';
  const isProtesis=isWhole&&tState==='protesis';
  const isEndo=isWhole&&tState==='endodoncia';
  const overlayState=isWhole?tState:(states.v!=='sano'?states.v:null);

  let crownFill=`url(#enamel-${n})`;
  let crownOpacity=1;
  let stateOverlay='';
  if(isAusente){
    crownFill=`url(#aus-${n})`;

  }else if(isCorona){
    crownFill=`url(#corona-${n})`;
  }else if(isProtesis){
    crownFill=`url(#protesis-${n})`;
  }else if(overlayState&&overlayState!=='sano'&&overlayState!=='corona'&&overlayState!=='protesis'&&overlayState!=='ausente'){
    const sc=surfaceColors(overlayState);

      <path d="${paths.rootDistal}" fill="url(#root-${n})" stroke="#9c8254" stroke-width="0.4" opacity="${isAusente?0.4:0.95}"/>`

        <stop offset="100%" stop-color="#D6CFB8"/>

        <stop offset="100%" stop-color="#B59C66"/>

        <stop offset="0%" stop-color="#F4D88B"/>

        <stop offset="100%" stop-color="#A88840"/>

        <rect width="8" height="8" fill="#ECEAE0"/>
        <line x1="0" y1="4" x2="8" y2="4" stroke="#9A9A8E" stroke-width="0.8"/>

      ${showPulp && paths.pulpChamber ? `<path d="${paths.pulpChamber}" fill="url(#pulp-${n})" pointer-events="none"/>` : ''}

function renderRefinedOcclusal(p,n,states,type,upper){
  const clipId=`oclip-${n}`;
  const ausPatId=`aus-${n}`;
  const mesialOnRight=mesialOnRightForTooth(n);
  const f=k=>surfaceColors(states[k]);
  const surfPoly=(k,points)=>{
    const sc=f(k);
    const isAus=states[k]==='ausente';
    const fillAttr=isAus?`fill="url(#${ausPatId})"`:`fill="${sc.fill}"`;
    return `<polygon points="${points}" ${fillAttr} stroke="${sc.stroke}" stroke-width="1.4" class="viz-surf ${states[k]!=='sano'?'on':''}" data-surf="${k}" onclick="vizClickSurface('${k}')"/>`;
  };
  const surfRect=(k,x,y,w,h,rx)=>{
    const sc=f(k);
    const isAus=states[k]==='ausente';
    const fillAttr=isAus?`fill="url(#${ausPatId})"`:`fill="${sc.fill}"`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" ${fillAttr} stroke="${sc.stroke}" stroke-width="1.4" class="viz-surf ${states[k]!=='sano'?'on':''}" data-surf="${k}" onclick="vizClickSurface('${k}')"/>`;
  };
  const cusps=decorCusps(type);
  // viewBox expanded horizontally so mesial/distal labels sit OUTSIDE the tooth rect cleanly.
  // Tooth shapes still occupy x=20-180 (centered around x=100), labels live in the side margin.
  return `<svg viewBox="-40 0 280 210" class="viz-svg" preserveAspectRatio="xMidYMid meet" aria-label="Diente ${n} vista oclusal">
    <defs>
      <clipPath id="${clipId}">${outerShapeSVG(type)}</clipPath>
      <pattern id="${ausPatId}" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
        <rect width="8" height="8" fill="#ECEAE0"/>
        <line x1="0" y1="4" x2="8" y2="4" stroke="#9A9A8E" stroke-width="0.8"/>
      </pattern>
      <filter id="ocl-shadow-${n}" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
        <feOffset dx="0" dy="1.5"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#ocl-shadow-${n})">
      <g clip-path="url(#${clipId})">
        ${surfPoly('l','20,20 70,70 130,70 180,20')}
        ${/* Mesial is always toward midline (right side of viz for Q1/Q4, left for Q2/Q3).
              Surface keys m/d still represent anatomical mesial/distal in the data; we just
              swap which screen polygon they bind to so users click visually correct sides. */ ''}
        ${mesialOnRight ?
          `${surfPoly('d','20,20 70,70 70,130 20,180')}${surfPoly('m','180,20 130,70 130,130 180,180')}` :
          `${surfPoly('m','20,20 70,70 70,130 20,180')}${surfPoly('d','180,20 130,70 130,130 180,180')}`}
        ${surfPoly('v','20,180 70,130 130,130 180,180')}
        ${surfRect('o',70,70,60,60,4)}
        ${cusps.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="#A29A85" opacity="0.4" pointer-events="none"/>`).join('')}
      </g>
      <g pointer-events="none">${outerShapeSVG(type,'fill="none" stroke="#A89F8C" stroke-width="2"')}</g>
    </g>
    <text x="100" y="108" class="viz-zone-lbl-o" text-anchor="middle" pointer-events="none">O</text>
    <text x="100" y="11" class="viz-dir-lbl" text-anchor="middle" pointer-events="none">${upper?'palatino':'lingual'}</text>
    <text x="100" y="201" class="viz-dir-lbl" text-anchor="middle" pointer-events="none">vestibular</text>
    ${mesialOnRight ?
      `<text x="-30" y="106" class="viz-dir-lbl" text-anchor="start" pointer-events="none">distal</text>
       <text x="230" y="106" class="viz-dir-lbl" text-anchor="end" pointer-events="none">mesial</text>` :
      `<text x="-30" y="106" class="viz-dir-lbl" text-anchor="start" pointer-events="none">mesial</text>
       <text x="230" y="106" class="viz-dir-lbl" text-anchor="end" pointer-events="none">distal</text>`}
  </svg>`;
}

// For right-side quadrants (Q1 upper-right, Q4 lower-right, Q5/Q8 deciduous), the
// anatomical mesial direction is toward the midline → on the RIGHT side of the viz
// (because viewer faces the patient). For left-side quadrants, mesial is on the LEFT.
function mesialOnRightForTooth(n){
  const q=Math.floor(n/10);
  return q===1||q===4||q===5||q===8;
}

function renderToothVizSVG(p,n){
  const type=getToothType(n);
  const upper=isUpperTooth(n);
  const tState=(p.teeth||{})[n];
  const states={
    m:getSurfaceState(p,n,'m'),
    d:getSurfaceState(p,n,'d'),
    o:getSurfaceState(p,n,'o'),
    v:getSurfaceState(p,n,'v'),
    l:getSurfaceState(p,n,'l')
  };
  // Lateral view removed — always render oclusal. renderRealisticLateral kept in
  // codebase for potential future use but no longer reachable from the UI.
  return renderRefinedOcclusal(p,n,states,type,upper);
}

window.vizSetTooth=function(n){vizToothN=n;renderOdonto();};

window.vizClickSurface=async function(k){
  const p=gp();if(!p.teeth)p.teeth={};
  const n=vizToothN;if(!n)return;
  const cur=p.teeth[n];
  // Convert whole-tooth state to per-surface so user can edit individual faces
  let surf;
  if(typeof cur==='object'&&cur!==null){
    surf={...cur};
  }else if(typeof cur==='string'){
    surf={m:cur,d:cur,o:cur,v:cur,l:cur};
  }else{
    surf={m:'sano',d:'sano',o:'sano',v:'sano',l:'sano'};
  }
  surf[k]=estadoDiente;
  // If all sano → clear; if all same and not sano → store as string
  const vals=SURFACE_KEYS.map(s=>surf[s]);
  if(vals.every(v=>v==='sano')){
    delete p.teeth[n];
  }else if(vals.every(v=>v===vals[0])){
    p.teeth[n]=vals[0];
  }else{

};

function renderOdonto(){
  const p=gp();
  const mode=getOdontoMode(p);
  const legs=[
    {k:'caries',l:'Caries',bg:'var(--danger-light)',bc:'rgba(184,85,62,0.4)'},

    {k:'corona',l:'Corona',bg:'var(--info-light)',bc:'rgba(74,107,124,0.35)'},

    {k:'protesis',l:'Prótesis',bg:'#F0EBF7',bc:'rgba(120,80,160,0.3)'},
    {k:'sano',l:'Restablecer',bg:'var(--surface2)',bc:'var(--border)'}
  ];
  function tooth(n,small=false){
    const{dominant,surfaces}=getToothState(p,n);

      <div class="tr">${rowHTML(LOWER)}</div>
      <span class="al">Inferior · Permanente</span>
    </div>`;
  }
  const a=edadAnios(p.nacimiento);
  const autoMode=a===null||a>=12?'permanente':(a<6?'decidua':'mixta');
  const vizPanel=renderToothVizPanel(p,mode);
  document.getElementById('panel').innerHTML=`
    <div class="card">
      <div class="ct-row"><div class="ct">Odontograma${a!==null?' · '+a+' años':''}</div>${statusEl('odonto')}</div>
      <div class="odonto-controls">
        <label class="ctl-lbl">Dentición:</label>
        <select onchange="setOdontoMode(this.value)">
          <option value="">Auto (${autoMode})</option>
          ${['permanente','decidua','mixta'].filter(m=>m!==autoMode).map(m=>`<option value="${m}"${odontoMode===m?' selected':''}>${m.charAt(0).toUpperCase()+m.slice(1)}</option>`).join('')}
        </select>

      </div>
      <div class="tleg">${legs.map(l=>`<div class="leg${l.k===estadoDiente?' sel':''}" onclick="setEst('${l.k}')"><div class="ld" style="background:${l.bg};border-color:${l.bc}"></div>${l.l}</div>`).join('')}</div>
      <div class="odonto-layout">

function setupSignaturePad(id,role,initialData){
  const canvas=document.getElementById(id);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#1A1A17';
  if(initialData){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src=initialData;
  }
  let drawing=false;let last=null;let touched=!!initialData;
  function pos(ev){
    const r=canvas.getBoundingClientRect();
    const e=ev.touches?ev.touches[0]:ev;
    return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
  }
  function start(ev){ev.preventDefault();drawing=true;last=pos(ev);}
  function move(ev){if(!drawing)return;ev.preventDefault();const p2=pos(ev);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();last=p2;touched=true;}
  function end(){if(!drawing)return;drawing=false;if(touched)saveFirma(role);}
  canvas.addEventListener('pointerdown',start);
  canvas.addEventListener('pointermove',move);
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('pointerleave',end);
}

let recordFilter='all';
function logAccess(patientId){
  // Admin accesses are invisible to the patient owner — no audit trail entry written.
  // This way regular users don't see "desconocido" or admin emails in their Récord.
  if(isAdmin)return;
  if(accessLogged.has(patientId))return;
  accessLogged.add(patientId);
  const p=pacientes.find(x=>x.id===patientId);
  if(!p)return;
  if(!p.records)p.records=[];
  p.records.push({
    id:'a'+Date.now().toString(),
    fecha:hoy(),
    hora:ahora(),
    tipo:'acceso',
    user:auth.currentUser?.email||'desconocido',
    tratamiento:'Acceso a la historia clínica'
  });
  guardar(p).catch(()=>{});
}
function renderRec(){
  const p=gp();
  const all=[...(p.records||[])];
  const filtered=recordFilter==='all'?all:all.filter(r=>(r.tipo||'tratamiento')===recordFilter);
  const sorted=filtered.sort((a,b)=>{
    const da=(a.fecha||'')+(a.hora||'');
    const db=(b.fecha||'')+(b.hora||'');
    return db.localeCompare(da);
  });
  const counts={
    all:all.length,
    tratamiento:all.filter(r=>(r.tipo||'tratamiento')==='tratamiento').length,
    acceso:all.filter(r=>r.tipo==='acceso').length,
    edicion:all.filter(r=>r.tipo==='edicion').length
  };
  const chips=[
    {k:'all',l:'Todos',c:counts.all},
    {k:'tratamiento',l:'Tratamientos',c:counts.tratamiento},
    {k:'acceso',l:'Accesos',c:counts.acceso},
    {k:'edicion',l:'Ediciones',c:counts.edicion}
  ];
  document.getElementById('panel').innerHTML=`
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${chips.map(c=>`<button class="rec-chip${recordFilter===c.k?' on':''}" onclick="setRecFilter('${c.k}')">${c.l} <span class="badge">${c.c}</span></button>`).join('')}
      <div style="flex:1"></div>
      <button class="ba" onclick="modalRec()">+ Agregar tratamiento</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
      <table class="rtbl" style="min-width:440px"><thead><tr><th style="width:110px">Fecha</th><th style="width:80px">Tipo</th><th>Detalle</th><th style="width:36px"></th></tr></thead>
      <tbody>${sorted.length===0?
        '<tr><td colspan="4" style="font-size:12px;color:var(--text3);padding:12px">Sin registros con este filtro.</td></tr>':
        sorted.map(r=>{
          const tipo=r.tipo||'tratamiento';
          const tipoLbl={tratamiento:'Tratamiento',acceso:'Acceso',edicion:'Edición'}[tipo]||tipo;
          return `<tr>
            <td style="white-space:nowrap;color:var(--text3);font-size:11px">${ff(r.fecha)}${r.hora?' '+e(r.hora):''}</td>
            <td><span class="rec-tag rec-tag-${tipo}">${tipoLbl}</span></td>
            <td>${e(r.tratamiento||'')}${r.user?` <span style="color:var(--text3);font-size:11px">· ${e(r.user)}</span>`:''}</td>
            <td>${tipo==='tratamiento'?`<button class="bdel" onclick="delRec('${r.id}')">✕</button>`:''}</td>
          </tr>`;
        }).join('')}</tbody></table></div></div>`;
}
window.setRecFilter=function(k){recordFilter=k;renderRec();};
window.modalRec=function(){
  const today=hoy();
  abrirModal('Nuevo tratamiento',
    `<div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${today}"></div>
     <div class="mf"><label>Tratamiento realizado</label><textarea id="m_tr" placeholder="Describe el tratamiento…"></textarea></div>`,
    async()=>{
      const tr=g('m_tr').trim();
      if(!tr){alert('Ingresa el tratamiento.');return;}
      const p=gp();if(!p.records)p.records=[];
      p.records.push({id:Date.now().toString(),fecha:g('m_fe'),tipo:'tratamiento',user:auth.currentUser?.email||'',tratamiento:tr});
      await guardar(p);cerrarModal();renderRec();toast('Registro agregado');
    });
}
window.delRec=async function(rid){
  const p=gp();if(!p)return;
  const r=(p.records||[]).find(r=>r.id===rid);if(!r)return;
  p.records=(p.records||[]).filter(x=>x.id!==rid);
  await guardar(p);renderRec();
  undoToast('Registro eliminado',async()=>{
    const now=gp();if(!now)return;
    now.records=[...(now.records||[]),r];
    await guardar(now);renderRec();
  });
}

// ─── CONSULTAS (3.3.3 double-book) ────────────────────────────────────────
function renderCons(){
  const p=gp();
  const sorted=[...(p.consultas||[])].sort((a,b)=>{
    const ka=(a.fecha||'')+(a.hora||'');
    const kb=(b.fecha||'')+(b.hora||'');
    return kb.localeCompare(ka);
  });
  const total=(p.consultas||[]).reduce((s,c)=>s+(parseFloat(c.costo)||0),0);
  let html=`<button class="ba" onclick="modalCons()">+ Nueva consulta</button>`;
  if(sorted.length>0)html+=`<p style="font-size:12px;color:var(--text2);margin-bottom:14px">Total acumulado: <strong style="color:var(--forest)">$${total.toLocaleString()}</strong></p>`;
  else html+=`<p style="font-size:13px;color:var(--text3)">Sin consultas registradas aún.</p>`;
  sorted.forEach(c=>{
    html+=`<div class="cc">
      <div class="cch">
        <div>
          <div class="ccd">${ff(c.fecha)}${c.hora?' · '+e(c.hora):''}</div>
          <div class="cct">${e(c.tratamiento)}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${c.costo?`<span class="ccc">$${parseFloat(c.costo).toLocaleString()}</span>`:''}
          <button class="bdel bedit" onclick="editCons('${c.id}')" title="Editar consulta">✎</button>
          <button class="bdel" onclick="delCons('${c.id}')" title="Eliminar consulta">✕</button>
        </div>
      </div>
      ${c.notas?`<div class="ccn">${e(c.notas)}</div>`:''}
      ${c.dientes?`<div style="font-size:11px;color:var(--text3);margin-top:4px">Dientes: ${e(c.dientes)}</div>`:''}
    </div>`;
  });
  document.getElementById('panel').innerHTML=html;
}
window.modalCons=function(){
  const today=hoy();
  abrirModal('Nueva consulta',
    `<div class="modal-grid-2">
      <div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${today}" oninput="checkConflict()"></div>
      <div class="mf"><label>Hora</label><input type="time" id="m_ho" oninput="checkConflict()"></div>
    </div>
    <div class="mf" id="conflict-row" style="display:none"><div style="font-size:12px;color:var(--terra);padding:8px 10px;background:var(--danger-light);border-radius:6px" id="conflict-msg"></div></div>
    <div class="mf"><label>Costo ($)</label><input type="number" id="m_co" placeholder="0"></div>
    <div class="mf"><label>Tratamiento realizado *</label><input id="m_tr" placeholder="Limpieza, extracción, etc."></div>
    <div class="mf"><label>Dientes involucrados</label><input id="m_di" placeholder="Ej: 16, 17"></div>
    <div class="mf"><label>Notas clínicas</label><textarea id="m_no" placeholder="Observaciones…"></textarea></div>`,
    async()=>{
      const tr=g('m_tr').trim();
      if(!tr){alert('El tratamiento es obligatorio.');return;}
      const fecha=g('m_fe');const hora=g('m_ho');
      if(fecha&&hora){
        const conflict=consultasIndex.get(fecha+' '+hora);
        if(conflict&&conflict.patientId!==idActual){
          if(!confirm(`Ya hay una consulta a las ${hora} con ${conflict.patientName}. ¿Guardar de todos modos?`))return;
        }
      }
      const p=gp();if(!p.consultas)p.consultas=[];
      p.consultas.push({id:Date.now().toString(),fecha,hora,tratamiento:tr,notas:g('m_no'),costo:g('m_co'),dientes:g('m_di')});
      await guardar(p);cerrarModal();renderLista();renderCons();toast('Consulta registrada');
    });
}
window.editCons=function(cid){
  const p=gp();if(!p)return;
  const c=(p.consultas||[]).find(x=>x.id===cid);if(!c){toast('Consulta no encontrada');return;}
  const fechaVal=e(c.fecha||'');
  const horaVal=e(c.hora||'');
  const costoVal=e(c.costo||'');
  const trVal=e(c.tratamiento||'');
  const diVal=e(c.dientes||'');
  const noVal=e(c.notas||'');
  abrirModal('Editar consulta',
    `<div class="modal-grid-2">
      <div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${fechaVal}" oninput="checkConflict('${cid}')"></div>
      <div class="mf"><label>Hora</label><input type="time" id="m_ho" value="${horaVal}" oninput="checkConflict('${cid}')"></div>
    </div>
    <div class="mf" id="conflict-row" style="display:none"><div style="font-size:12px;color:var(--terra);padding:8px 10px;background:var(--danger-light);border-radius:6px" id="conflict-msg"></div></div>
    <div class="mf"><label>Costo ($)</label><input type="number" id="m_co" placeholder="0" value="${costoVal}"></div>
    <div class="mf"><label>Tratamiento realizado *</label><input id="m_tr" placeholder="Limpieza, extracción, etc." value="${trVal}"></div>
    <div class="mf"><label>Dientes involucrados</label><input id="m_di" placeholder="Ej: 16, 17" value="${diVal}"></div>
    <div class="mf"><label>Notas clínicas</label><textarea id="m_no" placeholder="Observaciones…">${noVal}</textarea></div>`,
    async()=>{
      const tr=g('m_tr').trim();
      if(!tr){alert('El tratamiento es obligatorio.');return;}
      const fecha=g('m_fe');const hora=g('m_ho');
      if(fecha&&hora){
        const conflict=consultasIndex.get(fecha+' '+hora);
        if(conflict&&!(conflict.patientId===idActual&&conflict.consultaId===cid)){
          if(!confirm(`Ya hay una consulta a las ${hora} con ${conflict.patientName}. ¿Guardar de todos modos?`))return;
        }
      }
      const now=gp();if(!now)return;
      const idx=(now.consultas||[]).findIndex(x=>x.id===cid);
      if(idx<0){toast('Consulta no encontrada');return;}
      now.consultas[idx]={...now.consultas[idx],fecha,hora,tratamiento:tr,notas:g('m_no'),costo:g('m_co'),dientes:g('m_di')};
      await guardar(now);cerrarModal();renderLista();renderCons();toast('Consulta actualizada');
    });
}
window.checkConflict=function(currentCid){
  const fecha=g('m_fe');const hora=g('m_ho');
  const row=document.getElementById('conflict-row');
  const msg=document.getElementById('conflict-msg');
  if(fecha&&hora){
    const c=consultasIndex.get(fecha+' '+hora);
    if(c&&!(c.patientId===idActual&&(currentCid?c.consultaId===currentCid:false))){
      if(c.patientId!==idActual||c.consultaId!==currentCid){
        row.style.display='block';
        msg.textContent=`Ya hay una consulta a esa hora con ${c.patientName}.`;
        return;
      }
    }
  }
  row.style.display='none';
}
window.delCons=async function(cid){
  const p=gp();if(!p)return;
  const c=(p.consultas||[]).find(c=>c.id===cid);if(!c)return;
  p.consultas=(p.consultas||[]).filter(x=>x.id!==cid);
  await guardar(p);renderLista();renderCons();
  undoToast('Consulta eliminada',async()=>{
    const now=gp();if(!now)return;
    now.consultas=[...(now.consultas||[]),c];
    await guardar(now);renderLista();renderCons();
  });
}

// ─── MODAL ────────────────────────────────────────────────────────────────
function abrirModal(titulo,body,fn){
  modalFn=fn;
  const div=document.createElement('div');
  div.className='mbg';div.id='MB';
  div.innerHTML=`<div class="mbox"><h3>${titulo}</h3>${body}<div class="mact"><button class="bc" onclick="cerrarModal()">Cancelar</button><button class="bs" onclick="confirmarModal()">Guardar</button></div></div>`;
  document.body.appendChild(div);
  setTimeout(()=>{const f=div.querySelector('input,textarea,select');if(f)f.focus();initAutoGrow(div);},50);
}
function cerrarModal(){const m=document.getElementById('MB');if(m)m.remove();}
async function confirmarModal(){
  if(!modalFn)return;
  const m=document.getElementById('MB');
  const btn=m&&m.querySelector('.bs');
  if(btn){ if(btn.disabled)return; btn.disabled=true; btn.dataset._t=btn.textContent; btn.textContent='Guardando…'; }
  try{ await modalFn(); }
  finally{ const m2=document.getElementById('MB'); const b2=m2&&m2.querySelector('.bs'); if(b2){ b2.disabled=false; b2.textContent=b2.dataset._t||'Guardar'; } }
}
window.cerrarModal=cerrarModal;window.confirmarModal=confirmarModal;
window.abrirModal=abrirModal;

// ─── NEW PATIENT (3.2.1, 3.2.2, 3.2.3, 3.2.4) ─────────────────────────────
window.modalNuevo=function(){
  abrirModal('Nuevo paciente',
    `<div class="mf"><label>Nombre completo *</label><input id="m_no" placeholder="Nombre y apellidos" required></div>
     <div class="mf"><label>Cédula *</label>${ciInputHTML('m_ci','')}</div>
     <div class="mf"><label>Teléfono *</label><input ${phoneInputAttrs('m_te','')} required></div>
     <div class="modal-grid-2">
       <div class="mf"><label>Fecha de nacimiento *</label><input type="date" id="m_na" required></div>
       <div class="mf"><label>Sexo *</label><select id="m_sx" required><option value="">—</option><option value="F">Femenino</option><option value="M">Masculino</option><option value="O">Otro</option></select></div>
     </div>
     <div id="m_err" style="font-size:12px;color:var(--terra);min-height:14px;margin-top:4px"></div>
     <p style="font-size:11px;color:var(--text3);margin-top:4px;font-style:italic">* Campos obligatorios</p>`,
    async()=>{
      const errDiv=document.getElementById('m_err');
      errDiv.textContent='';
      const nombre=g('m_no').trim();
      const ci=getCIValue('m_ci');
      const telefono=(g('m_te')||'').trim();
      const nacimiento=g('m_na');
      const sexo=g('m_sx');
      // Required-field validation (v7-5)
      const missing=[];
      if(!nombre)missing.push('Nombre completo');
      if(!ci)missing.push('Cédula');
      if(!telefono)missing.push('Teléfono');
      if(!nacimiento)missing.push('Fecha de nacimiento');
      if(!sexo)missing.push('Sexo');
      if(missing.length){
        errDiv.textContent=`Falta completar: ${missing.join(', ')}.`;
        return;
      }
      // Format checks
      if(telefono.length<7){errDiv.textContent='El teléfono debe tener al menos 7 dígitos.';return;}
      if(ci){
        const dup=await ciExists(ci);
        if(dup){errDiv.textContent=`Ya existe un paciente con la cédula ${ci}: ${dup.nombre}`;return;}
      }
      const data={
        nombre,ci,telefono,nacimiento,sexo,
        telefono2:'',email:'',motivo:'',antecedentes:'',patologias:'',oclusion:'',diagnostico:'',
        plan:'',plan_aceptado:'',restauracion:'',material:'',color_dental:'',color_deseado:'',laboratorio:'',indicaciones_tecnico:'',obs_importantes:'',
        teeth:{},teeth_obs:'',operatorias:[],procs:{},especialistas:[],records:[],consultas:[],firmas:{}
      };
      const newId=await crear(data);
      if(newId){idActual=newId;cerrarModal();logAccess(newId);renderPaciente();toast(`Bienvenida, ${nombre.split(' ')[0]}`);}
    });
}

// ─── SIDEBAR RESIZE (3.6.6) ───────────────────────────────────────────────
function initSidebarResize(){
  const sidebar=document.getElementById('sidebar');
  if(!sidebar)return;
  const stored=parseInt(localStorage.getItem('ds_sidebar_w')||'252');
  if(stored>=200&&stored<=500&&!isMobile())sidebar.style.width=stored+'px';
  let handle=sidebar.querySelector('.resize-handle');
  if(!handle){
    handle=document.createElement('div');
    handle.className='resize-handle';
    sidebar.appendChild(handle);
  }
  let dragging=false;
  handle.addEventListener('pointerdown',e=>{
    if(isMobile())return;
    dragging=true;e.preventDefault();
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  window.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const w=Math.max(200,Math.min(500,e.clientX));
    sidebar.style.width=w+'px';
  });
  window.addEventListener('pointerup',()=>{
    if(!dragging)return;
    dragging=false;
    document.body.style.cursor='';
    document.body.style.userSelect='';
    const w=parseInt(sidebar.style.width)||252;
    localStorage.setItem('ds_sidebar_w',w.toString());
  });
}

// ─── KEYBOARD SHORTCUTS (UX polish) ───────────────────────────────────────
document.addEventListener('keydown',ev=>{
  // Cmd/Ctrl+K → focus búsqueda
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){
    ev.preventDefault();
    const s=document.getElementById('search');
    if(s){if(isMobile())document.getElementById('sidebar').classList.add('open');s.focus();s.select();}
    return;
  }
  // Ignore when typing
  const t=ev.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  // j/k navigate filtered patient list
  if(ev.key==='j'||ev.key==='k'){
    const list=Array.from(document.querySelectorAll('.pi'));
    if(list.length===0)return;
    const curIdx=list.findIndex(el=>el.classList.contains('on'));
    let next;
    if(ev.key==='j')next=list[Math.min(list.length-1,curIdx+1)]||list[0];
    else next=list[Math.max(0,curIdx-1)]||list[0];
    next?.click();
  }
  // Esc closes open modal
  if(ev.key==='Escape'){
    const mb=document.getElementById('MB');
    if(mb)cerrarModal();
  }
});

// ─── UNDO TOAST (UX polish) ───────────────────────────────────────────────
function undoToast(msg,doUndo,duration=5000){
  const old=document.getElementById('undoToast');if(old)old.remove();
  const el=document.createElement('div');
  el.id='undoToast';el.className='undo-toast';
  el.innerHTML=`<span>${msg}</span><button class="undo-btn">Deshacer</button>`;
  document.body.appendChild(el);
  let cancelled=false;
  el.querySelector('.undo-btn').addEventListener('click',async()=>{cancelled=true;el.remove();await doUndo();toast('Restaurado');});
  setTimeout(()=>{if(!cancelled&&el.parentNode)el.remove();},duration);
}

ss('ing','Conectando...');
