<style>
/* ── TOKENS ─────────────────────────────────────────────────────────── */
:root {
  --forest:   #1F3A2A;
  --sage:     #2F5D3A;
  --olive:    #7A8A6E;
  /* Palette refined per brand book v2 (May 2026): */
  --mist:     #E3E7DA;
  --charcoal: #1A1A17;
  --slate:    #5C5C56;
  --cream:    #F2EFE6;
  --bone:     #FAF9F6;
  --terra:    #B8553E;
  --brass:    #D2B385;
  --petrol:   #4A6B7C;

  --bg:       var(--cream);
  --surface:  var(--bone);
  --surface2: #EDE9DF;
  --border:   rgba(31,58,42,0.12);
  --border2:  rgba(31,58,42,0.22);
  --text:     var(--charcoal);
  --text2:    var(--slate);
  --text3:    var(--olive);
  --accent:   var(--forest);
  --accent-light: var(--mist);
  --accent-border: rgba(31,58,42,0.3);
  --danger:   var(--terra);
  --danger-light: #F7EAE7;
  --warn:     var(--brass);
  --warn-light: #F7F1E0;
  --info:     var(--petrol);
  --info-light: #E5EDF0;

  --r: 8px;
  --rl: 12px;
  --border-default: 0.5px solid var(--border);
}

/* DARK MODE */
[data-theme="dark"] {
  --bg:       #141410;
  --surface:  #1E1E19;
  --surface2: #252520;
  --border:   rgba(220,227,210,0.1);
  --border2:  rgba(220,227,210,0.18);
  --text:     #EDEAE0;
  --text2:    #9A9A8E;
  --text3:    #7A8A6E;
  --accent:   #2F5D3A;
  --accent-light: rgba(31,58,42,0.25);
  --accent-border: rgba(47,93,58,0.5);
  --danger-light: rgba(184,85,62,0.15);
  --warn-light: rgba(201,169,97,0.15);
  --info-light: rgba(74,107,124,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  overflow-x: hidden;
  max-width: 100vw;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

/* ── LOGIN ──────────────────────────────────────────────────────────── */
.lbg {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.lbox {
  background: var(--surface);
  border: var(--border-default);
  border-radius: var(--rl);
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  text-align: center;
  max-height: 92dvh;
  overflow-y: auto;
}
.lbox h2 {
  font-family: 'DM Sans', sans-serif;
  font-size: 30px; font-weight: 400;
  color: var(--text); margin-bottom: 6px;
  letter-spacing: -0.015em; line-height: 1;
  text-transform: lowercase;
}
.lbox h2 span { font-weight: 700; color: var(--forest); }
.lbox p { font-size: 11px; color: var(--text3); margin-bottom: 28px; letter-spacing: 0.18em; text-transform: uppercase; }

/* ── AUTH VIEWS (login / signup / forgot password) ─────────────────────── */
.auth-view { display: block; }
.auth-title-row {
  display: grid; grid-template-columns: 90px 1fr; gap: 8px; margin-bottom: 12px;
}
.auth-title-row select {
  padding: 12px 10px; font-size: 16px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text);
  outline: none; cursor: pointer; text-align: center;
}
.auth-title-row select:focus { border-color: var(--forest); }
.auth-title-row input { margin-bottom: 0 !important; }
.auth-links {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 16px; padding-top: 16px;
  border-top: 0.5px solid var(--border);
}
.auth-link {
  background: none; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 12px;
  color: var(--text2); letter-spacing: 0.04em;
  padding: 4px 0; transition: color 0.12s var(--ease, ease);
  text-align: center;
}
.auth-link:hover { color: var(--forest); }
.auth-help {
  font-size: 12px; color: var(--text2); margin-bottom: 18px;
  text-align: center; line-height: 1.5;
  font-style: normal; font-family: 'DM Sans', sans-serif;
  letter-spacing: 0; text-transform: none;
}
.auth-success {
  font-size: 12px; color: var(--forest); margin-top: 12px;
  padding: 10px 12px; background: var(--accent-light);
  border-radius: var(--r); text-align: center;
  border: 0.5px solid var(--accent-border);
  min-height: 0;
}
.auth-success:empty { display: none; }
.lbox input {
  width: 100%; padding: 12px 14px;
  /* 16px font-size prevents iOS Safari auto-zoom on focus */
  font-size: 16px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text);
  outline: none; text-align: center; letter-spacing: 0.12em;
  margin-bottom: 12px; transition: border 0.15s;
}
.lbox input:focus { border-color: var(--forest); }
.lbox button {
  width: 100%; padding: 12px;
  font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist);
  border: none; border-radius: var(--r); cursor: pointer;
  letter-spacing: 0.04em; transition: opacity 0.15s;
}
.lbox button:hover { opacity: 0.88; }
.lerr { font-size: 12px; color: var(--terra); margin-top: 10px; min-height: 16px; }

/* ── TOPBAR ─────────────────────────────────────────────────────────── */
.topbar {
  background: var(--surface);
  border-bottom: var(--border-default);
  padding: 0 20px; height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 18px; font-weight: 400; color: var(--text);
  letter-spacing: -0.015em; line-height: 1;
  text-transform: lowercase;
}
.brand-name span { font-weight: 700; color: var(--forest); }
.brand-sub { font-size: 9px; color: var(--text3); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 4px; }
.ds-logo { flex-shrink: 0; display: block; }
.ds-logo rect:first-of-type, .ds-logo path { transition: opacity 0.2s var(--ease, ease); }
.sync-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); margin-left: 18px; margin-right: auto; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
.dot.ok { background: #4CAF7D; }
.dot.ing { background: var(--brass); animation: pu 1s infinite; }
.dot.err { background: var(--terra); }
@keyframes pu { 0%,100%{opacity:1} 50%{opacity:.3} }
.tbtn {
  padding: 6px 11px; font-size: 11px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: transparent; color: var(--text2); cursor: pointer;
  letter-spacing: 0.02em; transition: all 0.12s;
}
.tbtn:hover { background: var(--surface2); }
.dark-toggle {
  width: 32px; height: 32px; border-radius: 50%;
  border: var(--border-default); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; color: var(--text2); padding: 0;
}
.dark-toggle:hover { background: var(--surface2); color: var(--text); }
.dark-icon { width: 16px; height: 16px; }
.dark-icon-sun { display: none; }
[data-theme="dark"] .dark-icon-moon { display: none; }
[data-theme="dark"] .dark-icon-sun { display: block; }

/* ── LAYOUT ─────────────────────────────────────────────────────────── */
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 252px; min-width: 252px;
  background: var(--surface);
  border-right: var(--border-default);
  display: flex; flex-direction: column;
}
.stop { padding: 12px; }
.swrap { position: relative; margin-bottom: 8px; }
.swrap::before { content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; color: var(--text3); }
.swrap input {
  width: 100%; padding: 7px 10px 7px 30px;
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none;
  transition: border 0.12s;
}
.swrap input:focus { border-color: var(--forest); }
.bnew {
  width: 100%; padding: 8px;
  font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist);
  border: none; border-radius: var(--r); cursor: pointer;
  letter-spacing: 0.02em; transition: opacity 0.12s;
}
.bnew:hover { opacity: 0.88; }
.plist { flex: 1; overflow-y: auto; padding: 6px; }
.pi {
  padding: 10px 11px; border-radius: var(--r);
  cursor: pointer; margin-bottom: 2px;
  border: 0.5px solid transparent; transition: all 0.1s;
}
.pi:hover { background: var(--surface2); }
.pi.on { background: var(--accent-light); border-color: var(--accent-border); }
.pn { font-size: 13px; font-weight: 500; color: var(--text); }
.pi.on .pn { color: var(--forest); }
.pm { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sfoot { padding: 10px 12px; border-top: var(--border-default); font-size: 11px; color: var(--text3); text-align: center; letter-spacing: 0.04em; }

/* ── MAIN ───────────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.phdr {
  background: var(--surface); border-bottom: var(--border-default);
  padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.pav {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--mist); border: 0.5px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--forest); flex-shrink: 0;
  letter-spacing: -0.02em;
}
.phn { font-size: 15px; font-weight: 500; color: var(--text); }
.phm { font-size: 11px; color: var(--text3); margin-top: 2px; letter-spacing: 0.02em; }
.tabbar {
  background: var(--surface); border-bottom: var(--border-default);
  padding: 0 16px; display: flex; overflow-x: auto; flex-shrink: 0;
}
.tabbar::-webkit-scrollbar { height: 0; }
.tab {
  padding: 12px 13px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  color: var(--text3); border: none; background: none; cursor: pointer;
  border-bottom: 1.5px solid transparent; margin-bottom: -0.5px;
  white-space: nowrap; transition: all 0.1s; letter-spacing: 0.01em;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--forest); border-bottom-color: var(--forest); font-weight: 500; }
.panel { flex: 1; overflow-y: auto; padding: 20px; }

/* ── EMPTY ──────────────────────────────────────────────────────────── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; }
.empty h3 { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: -0.015em; line-height: 1; text-transform: lowercase; }
.empty h3 span { font-weight: 700; color: var(--forest); }
.empty p { font-size: 13px; color: var(--text3); }

/* ── CARDS ──────────────────────────────────────────────────────────── */
.card { background: var(--surface); border: var(--border-default); border-radius: var(--rl); padding: 16px 18px; margin-bottom: 14px; }
.ct { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: var(--text3); text-transform: uppercase; margin-bottom: 14px; }
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.fg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.f { display: flex; flex-direction: column; gap: 4px; }
.f.full { grid-column: 1/-1; }
.f label { font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
.f input,.f select,.f textarea {
  padding: 8px 10px; font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none; transition: border 0.12s;
}
.f input:focus,.f select:focus,.f textarea:focus { border-color: var(--forest); background: var(--surface); }
.f textarea { resize: vertical; min-height: 68px; line-height: 1.65; }

/* ── BUTTONS ────────────────────────────────────────────────────────── */
.bs {
  padding: 9px 20px; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist); border: none; border-radius: var(--r);
  cursor: pointer; letter-spacing: 0.03em; transition: opacity 0.12s;
}
.bs:hover { opacity: 0.88; }
.bd {
  padding: 9px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  background: none; color: var(--terra); border: 0.5px solid rgba(184,85,62,0.35);
  border-radius: var(--r); cursor: pointer; transition: all 0.12s;
}
.bd:hover { background: var(--danger-light); }
.ba {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface); color: var(--text2); cursor: pointer;
  margin-bottom: 12px; transition: all 0.12s; letter-spacing: 0.01em;
}
.ba:hover { background: var(--surface2); border-color: var(--border2); }

/* ── ODONTOGRAMA ────────────────────────────────────────────────────── */
.ow { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.al { font-size: 9px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.12em; }
.tr { display: flex; gap: 3px; }
.tooth {
  width: 30px; height: 38px; border: var(--border-default); border-radius: 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; background: var(--surface2); transition: all 0.1s; gap: 1px;
}
.tooth:hover { transform: translateY(-1px); border-color: var(--border2); }
.tooth .tn { font-size: 8px; color: var(--text3); line-height: 1; }
.tooth .ts { font-size: 10px; font-weight: 500; line-height: 1; }
.tooth.caries { background: var(--danger-light); border-color: rgba(184,85,62,0.4); } .tooth.caries .ts { color: var(--terra); }
.tooth.tratado { background: var(--accent-light); border-color: var(--accent-border); } .tooth.tratado .ts { color: var(--forest); }
.tooth.ausente { opacity: .4; } .tooth.ausente .ts { color: var(--text3); }
.tooth.corona { background: var(--info-light); border-color: rgba(74,107,124,0.35); } .tooth.corona .ts { color: var(--petrol); }
.tooth.endodoncia { background: var(--warn-light); border-color: rgba(201,169,97,0.4); } .tooth.endodoncia .ts { color: var(--brass); }
.tooth.protesis { background: #F0EBF7; border-color: rgba(120,80,160,0.3); } .tooth.protesis .ts { color: #785090; }
.ml { width: 0.5px; background: var(--border2); height: 36px; margin: 0 3px; align-self: center; }
.tleg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
.leg {
  display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2);
  cursor: pointer; padding: 4px 10px; border-radius: 20px;
  border: var(--border-default); background: var(--surface); user-select: none; transition: all 0.1s;
}
.leg:hover { border-color: var(--border2); }
.leg.sel { border-color: var(--forest); background: var(--accent-light); color: var(--forest); font-weight: 500; }
.ld { width: 10px; height: 10px; border-radius: 2px; border: 0.5px solid; }

/* ── TABLES ─────────────────────────────────────────────────────────── */
.ptbl,.otbl,.rtbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.ptbl th,.otbl th,.rtbl th {
  font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.08em;
  padding: 6px 8px; border-bottom: var(--border-default); background: var(--surface2); text-align: left; text-transform: uppercase;
}
.ptbl td,.otbl td { padding: 5px 7px; border-bottom: var(--border-default); vertical-align: middle; }
.ptbl td:first-child { color: var(--text2); min-width: 180px; }
.rtbl td { padding: 8px 10px; border-bottom: var(--border-default); color: var(--text); vertical-align: top; }
.rtbl tr:last-child td { border-bottom: none; }
.rtbl tr:hover td { background: var(--surface2); }
.ptbl input,.otbl input {
  width: 100%; padding: 5px 7px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: 6px; background: var(--surface2); color: var(--text); outline: none;
}
.ptbl input:focus,.otbl input:focus { border-color: var(--forest); }
.bdel { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.12s var(--ease, ease); }
.bdel:hover { color: var(--terra); }
.bdel.bedit:hover { color: var(--forest); }

/* ── CONSULTAS ──────────────────────────────────────────────────────── */
.cc { background: var(--surface); border: var(--border-default); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; transition: border 0.1s; }
.cc:hover { border-color: var(--border2); }
.cch { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.ccd { font-size: 10px; color: var(--text3); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.cct { font-size: 14px; font-weight: 500; color: var(--text); margin-top: 2px; }
.ccn { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.65; }
.ccc { font-size: 11px; font-weight: 500; color: var(--forest); background: var(--mist); padding: 2px 9px; border-radius: 20px; }

/* ── MODAL ──────────────────────────────────────────────────────────── */
.mbg { position: fixed; inset: 0; background: rgba(26,26,23,0.5); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; backdrop-filter: blur(2px); }
.mbox { background: var(--surface); border-radius: var(--rl); padding: 24px; width: 100%; max-width: 420px; border: var(--border-default); max-height: 90vh; overflow-y: auto; }
.mbox h3 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; margin-bottom: 18px; color: var(--text); }
.mact { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.bc { padding: 8px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: transparent; color: var(--text2); cursor: pointer; }
.mf { margin-bottom: 12px; }
.mf label { display: block; font-size: 10px; font-weight: 500; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
.mf input,.mf textarea,.mf select { width: 100%; padding: 8px 10px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: var(--surface2); color: var(--text); outline: none; }
.mf textarea { min-height: 68px; resize: vertical; }
.mf input:focus,.mf textarea:focus { border-color: var(--forest); }

/* ── FIRMAS ─────────────────────────────────────────────────────────── */

.cal-panel { padding: 20px 24px !important; overflow: auto; }

/* Month grid */
.mes-weekrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }

.mes-cell {

/* ── POLISH: UX & aesthetic improvements (May 14, 2026) ─────────────────── */

/* Custom easing curve — gives transitions physical weight */
:root { --ease: cubic-bezier(0.4, 0, 0.2, 1); }

/* Topbar tbtn — icon + label, label hides on narrow screens */
.tbtn { display: inline-flex; align-items: center; gap: 6px; }
.tbtn .ico { width: 14px; height: 14px; flex-shrink: 0; }
.tbtn .lbl { font-size: 11px; letter-spacing: 0.02em; }
@media (max-width: 900px) {
  .tbtn .lbl { display: none; }
  .tbtn { padding: 6px 8px; }
}

/* Logo subtle pulse while syncing (matches the sync-dot rhythm) */
@keyframes logoBreathe { 0%,100% { opacity: 1; } 50% { opacity: 0.78; } }
.topbar .brand svg { transition: opacity 0.3s var(--ease); }
.dot.ing ~ * .topbar .brand svg,
body:has(.dot.ing) .topbar .brand svg { animation: logoBreathe 1.5s var(--ease) infinite; }

/* Tab fade transition */
.panel { transition: opacity 0.15s var(--ease); }
.panel.changing { opacity: 0.45; }

/* Tooth hover — slightly more expressive lift */
.tooth { transition: transform 0.12s var(--ease), border-color 0.12s var(--ease), box-shadow 0.12s var(--ease); }
.tooth:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(31,58,42,0.08); }

/* Patient list hover — soft sage tint */
.pi { transition: background 0.12s var(--ease), border-color 0.12s var(--ease); }
.pi:hover { background: rgba(31,58,42,0.04); }
.pi.on { background: var(--mist); border-color: var(--accent-border); }
[data-theme="dark"] .pi:hover { background: rgba(220,227,210,0.05); }
[data-theme="dark"] .pi.on { background: rgba(31,58,42,0.4); }

/* Soft success flash on inputs after save */
@keyframes savedFlash { 0% { border-color: #4CAF7D; } 100% { border-color: var(--border); } }
.f input.just-saved, .f select.just-saved, .f textarea.just-saved { animation: savedFlash 1.2s var(--ease); }

/* Empty state — breathing logo, more inviting */
.empty { gap: 16px; }
.empty .empty-logo { opacity: 0.30; transition: opacity 0.6s var(--ease); animation: emptyBreathe 4s var(--ease) infinite; }
@keyframes emptyBreathe { 0%,100% { opacity: 0.30; } 50% { opacity: 0.18; } }
.empty h3 { font-family: 'DM Sans', sans-serif; font-size: 26px; font-weight: 400; color: var(--text); letter-spacing: -0.015em; line-height: 1; text-transform: lowercase; }
.empty h3 span { font-weight: 700; color: var(--forest); }
.empty p { font-style: normal; }
.empty p { font-family: 'Fraunces', serif; font-size: 14px; font-style: italic; color: var(--text2); }

/* Patient header — Fraunces for the name (editorial moment) */
.phn { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 400; letter-spacing: -0.01em; }

/* Cards — more generous padding on desktop */
@media (min-width: 768px) {
  .card { padding: 20px 22px; margin-bottom: 16px; }
  .ct-row { margin-bottom: 16px; }
}

/* "Consultas de hoy" widget — stronger hierarchy */
.today-card, .today-card-empty { border-left: 3px solid var(--forest); }
.today-card .ct, .today-card-empty .ct { color: var(--sage); }

/* Undo toast — distinct from regular toast (terra-tinted to match "destructive" semantics) */
.undo-toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--charcoal); color: var(--cream);
  padding: 10px 14px 10px 18px; border-radius: var(--rl);
  font-size: 12px; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 10px;
  z-index: 1000; max-width: 90vw;
  box-shadow: 0 4px 12px rgba(26,26,23,0.18);
  animation: undoIn 0.2s var(--ease);

@keyframes undoIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.undo-toast .undo-btn {
  background: var(--brass); color: var(--charcoal);
  border: none; padding: 5px 12px; border-radius: var(--r);
  font-size: 11px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  cursor: pointer; letter-spacing: 0.04em; transition: opacity 0.12s var(--ease);
}
.undo-toast .undo-btn:hover { opacity: 0.85; }
@media (max-width: 768px) {

}

/* Form field focus glow — confirms attention */
.f input:focus, .f select:focus, .f textarea:focus,
.mf input:focus, .mf select:focus, .mf textarea:focus {
  box-shadow: 0 0 0 2px rgba(31,58,42,0.10);
}

/* Save status — keep last text visible by default (don't go blank) */
.save-status { font-style: italic; opacity: 0.85; }
.save-status.saved { color: #4CAF7D; opacity: 1; }
[data-theme="dark"] .save-status.saved { color: #5fc89b; }

/* Mobile: scroll bottom-nav-aware padding on panel */
@media (max-width: 768px) {
  .topbar { gap: 4px; }
  .sync-wrap { font-size: 10px; }
}

/* Signature canvas — slightly higher contrast in dark mode (was too dark to draw on) */
[data-theme="dark"] .firma-canvas { background: #3a3a35; }

/* ── SIDEBAR SMART FILTERS (v7-6) ──────────────────────────────────────── */
.plist-filters {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px 10px 12px;
  background: var(--surface2);
  border-bottom: 0.5px solid var(--border);
}
.plist-filter-group { display: flex; flex-direction: column; gap: 4px; }
.plist-filter-label {
  font-size: 9px; color: var(--text3);
  letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500;
  padding-left: 2px;
}
.plist-filter-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.plist-chip {
  padding: 3px 8px; font-size: 10.5px; font-family: 'DM Sans', sans-serif;
  border: 0.5px solid var(--border);
  border-radius: 12px; background: var(--surface);
  color: var(--text2); cursor: pointer;
  transition: all 0.12s var(--ease, ease); letter-spacing: 0.02em;
}
.plist-chip:hover { color: var(--text); border-color: var(--border2); }
.plist-chip.on {
  background: var(--accent-light); color: var(--forest);
  border-color: var(--accent-border); font-weight: 600;
}

/* ── PROFILE BUTTON (top-right avatar) ─────────────────────────────────── */
.profile-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent-light);
  border: 0.5px solid var(--accent-border);
  color: var(--forest);
  font-family: 'DM Sans', sans-serif; font-weight: 600;
  font-size: 12px; letter-spacing: 0.04em;
  cursor: pointer; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.12s var(--ease, ease);
  margin-left: 4px;
}
.profile-btn:hover { background: var(--mist); transform: scale(1.05); }

/* ── PROFILE PAGE ──────────────────────────────────────────────────────── */
.profile-panel { padding: 22px 28px 28px; overflow: auto; }
.profile-hero {
  display: flex; align-items: center; gap: 18px;
  padding: 22px 24px;
  background: linear-gradient(135deg, var(--accent-light) 0%, var(--surface) 100%);
  border: var(--border-default); border-radius: var(--rl);
  margin-bottom: 18px;
}
.profile-avatar-lg {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--forest); color: var(--cream);
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif; font-weight: 600;
  font-size: 24px; letter-spacing: 0.04em;
  flex-shrink: 0;
}
.profile-hero-name {
  font-family: 'Fraunces', serif;
  font-size: 22px; font-weight: 400; color: var(--text);
  line-height: 1.1; margin-bottom: 4px;
}
.profile-hero-email {
  font-size: 12px; color: var(--text3); letter-spacing: 0.02em;
}
.profile-card {
  background: var(--surface);
  border: var(--border-default);
  border-radius: var(--rl);
  padding: 18px 22px;
  margin-bottom: 14px;
}
.profile-card .ct { margin-bottom: 12px; }

@media (max-width: 768px) {
  .profile-panel { padding: 14px 14px 18px; }
  .profile-hero { padding: 16px 18px; gap: 14px; }
  .profile-avatar-lg { width: 52px; height: 52px; font-size: 20px; }
  .profile-hero-name { font-size: 19px; }
  .profile-btn { width: 32px; height: 32px; font-size: 11px; }
}

/* ── ADMIN BUTTON IN TOPBAR ─────────────────────────────────────────────── */
.tbtn-admin {
  color: var(--forest);
  border-color: var(--accent-border);
  background: var(--accent-light);
}
.tbtn-admin:hover { background: var(--mist); color: var(--forest); }
.tbtn-admin .ico { color: var(--forest); }

/* ── ADMIN VIEW ─────────────────────────────────────────────────────────── */
.admin-panel { padding: 22px 28px 28px; overflow: auto; }
.admin-users-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 14px;
}
.admin-user-card {
  background: var(--surface);
  border: var(--border-default);
  border-radius: var(--rl);
  padding: 16px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.15s var(--ease, ease), box-shadow 0.15s var(--ease, ease);
}
.admin-user-card:hover {
  border-color: var(--border2);
  box-shadow: 0 2px 8px rgba(31,58,42,0.05);
}
.admin-user-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding-bottom: 10px;
  border-bottom: 0.5px solid var(--border);
}
.admin-user-name {
  font-family: 'Fraunces', serif;
  font-size: 16px; font-weight: 400; color: var(--text);
  line-height: 1.2;
}
.admin-user-email {
  font-size: 11px; color: var(--text3);
  margin-top: 2px; letter-spacing: 0.02em;
}
.admin-user-meta {
  font-size: 10px; color: var(--text3);
  letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--surface2); padding: 4px 9px; border-radius: 20px;
  flex-shrink: 0;
}
.admin-tabs-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
}
.admin-tab-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-radius: var(--r);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.12s var(--ease, ease);
  color: var(--text2);
  user-select: none;
}
.admin-tab-chip:hover { background: var(--surface2); }
.admin-tab-chip input {
  margin: 0; width: 13px; height: 13px;
  accent-color: var(--forest);
  cursor: pointer;
}
.admin-tab-chip.on { color: var(--text); }
.admin-tab-chip.on:hover { background: var(--accent-light); }

.admin-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 48px 24px; gap: 14px;
  text-align: center;
}

/* Admin toolbar (search + filter chips) */
.admin-toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 18px; padding-bottom: 14px;
  border-bottom: 0.5px solid var(--border);
}
.admin-search {
  position: relative; flex: 1; min-width: 240px;
}
.admin-search input {
  width: 100%; padding: 10px 14px 10px 36px;
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text);
  outline: none; transition: border 0.12s var(--ease, ease);
}
.admin-search input:focus { border-color: var(--forest); background: var(--surface); }
.admin-search-ico {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--text3); pointer-events: none;
}
.admin-filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.admin-filter-chip {
  padding: 7px 12px; font-size: 11px; font-family: 'DM Sans', sans-serif;
  font-weight: 500; border: var(--border-default); border-radius: var(--r);
  background: var(--surface); color: var(--text2); cursor: pointer;
  transition: all 0.12s var(--ease, ease); letter-spacing: 0.02em;
}
.admin-filter-chip:hover { color: var(--text); border-color: var(--border2); }
.admin-filter-chip.on { background: var(--accent-light); color: var(--forest); border-color: var(--accent-border); font-weight: 600; }

/* Per-user actions (impersonate button + tab count badge) */
.admin-user-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: nowrap; justify-content: flex-start; }
.admin-impersonate-btn {
  font-size: 11px; padding: 5px 10px;
  background: var(--surface2); color: var(--forest);
  border: 0.5px solid var(--accent-border);
}
.admin-impersonate-btn:hover { background: var(--accent-light); }

/* Impersonation banner — shown when admin is "viewing as" another user */
.impersonation-banner {
  position: sticky; top: 0; z-index: 6;
  background: linear-gradient(90deg, var(--brass) 0%, #E5C99B 100%);
  color: var(--charcoal);
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 12px; letter-spacing: 0.02em;
  box-shadow: 0 1px 4px rgba(31,58,42,0.08);
}
.impersonation-banner .imp-text { display: flex; align-items: center; gap: 8px; }
.impersonation-banner strong { font-weight: 600; }
.impersonation-banner .imp-exit-btn {
  background: var(--charcoal); color: var(--cream); border-color: var(--charcoal);
  font-size: 11px; padding: 5px 12px;
}
.impersonation-banner .imp-exit-btn:hover { background: var(--forest); border-color: var(--forest); }

.admin-footer {
  margin-top: 28px;
  padding: 14px 18px;
  background: var(--surface2);
  border-radius: var(--r);
  border-left: 3px solid var(--brass);
}

/* Dark mode tweaks */
[data-theme="dark"] .tbtn-admin {
  background: rgba(47,93,58,0.18);
  color: var(--mist);
  border-color: var(--accent-border);
}
[data-theme="dark"] .tbtn-admin .ico { color: var(--mist); }
[data-theme="dark"] .admin-user-card { background: var(--surface); }
[data-theme="dark"] .admin-tab-chip.on { color: var(--mist); }

/* Mobile: stack to single column */
@media (max-width: 768px) {
  .admin-panel { padding: 14px 12px 18px; }
  .admin-users-grid { grid-template-columns: 1fr; gap: 12px; }
  .admin-tabs-grid { grid-template-columns: 1fr; }
  .admin-user-card { padding: 14px; }
  .admin-user-name { font-size: 15px; }
}


/* ── ODONTOGRAMA TOOTH VIZ (v4) ─────────────────────────────────────────── */

/* Desktop two-column layout: chart left, viz right */
.odonto-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 24px; align-items: start; margin-top: 14px; }
.odonto-chart-wrap { min-width: 0; }
.odonto-viz-wrap { min-width: 0; }

.viz-panel {
  background: var(--surface);
  border: var(--border-default);
  border-radius: var(--rl);
  padding: 22px 22px 18px;
  display: flex; flex-direction: column; gap: 14px;
  position: sticky; top: 8px;
}
.viz-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.viz-tooth-id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.viz-tooth-num { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 300; line-height: 1; color: var(--text); letter-spacing: -0.02em; }
.viz-tooth-type { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; }

.viz-view-toggle { display: inline-flex; background: var(--surface2); border: var(--border-default); border-radius: var(--r); padding: 2px; }
.viz-view-btn { padding: 5px 11px; font-size: 11px; font-family: 'DM Sans', sans-serif; font-weight: 500; border: none; background: transparent; color: var(--text2); border-radius: 6px; cursor: pointer; transition: all 0.15s var(--ease, ease); letter-spacing: 0.02em; }
.viz-view-btn:hover { color: var(--text); }
.viz-view-btn.on { background: var(--surface); color: var(--forest); box-shadow: 0 1px 2px rgba(31,58,42,0.06); }

.viz-canvas {
  width: 100%; display: flex; justify-content: center; align-items: center;
  padding: 18px 0;
  background: radial-gradient(ellipse 70% 50% at 50% 40%, #FCFBF8 0%, var(--bone) 60%, var(--cream) 100%);
  border-radius: var(--r);
  min-height: 280px;
  position: relative;
  overflow: hidden;
}
.viz-canvas::before {
  content: ''; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  width: 100px; height: 8px;
  background: radial-gradient(ellipse, rgba(31,58,42,0.10) 0%, transparent 70%);
  pointer-events: none; filter: blur(2px);
}
.viz-canvas-lateral { min-height: 340px; padding: 22px 0; }
.viz-canvas-oclusal { min-height: 260px; padding: 14px 6px; }
.viz-svg { width: 100%; max-width: 220px; height: auto; display: block; position: relative; z-index: 1; }
.viz-canvas-lateral .viz-svg { max-width: 190px; }
.viz-canvas-oclusal .viz-svg { max-width: 280px; }

/* Realistic tooth interaction states */
.viz-surf-large { transition: filter 0.18s var(--ease, ease); cursor: pointer; }
.viz-surf-large:hover { filter: brightness(1.05) drop-shadow(0 1px 4px rgba(31,58,42,0.18)); }
.viz-edge-zone { cursor: pointer; transition: opacity 0.18s var(--ease, ease); }
.viz-edge-zone .viz-edge-faint { opacity: 0; transition: opacity 0.2s var(--ease, ease); }
.viz-edge-zone:hover .viz-edge-faint { opacity: 1; }
.viz-edge-zone:hover circle { fill: rgba(31,58,42,0.04); }
.viz-edge-zone.on:hover circle { filter: brightness(1.06); }
.viz-edge-faint { font-family: 'DM Sans', sans-serif; font-size: 9px; font-weight: 600; fill: var(--text3); letter-spacing: 0.12em; }
.viz-edge-mark { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #fff; letter-spacing: 0.04em; }
.viz-surf { transition: opacity 0.12s var(--ease, ease), filter 0.12s var(--ease, ease); cursor: pointer; }
.viz-surf:hover { filter: brightness(0.96) saturate(1.1); }
.viz-surf.on { filter: saturate(1.15); }
.viz-zone-lbl, .viz-zone-lbl-o, .viz-zone-lbl-lateral {
  font-family: 'DM Sans', sans-serif; fill: var(--text3); font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
}
.viz-zone-lbl-o { font-size: 13px; fill: var(--text3); }
.viz-zone-lbl-lateral { font-family: 'Fraunces', serif; font-size: 32px; fill: var(--text3); opacity: 0.35; font-weight: 300; }
.viz-dir-lbl { font-family: 'DM Sans', sans-serif; fill: var(--text2); font-size: 10.5px; font-style: normal; font-weight: 500; letter-spacing: 0.05em; opacity: 0.85; }

.viz-badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.viz-state-pill { font-size: 10.5px; padding: 3px 10px; border-radius: 20px; font-weight: 500; letter-spacing: 0.04em; border: 0.5px solid; }
.viz-state-caries { background: var(--danger-light); color: var(--terra); border-color: rgba(184,85,62,0.4); }
.viz-state-tratado { background: var(--accent-light); color: var(--forest); border-color: var(--accent-border); }
.viz-state-ausente { background: var(--surface2); color: var(--text2); border-color: var(--border2); }
.viz-state-corona { background: var(--info-light); color: var(--petrol); border-color: rgba(74,107,124,0.4); }
.viz-state-endodoncia { background: var(--warn-light); color: #8C7438; border-color: rgba(201,169,97,0.45); }
.viz-state-protesis { background: #F0EBF7; color: #6E4D9A; border-color: rgba(120,80,160,0.3); }

.viz-hint { font-size: 11px; color: var(--text3); text-align: center; letter-spacing: 0.02em; padding: 4px 0; border-top: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); }

.viz-picker { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding-right: 4px; }
.viz-quad-row { display: flex; align-items: center; gap: 8px; }
.viz-quad-lbl { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; min-width: 78px; flex-shrink: 0; }
.viz-quad-pills { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; }
.viz-pill {
  font-family: 'DM Sans', sans-serif; font-size: 10.5px; font-weight: 500;
  padding: 4px 7px; min-width: 28px;
  border: 0.5px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--text2);
  cursor: pointer; transition: all 0.12s var(--ease, ease);
  font-variant-numeric: tabular-nums;
}
.viz-pill:hover { border-color: var(--border2); color: var(--text); }
.viz-pill.on { background: var(--forest); color: var(--bone); border-color: var(--forest); }
.viz-pill.has-state { font-weight: 600; }
.viz-pill[data-st="caries"]:not(.on) { color: var(--terra); border-color: rgba(184,85,62,0.4); background: rgba(184,85,62,0.06); }
.viz-pill[data-st="tratado"]:not(.on) { color: var(--forest); border-color: var(--accent-border); background: var(--accent-light); }
.viz-pill[data-st="ausente"]:not(.on) { color: var(--text3); background: var(--surface2); }
.viz-pill[data-st="corona"]:not(.on) { color: var(--petrol); border-color: rgba(74,107,124,0.35); background: var(--info-light); }
.viz-pill[data-st="endodoncia"]:not(.on) { color: #8C7438; border-color: rgba(201,169,97,0.4); background: var(--warn-light); }
.viz-pill[data-st="protesis"]:not(.on) { color: #6E4D9A; border-color: rgba(120,80,160,0.3); background: #F0EBF7; }

/* Desktop — viz is showcase; user picks via the FDI chart on the left */
@media (min-width: 769px) {
  .viz-picker { display: none; }
  .viz-hint { display: none; }
}
.odonto-hint { font-size: 11px; color: var(--text3); text-align: center; margin-top: 10px; letter-spacing: 0.02em; }

/* Mobile — chart hides, viz becomes primary, picker scrolls horizontally */
@media (max-width: 768px) {
  .odonto-layout { grid-template-columns: 1fr; gap: 14px; }
  .odonto-chart-wrap { display: none; }
  .viz-panel { position: static; padding: 14px 12px 12px; }
  .viz-svg { max-width: 280px; }
  .viz-canvas { min-height: 280px; }
  .viz-tooth-num { font-size: 28px; }
  .viz-pill { font-size: 11px; padding: 6px 9px; min-width: 32px; }
  .viz-quad-row { flex-direction: column; align-items: flex-start; gap: 4px; }
  .viz-quad-lbl { min-width: 0; }
  .viz-quad-pills { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .viz-picker { max-height: none; }
  /* Pin the state legend (tleg) so user can tap states while viewing tooth */
  .tleg { position: sticky; top: 0; background: var(--surface); z-index: 5; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
}

[data-theme="dark"] .viz-canvas { background: linear-gradient(180deg, var(--surface2) 0%, var(--surface) 100%); }
[data-theme="dark"] .viz-zone-lbl-lateral { fill: var(--text2); opacity: 0.25; }
[data-theme="dark"] .viz-pill.on { background: var(--mist); color: var(--forest); border-color: var(--mist); }
[data-theme="dark"] .viz-state-endodoncia { color: #d6c19a; }
[data-theme="dark"] .viz-state-protesis { color: #b09cd0; background: rgba(120,80,160,0.18); }

/* ── v7.1 additions ─────────────────────────────────────────────────── */
/* Modal 2-column rows (fecha/hora, fecha/sexo) — collapse on mobile (Bug #2) */
.modal-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* Auto-resize free-text fields (#11): grow with content, no inner scroll */
.mf textarea, textarea.auto-grow { overflow-y: hidden; resize: none; min-height: 60px; }
@media(max-width:768px){
  .modal-grid-2 { grid-template-columns: 1fr; }
}
/* ── v7.1 Tranche 2 ─────────────────────────────────────────────────── */
/* Filter panel (#4) */
.plist-filterbar { display:flex; align-items:center; gap:8px; padding:8px 8px 4px; }
.filter-toggle-btn { font:inherit; font-size:12px; padding:6px 12px; border:var(--border-default); border-radius:20px; background:var(--surface); color:var(--text2); cursor:pointer; }
.filter-toggle-btn.on { background:var(--accent-light); color:var(--forest); border-color:var(--accent-border); }
.filter-clear-link { font-size:11px; color:var(--terra); background:none; border:none; cursor:pointer; }
.filter-panel { padding:8px; border-bottom:0.5px solid var(--border); margin-bottom:6px; }
.filter-panel-actions { display:flex; gap:8px; margin-top:10px; }
.filter-saved { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
.saved-chip { display:inline-flex; align-items:center; }
.saved-del { background:none; border:none; color:var(--text3); cursor:pointer; font-size:14px; padding:0 4px; }
/* Admin user status (#3) */
.admin-status { font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px; }
.admin-status.active { background:var(--accent-light); color:var(--forest); }
.admin-status.inactive { background:#EFE0DC; color:var(--terra); }
/* Antecedentes / hábitos (#5) */
.ant-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; }
.ant-row, .hab-row { display:flex; align-items:center; gap:8px; }
.ant-row label, .hab-row label { flex:1; font-size:12px; color:var(--text2); }
.ant-row select, .hab-row select { width:74px; padding:5px 6px; font-size:12px; border:var(--border-default); border-radius:6px; background:var(--surface2); color:var(--text); }
.hab-grid { display:grid; grid-template-columns:1fr; gap:8px; }
.hab-row input { flex:1.4; padding:6px 8px; font-size:12px; border:var(--border-default); border-radius:6px; background:var(--surface2); color:var(--text); }
.lbox img.ds-logo-lg { display:block; margin:6px auto 6px; }
@media(max-width:768px){ .ant-grid { grid-template-columns:1fr; } .hab-row { flex-wrap:wrap; } }
/* ── v7.1 Tranche 3 (review fixes) ── */

.admin-invites-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.invite-list { display:flex; flex-direction:column; gap:8px; }
.invite-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 10px; border:0.5px solid var(--border); border-radius:8px; }
.invite-row.used { opacity:0.6; }
.invite-code { font-family:monospace; font-size:14px; font-weight:600; color:var(--forest); letter-spacing:0.05em; }
.invite-status { font-size:11px; padding:2px 8px; border-radius:20px; }
.invite-status.free { background:var(--accent-light); color:var(--forest); }
.invite-status.used { background:var(--surface2); color:var(--text3); }
.invite-actions { margin-left:auto; display:flex; gap:6px; }
.invite-actions button { padding:4px 10px; font-size:11px; }

/* ── v7.1 dentist specialties ── */
.esp-select { margin-bottom:12px; text-align:left; }
.esp-select-label { font-size:12px; color:var(--text2); margin-bottom:6px; }
.esp-chips { display:flex; flex-wrap:wrap; gap:6px; }
.esp-chip { font:inherit; font-size:12px; padding:6px 11px; border:var(--border-default); border-radius:20px; background:var(--surface2); color:var(--text2); cursor:pointer; transition: background 0.12s, color 0.12s; }
.esp-chip.on { background:var(--accent-light); color:var(--forest); border-color:var(--accent-border); font-weight:500; }
/* ── Collapsible specialty dropdown ── */
.esp-dropdown { margin-bottom:12px; text-align:left; }
.esp-dropdown-trigger {
  width:100%; padding:12px 14px; font-size:14px; font-family:'DM Sans',sans-serif;
  border:var(--border-default); border-radius:var(--r);
  background:var(--surface2); color:var(--text);
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer; text-align:left; transition:border 0.15s;

.esp-dropdown-trigger:hover { border-color:var(--forest); }
.esp-dropdown-trigger .esp-arrow { font-size:10px; color:var(--text3); transition:transform 0.2s; }
.esp-dropdown-trigger.open .esp-arrow { transform:rotate(180deg); }
.esp-dropdown-panel {
  display:none; margin-top:4px;
  border:var(--border-default); border-radius:var(--r);
  background:var(--surface2); padding:10px;
  max-height:220px; overflow-y:auto;
}
.esp-dropdown-panel.open { display:flex; flex-wrap:wrap; gap:6px; }
.admin-user-esp { font-size:11px; color:var(--text2); margin-top:3px; }

body.no-import .imp-btn { display:none !important; }
.invites-toggle { background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:6px; padding:0; }
.invites-toggle .chev { color:var(--text3); font-size:12px; }

.side-menu-item { text-align:left; background:var(--surface2); border:var(--border-default); border-radius:10px; padding:14px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text); cursor:pointer; }

.pres-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
.pres-dot.on { background:#3a9d5d; box-shadow:0 0 0 3px rgba(58,157,93,0.15); }
.pres-dot.off { background:var(--border2); }
.bn-logo { display:block; margin:0 auto 2px; }
.bn-inicio { color:var(--forest); font-weight:600; }

window.doSignup = async function(){

  const nombre=document.getElementById('signupName').value.trim();
  const email=document.getElementById('signupEmail').value.trim();
  const pass=document.getElementById('signupPass').value;
  const passConfirm=document.getElementById('signupPassConfirm').value;
  const err=document.getElementById('signupErr');
  const btn=document.getElementById('signupBtn');
  err.textContent='';
  if(!nombre){err.textContent='Ingresa tu nombre completo.';return;}
  if(!email){err.textContent='Ingresa tu correo electrónico.';return;}
  if(pass.length<6){err.textContent='La contraseña debe tener al menos 6 caracteres.';return;}
  if(pass!==passConfirm){err.textContent='Las contraseñas no coinciden.';return;}
  const codigo=(document.getElementById('signupCode').value||'').trim().toUpperCase();
  if(!codigo){err.textContent='Ingresa tu código de invitación.';return;}
  btn.disabled=true;btn.textContent='Verificando código…';
  // v7.1 — require a valid, unused invitation code (one-time use).
  const invRef=doc(db,'invitaciones',codigo);
  try{
    const invSnap=await getDoc(invRef);
    if(!invSnap.exists()||invSnap.data().usado===true){
      err.textContent='Código de invitación inválido o ya utilizado.';
      btn.disabled=false;btn.textContent='Crear cuenta';return;
    }
  }catch(ev){
    err.textContent='No se pudo validar el código. Revisa tu conexión e intenta de nuevo.';
    btn.disabled=false;btn.textContent='Crear cuenta';return;
  }
  btn.textContent='Creando cuenta…';
  // Stash title + name so bootstrapUserPerms can save them when /users/{uid} is created
  sessionStorage.setItem('ds_pending_title',titulo||'');
  sessionStorage.setItem('ds_pending_name',nombre);
  sessionStorage.setItem('ds_pending_esp',JSON.stringify(getEspFrom('signupEspChips')));
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    const displayName=titulo?`${titulo} ${nombre}`:nombre;
    try{await updateProfile(cred.user,{displayName});}catch(e){console.warn('updateProfile failed:',e.message);}
    try{await setDoc(invRef,{usado:true,usadoPor:email,usadoEn:new Date().toISOString()},{merge:true});}catch(e){}
    // onAuthStateChanged will fire and bootstrap perms with the pending title/name
  }catch(e){
    sessionStorage.removeItem('ds_pending_title');
    sessionStorage.removeItem('ds_pending_name');
    sessionStorage.removeItem('ds_pending_esp');
    let msg='No se pudo crear la cuenta.';
    if(e.code==='auth/email-already-in-use')msg='Este correo ya tiene una cuenta. Usa "Volver al login".';
    else if(e.code==='auth/invalid-email')msg='Correo electrónico inválido.';
    else if(e.code==='auth/weak-password')msg='Contraseña muy débil (mín. 6 caracteres).';
    else if(e.code==='auth/operation-not-allowed')msg='El registro está deshabilitado. Contacta al administrador.';
    err.textContent=msg;
  }finally{
    btn.disabled=false;btn.textContent='Crear cuenta';
  }
};

// Subscribe to current Firebase user's permissions doc.
// If it doesn't exist yet, create it with default access (all tabs allowed).
function bootstrapUserPerms(user){
  if(userPermsUnsubscribe){userPermsUnsubscribe();userPermsUnsubscribe=null;}
  currentUserUid=user.uid;
  try{setupPresence(user);}catch(e){}
  const ref=doc(db,'users',user.uid);
  userPermsUnsubscribe=onSnapshot(ref,async snap=>{
    if(snap.exists()){
      currentUserPerms={uid:user.uid,...snap.data()};
      // v7.1 (#3) — block deactivated accounts.
      if(currentUserPerms.status==='inactive' && !isAdmin && !isTempBypass()){
        toast('Tu cuenta está desactivada. Contacta al administrador.');
        try{signOut(auth);}catch(e){}
        return;
      }
      // Update lastLoginAt once per session — writing it every snapshot triggers another
      // snapshot which would loop forever (each write changes the timestamp → new snapshot).
      if(_lastLoginAtUpdatedForUid!==currentUserUid){
        _lastLoginAtUpdatedForUid=currentUserUid;
        try{setDoc(ref,{lastLoginAt:new Date().toISOString()},{merge:true});}catch(e){}
      }
    }else{
      // First login — create with default perms (all tabs).
      // If this signup just happened, pull title + name from sessionStorage.
      const pendingTitle=sessionStorage.getItem('ds_pending_title')||'';
      const pendingName=sessionStorage.getItem('ds_pending_name')||user.displayName||'';
      sessionStorage.removeItem('ds_pending_title');
      sessionStorage.removeItem('ds_pending_name');
      const pendingEsp=JSON.parse(sessionStorage.getItem('ds_pending_esp')||'[]');
      sessionStorage.removeItem('ds_pending_esp');
      const initial={
        email:user.email||'',
        name:pendingName,
        title:pendingTitle,
        tabsAllowed:[...ALL_TABS],
        tabOrder:[...ALL_TABS],
        especialidades:pendingEsp,
        status:'active',
        createdAt:new Date().toISOString(),
        lastLoginAt:new Date().toISOString()
      };
      try{await setDoc(ref,initial);}catch(e){console.warn('Could not create user perms:',e.message);}
      currentUserPerms={uid:user.uid,...initial};
    }
    updateAdminUI();
    // Re-render current view so tab filter applies
    if(viewActual==='paciente'&&idActual)renderPaciente();
    // Only set up the pacientes listener once per user session.
    // Without this guard, every snapshot (e.g. from lastLoginAt write) would call
    // setupPacientesListener(), cancel the active listener, and restart it → "Conectando" forever.
    if(pacientesListenerUid!==currentUserUid){
      pacientesListenerUid=currentUserUid;
      setupPacientesListener();
    }
  });
}

function ff(d){if(!d)return'';const[y,m,dd]=d.split('-');const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(dd)} ${M[parseInt(m)-1]} ${y}`}

function edadAnios(nac){if(!nac)return null;const h=new Date(),n=new Date(nac);let a=h.getFullYear()-n.getFullYear();if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate()))a--;return a}

// ─── AUTOSAVE (3.5.1, 3.5.2, 3.5.3, 3.6.8) ────────────────────────────────
function getDebounce(){return isMobile()?3000:1000}
function autosave(formKey,getData,statusElId){
  if(autosaveTimers[formKey])clearTimeout(autosaveTimers[formKey]);
  if(statusElId)updateSaveStatus(statusElId,'pending');
  autosaveTimers[formKey]=setTimeout(async()=>{
    if(statusElId)updateSaveStatus(statusElId,'saving');
    try{
      const data=getData();
      if(data)await guardar(data);
      if(statusElId)updateSaveStatus(statusElId,'saved');
    }catch(err){
      if(statusElId)updateSaveStatus(statusElId,'error');
    }
  },getDebounce());
}
function updateSaveStatus(id,state){
  const el=document.getElementById(id);
  if(!el)return;
  if(autosaveStatusTimers[id])clearTimeout(autosaveStatusTimers[id]);
  el.classList.remove('saving','saved','error','pending');
  el.classList.add(state);
  if(state==='pending'){el.textContent='Sin guardar';}
  else if(state==='saving'){el.textContent='Guardando…';}
  else if(state==='saved'){
    el.dataset.savedAt=Date.now();
    el.textContent='Guardado';
    autosaveStatusTimers[id]=setTimeout(()=>tickSavedTime(id),5000);
  }
  else if(state==='error'){el.textContent='Error al guardar';}
}
function tickSavedTime(id){
  const el=document.getElementById(id);
  if(!el||!el.dataset.savedAt)return;
  const seconds=Math.floor((Date.now()-parseInt(el.dataset.savedAt))/1000);
  if(seconds<5)el.textContent='Guardado';
  else if(seconds<60)el.textContent=`Guardado hace ${seconds}s`;
  else el.textContent=`Guardado hace ${Math.floor(seconds/60)} min`;
  autosaveStatusTimers[id]=setTimeout(()=>tickSavedTime(id),5000);
}
function statusEl(formKey){
  return `<span class="save-status" id="ss-${formKey}"></span>`;
}

// Patient listener: ownerUid-aware so non-admin users see only their own patients.
// Admins see everyone unless they're impersonating a specific user via viewAsUid.
let pacientesUnsub = null;
// Guards to prevent infinite loops in bootstrapUserPerms snapshot handler
let pacientesListenerUid = null;   // uid for which the pacientes listener is active
let _lastSelfSaveTime = 0; // timestamp of last save we initiated (used to skip redundant re-renders)
let _lastLoginAtUpdatedForUid = null;  // uid for which lastLoginAt was already written
function setupPacientesListener(){
  if(pacientesUnsub){pacientesUnsub();pacientesUnsub=null;}
  let q;
  if(isAdmin){
    if(viewAsUid){
      // Admin impersonating a specific user
      q = query(collection(db,'pacientes'), where('ownerUid','==',viewAsUid));
    }else{
      // Admin sees everyone's patients
      q = collection(db,'pacientes');
    }
  }else if(currentUserUid){
    // Regular user: only their own patients
    q = query(collection(db,'pacientes'), where('ownerUid','==',currentUserUid));
  }else{
    // Not authenticated — clear list
    pacientes=[];rebuildConsultasIndex();renderLista();
    return;
  }
  ss('ing','Conectando...');
  pacientesUnsub = onSnapshot(q, snap=>{
    pacientes=snap.docs.map(d=>({id:d.id,...d.data()}));
    rebuildConsultasIndex();
    renderLista();
    // Skip re-rendering the patient view when the snapshot was triggered by our
    // own autosave — the data is already applied optimistically, so there is
    // nothing new to show and re-rendering would reset the panel scroll position.
    // We DO re-render for calendar/admin, and for changes arriving from other devices
    // (those arrive well after 2500 ms from the last self-save).
    const _selfSave = (Date.now() - _lastSelfSaveTime) < 2500;
    if(!_selfSave || viewActual==='calendario' || viewActual==='admin'){
      rerenderCurrent();
    }
    ss('ok','Sincronizado');
  },err=>{
    console.warn('Pacientes listener error:',err.message);
    ss('err','Sin conexión');
  });
}

function rerenderCurrent(){
  if(viewActual==='calendario')renderCalendar();
  else if(viewActual==='admin')renderAdmin();
  else if(idActual&&gp()){
    // Preserve the panel scroll position so autosave snapshots don't
    // jump the user back to the top when they are mid-form.
    const _panel=document.getElementById('panel');
    const _scrollTop=_panel?_panel.scrollTop:0;
    renderPaciente();
    if(_scrollTop>0){
      setTimeout(()=>{const p2=document.getElementById('panel');if(p2)p2.scrollTop=_scrollTop;},0);
    }
  }
  else renderEmpty();
}

async function guardar(p){
  const{id,...data}=p;
  if(!data.ownerUid&&currentUserUid)data.ownerUid=currentUserUid;
  _lastSelfSaveTime=Date.now(); // mark that WE triggered this save
  ss('ing','Guardando...');
  // Optimistic local apply so the UI reflects the change immediately, even offline.
  const _i=pacientes.findIndex(x=>x.id===id);
  if(_i>=0)pacientes[_i]={id,...data};
  // Fire-and-track: don't block the UI on server ack. Offline persistence queues
  // the write and syncs on reconnect — no data loss, modal can close right away.
  setDoc(doc(db,'pacientes',id),data)
    .then(()=>{ss('ok','Sincronizado');ssRest();})
    .catch(()=>{ss('err','Sin conexión · guardado local, se sincronizará');});
  return id;
}
async function crear(data){
  data.ownerUid = viewAsUid || currentUserUid || 'orphan';
  ss('ing','Guardando...');
  // Generate the doc id locally so we can return immediately (offline-safe).
  const ref=doc(collection(db,'pacientes'));
  setDoc(ref,data)
    .then(()=>{ss('ok','Sincronizado');ssRest();})
    .catch(()=>{ss('err','Sin conexión · guardado local, se sincronizará');});
  return ref.id;
}
async function borrar(id){try{await deleteDoc(doc(db,'pacientes',id));}catch(err){}}

// Admin-only one-shot migration helper. Maurizio runs from browser console:
//   await window.migrateOrphanPatients('hisUidFromAdminView')
// to assign all patients without ownerUid to that user.
window.migrateOrphanPatients = async function(targetUid){
  if(!isAdmin){console.warn('Solo admins pueden migrar.');return;}
  if(!targetUid){console.warn('Pasa el UID del usuario destino.');return;}
  const all=await getDocs(collection(db,'pacientes'));
  let count=0;
  for(const docSnap of all.docs){
    const data=docSnap.data();
    if(!data.ownerUid){
      await setDoc(doc(db,'pacientes',docSnap.id),{...data,ownerUid:targetUid},{merge:true});
      count++;
    }
  }
  console.log(`Migrados ${count} pacientes huérfanos → ${targetUid}`);
  return count;
};

async function ciExists(ci, excludeId){
  if(!ci||ci==='V-'||ci==='J-'||ci==='E-')return null;
  let q1;
  // Non-admins: scope CI uniqueness check to their own patients
  if(!isAdmin && currentUserUid){
    q1=query(collection(db,'pacientes'),where('ci','==',ci),where('ownerUid','==',currentUserUid));
  }else{
    q1=query(collection(db,'pacientes'),where('ci','==',ci));
  }
  const snap=await getDocs(q1);
  for(const d of snap.docs){if(d.id!==excludeId)return{id:d.id,...d.data()};}
  return null;
}

window.importar=async function(ev){
  if(!isAdmin){toast('Solo administradores pueden importar.');ev.target.value='';return;}
  const file=ev.target.files[0];if(!file)return;
  const isCSV=file.name.toLowerCase().endsWith('.csv');
  const reader=new FileReader();
  reader.onload=async e2=>{
    if(isCSV)await importarCSV(e2.target.result);
    else await importarJSON(e2.target.result);
  };
  reader.readAsText(file);
  ev.target.value='';
}
async function importarJSON(text){
  try{
    const d=JSON.parse(text);
    if(!d.pacientes){alert('Archivo JSON inválido (falta el campo "pacientes").');return;}
    if(!confirm(`¿Importar ${d.pacientes.length} pacientes desde JSON?`))return;
    const ex=new Set(pacientes.map(p=>p.id));
    let count=0;
    for(const p of d.pacientes){
      if(!ex.has(p.id)){
        const{id,...data}=p;
        await setDoc(doc(db,'pacientes',p.id),data);
        count++;
      }
    }
    toast(`${count} pacientes importados`);
  }catch(err){alert('Error al leer el archivo JSON');}
}
async function importarCSV(text){
  try{
    const rows=parseCSV(text);
    if(rows.length<2){alert('El CSV debe tener al menos una fila de encabezado y una de datos.');return;}
    const header=rows[0].map(h=>h.trim().toLowerCase());
    const colNombre=findCol(header,['nombre','name','paciente']);
    const colCI=findCol(header,['ci','cedula','cédula']);
    const colTel=findCol(header,['telefono','teléfono','phone','celular']);
    const colNac=findCol(header,['nacimiento','fecha_nacimiento','dob','birth']);
    const colSexo=findCol(header,['sexo','sex','genero','género']);
    if(colNombre===-1){alert('CSV sin columna "nombre". Encabezados encontrados: '+header.join(', '));return;}
    const errors=[];
    const records=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      if(r.length===1&&!r[0].trim())continue;
      const nombre=(r[colNombre]||'').trim();
      if(!nombre){errors.push(`Fila ${i+1}: nombre vacío`);continue;}
      records.push({
        nombre,
        ci:colCI>=0?(r[colCI]||'').trim():'',
        telefono:colTel>=0?(r[colTel]||'').trim():'',
        nacimiento:colNac>=0?(r[colNac]||'').trim():'',
        sexo:colSexo>=0?(r[colSexo]||'').trim():''
      });
    }
    if(errors.length){alert(`Errores antes de importar:\n${errors.slice(0,5).join('\n')}${errors.length>5?'\n…':''}`);return;}
    if(!confirm(`¿Importar ${records.length} pacientes desde CSV?`))return;
    let count=0;
    for(const r of records){
      const data={...r,telefono2:'',email:'',especialidad:'general',motivo:'',antecedentes:'',patologias:'',oclusion:'',diagnostico:'',plan:'',plan_aceptado:'',restauracion:'',material:'',color_dental:'',color_deseado:'',laboratorio:'',indicaciones_tecnico:'',obs_importantes:'',teeth:{},teeth_obs:'',operatorias:[],procs:{},especialistas:[],records:[],consultas:[],firmas:{}};
      await addDoc(collection(db,'pacientes'),data);
      count++;
    }
    toast(`${count} pacientes importados desde CSV`);
  }catch(err){console.error(err);alert('Error al procesar el CSV');}
}
function parseCSV(text){
  const rows=[];let row=[];let cur='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];const nx=text[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){cur+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else cur+=ch;
    }else{
      if(ch==='"'){inQ=true;}
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch==='\r'){}
      else cur+=ch;
    }
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function findCol(header,candidates){for(const c of candidates){const i=header.indexOf(c);if(i>=0)return i;}return -1;}

function highlight(text,q){
  if(!q)return e(text);
  const escaped=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`(${escaped})`,'gi');
  return e(text).replace(re,'<mark>$1</mark>');
}
function matchesSearch(p,q){
  if(!q)return true;
  return ['nombre','ci','telefono','telefono2'].some(k=>(p[k]||'').toLowerCase().includes(q));
}

let sidebarAgeMin='';
let sidebarAgeMax='';
let sidebarFilterRecency='all';
let sidebarSortMode='name';
let filterPanelOpen=false;

window.setAgeMin=function(v){sidebarAgeMin=v;renderLista();};

window.saveCurrentFilter=function(){const n=prompt('Nombre para este filtro:');if(!n)return;const arr=JSON.parse(localStorage.getItem('ds_saved_filters')||'[]');arr.push({name:n.trim().slice(0,40),ageMin:sidebarAgeMin,ageMax:sidebarAgeMax,recency:sidebarFilterRecency,sort:sidebarSortMode});localStorage.setItem('ds_saved_filters',JSON.stringify(arr));toast('Filtro guardado');renderLista();};
window.applySavedFilter=function(i){const arr=JSON.parse(localStorage.getItem('ds_saved_filters')||'[]');const f=arr[i];if(!f)return;sidebarAgeMin=f.ageMin||'';sidebarAgeMax=f.ageMax||'';sidebarFilterRecency=f.recency;sidebarSortMode=f.sort;renderLista();};
window.deleteSavedFilter=function(i){const arr=JSON.parse(localStorage.getItem('ds_saved_filters')||'[]');arr.splice(i,1);localStorage.setItem('ds_saved_filters',JSON.stringify(arr));renderLista();};

function patientLastConsultaDate(p){
  if(!p.consultas||p.consultas.length===0)return '';
  let max='';
  for(const c of p.consultas){if(c.fecha&&c.fecha>max)max=c.fecha;}
  return max;
}
function patientMatchesAge(p){
  if(sidebarAgeMin===''&&sidebarAgeMax==='')return true;
  const yrs=edadAnios(p.nacimiento);
  if(yrs===null)return false;
  if(sidebarAgeMin!==''&&yrs<+sidebarAgeMin)return false;
  if(sidebarAgeMax!==''&&yrs>+sidebarAgeMax)return false;
  return true;
}
function patientMatchesRecencyFilter(p,f){
  if(f==='all')return true;
  const last=patientLastConsultaDate(p);
  if(!last)return false;
  const now=new Date();
  const lastDate=new Date(last);
  const diffDays=Math.floor((now-lastDate)/(1000*60*60*24));
  if(f==='week')return diffDays<=7;
  if(f==='month')return diffDays<=30;
  return true;
}

// ─── LIST ─────────────────────────────────────────────────────────────────
function renderLista(){
  const q=currentFilter;
  let filtered=pacientes.filter(p=>
    matchesSearch(p,q) &&
    patientMatchesAge(p) &&
    patientMatchesRecencyFilter(p,sidebarFilterRecency)
  );
  if(sidebarSortMode==='name'){
    filtered.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  }else if(sidebarSortMode==='recent'){
    filtered.sort((a,b)=>patientLastConsultaDate(b).localeCompare(patientLastConsultaDate(a)));
  }
  const anyFilterActive = (sidebarAgeMin!==''||sidebarAgeMax!=='') || sidebarFilterRecency!=='all' || sidebarSortMode!=='name';
  const _savedF=JSON.parse(localStorage.getItem('ds_saved_filters')||'[]');
  const _active=((sidebarAgeMin!==''||sidebarAgeMax!=='')?1:0)+(sidebarFilterRecency!=='all'?1:0)+(sidebarSortMode!=='name'?1:0);
  const _groups=`
    <div class="plist-filter-group"><span class="plist-filter-label">Edad (años)</span><div class="age-range">
      <input type="number" min="0" max="120" inputmode="numeric" placeholder="Mín" value="${sidebarAgeMin}" onchange="setAgeMin(this.value)">
      <span>–</span>
      <input type="number" min="0" max="120" inputmode="numeric" placeholder="Máx" value="${sidebarAgeMax}" onchange="setAgeMax(this.value)">
    </div></div>
    <div class="plist-filter-group"><span class="plist-filter-label">Última visita</span><div class="plist-filter-chips">
      ${[['all','Todos'],['week','Semana'],['month','Mes']].map(([k,l])=>`<button class="plist-chip${sidebarFilterRecency===k?' on':''}" onclick="setSidebarRecency('${k}')">${l}</button>`).join('')}
    </div></div>
    <div class="plist-filter-group"><span class="plist-filter-label">Orden</span><div class="plist-filter-chips">
      ${[['name','A-Z'],['recent','Recientes']].map(([k,l])=>`<button class="plist-chip${sidebarSortMode===k?' on':''}" onclick="setSidebarSort('${k}')">${l}</button>`).join('')}
    </div></div>`;
  const _panel=filterPanelOpen?`<div class="filter-panel">${_groups}
    <div class="filter-panel-actions"><button class="plist-chip" onclick="clearFilters()">Limpiar todo</button><button class="plist-chip" onclick="saveCurrentFilter()">Guardar filtro</button></div>
    ${_savedF.length?`<div class="filter-saved">${_savedF.map((f,i)=>`<span class="saved-chip"><button class="plist-chip" onclick="applySavedFilter(${i})">★ ${e(f.name)}</button><button class="saved-del" onclick="deleteSavedFilter(${i})" title="Borrar filtro guardado">×</button></span>`).join('')}</div>`:''}
  </div>`:'';
  const chipBar=`<div class="plist-filterbar"><button class="filter-toggle-btn${(_active||filterPanelOpen)?' on':''}" onclick="toggleFilterPanel()">⚙ Filtros${_active?` · ${_active}`:''}</button>${_active?`<button class="filter-clear-link" onclick="clearFilters()">Limpiar</button>`:''}</div>${_panel}`;
  const itemsHtml = filtered.length===0?
    `<p style="font-size:12px;color:var(--text3);padding:10px 8px">${pacientes.length===0?'Sin pacientes aún':'Sin resultados con los filtros'}</p>`:
    filtered.map(p=>{
      const yrs=edadAnios(p.nacimiento);
      return `<div class="pi${p.id===idActual?' on':''}" onclick="seleccionar('${p.id}')">
        <div class="pn">${highlight(p.nombre,q)}</div>
        <div class="pm">${highlight(p.ci||'Sin CI',q)}${yrs!==null?` · ${yrs}a`:''} · ${(p.consultas||[]).length} consulta${(p.consultas||[]).length!==1?'s':''}</div>
      </div>`;
    }).join('');
  document.getElementById('plist').innerHTML=chipBar+itemsHtml;
  const footer=anyFilterActive||q?`${filtered.length} de ${pacientes.length} pacientes`:`${pacientes.length} paciente${pacientes.length!==1?'s':''}`;
  document.getElementById('sfooter').textContent=footer;
}

// ─── CONSULTAS INDEX (3.3.3) ──────────────────────────────────────────────
function rebuildConsultasIndex(){
  consultasIndex=new Map();
  for(const p of pacientes){
    for(const c of(p.consultas||[])){
      if(c.fecha&&c.hora){
        const key=c.fecha+' '+c.hora;
        consultasIndex.set(key,{patientId:p.id,patientName:p.nombre,consultaId:c.id});
      }
    }
  }
}

function renderEmpty(){
  // v7.1 — self-heal (Bug #1): drop a stale admin flag for non-allowlisted sessions.
  if(isAdmin && !isAllowlistedAdmin()){ isAdmin=false; updateAdminUI(); }
  // Admins (without an impersonated user) land directly in admin view.
  // No "Consultas de hoy" widget — they get the user management list.
  if(isAdmin && !viewAsUid){
    viewActual='admin';
    return renderAdminEntry();
  }
  const today=hoy();
  const todayConsultas=[];
  for(const p of pacientes){
    for(const c of(p.consultas||[])){
      if(c.fecha===today)todayConsultas.push({...c,patientName:p.nombre,patientId:p.id});
    }
  }
  todayConsultas.sort((a,b)=>(a.hora||'00:00').localeCompare(b.hora||'00:00'));
  // Personal greeting with título Dr./Dra. if set
  let greeting='Selecciona un paciente o crea uno nuevo.';
  if(currentUserPerms&&currentUserPerms.name){
    const fullName=currentUserPerms.title?`${currentUserPerms.title} ${currentUserPerms.name.split(' ')[0]}`:currentUserPerms.name.split(' ')[0];
    greeting=pacientes.length===0
      ?`Hola ${fullName}, tu consultorio empieza aquí.`
      :`Hola ${fullName}, selecciona un paciente o crea uno nuevo.`;
  }else if(pacientes.length===0){
    greeting='Tu consultorio empieza aquí.';
  }
  let html=`${impersonationBanner()}<div class="panel"><div class="landing-grid">

// Set up subscription + render (called from renderEmpty when admin lands)
function renderAdminEntry(){
  if(!isAdmin || !isAllowlistedAdmin()){ isAdmin=false; return renderEmpty(); }
  viewActual='admin';
  setupPresenceWatch();
  if(!usersUnsubscribe){
    usersUnsubscribe=onSnapshot(collection(db,'users'),snap=>{
      allUsersList=snap.docs.map(d=>({uid:d.id,...d.data()}));
      allUsersList.sort((a,b)=>(a.name||a.email||'').localeCompare(b.name||b.email||''));
      if(viewActual==='admin')renderAdmin();
    },err=>{
      console.warn('Users subscription error:',err.message);
      allUsersList=[];
      if(viewActual==='admin')renderAdmin();
    });
  }
  if(!invitacionesUnsub){
    invitacionesUnsub=onSnapshot(collection(db,'invitaciones'),snap=>{
      invitacionesList=snap.docs.map(d=>({code:d.id,...d.data()}));
      invitacionesList.sort((a,b)=>(b.creadoEn||'').localeCompare(a.creadoEn||''));
      if(viewActual==='admin')renderAdmin();
    },err=>{console.warn('Invitaciones sub error:',err.message);});
  }
  renderAdmin();
}

async function setupPresence(user){
  if(_presenceSet||!user)return; _presenceSet=true;
  const deviceId=getDeviceId(), ua=(navigator.userAgent||'').slice(0,160);

      try{ await setDoc(doc(db,'users',user.uid),{deviceHistoryCount:increment(1)},{merge:true}); }catch(e){}
    }else{
      await setDoc(dref,{lastSeenAt:new Date().toISOString(),loginCount:increment(1)},{merge:true});
    }
  }catch(e){ console.warn('device rec:',e.message); }
  if(rtdb){ try{
    const sref=rdbRef(rtdb,'status/'+user.uid+'/'+deviceId);
    const conRef=rdbRef(rtdb,'.info/connected');
    onValue(conRef,snap=>{ if(snap.val()===true){ onDisconnect(sref).remove(); rdbSet(sref,{online:true,since:rdbTs(),ua:ua}); } });
  }catch(e){ console.warn('presence:',e.message); } }
}

function renderCalendar(){
  if(calendarView==='dia')renderCalendarDia();
  else renderCalendarMes();
}
function consultasByDayInMonth(year,month0){
  const map=new Map();
  for(const p of pacientes){
    for(const c of(p.consultas||[])){
      if(!c.fecha)continue;
      const parts=c.fecha.split('-');
      if(parts.length!==3)continue;
      const cy=parseInt(parts[0]);const cm=parseInt(parts[1]);
      if(cy===year&&cm===month0+1){
        if(!map.has(c.fecha))map.set(c.fecha,[]);
        map.get(c.fecha).push({...c,patientName:p.nombre,patientId:p.id});
      }
    }
  }
  // Sort each day's consultas by hour
  for(const arr of map.values())arr.sort((a,b)=>(a.hora||'00:00').localeCompare(b.hora||'00:00'));
  return map;
}
function renderCalendarMes(){
  const year=calendarDate.getFullYear();
  const month0=calendarDate.getMonth();
  const mes=MESES_LARGO[month0];
  const firstDay=new Date(year,month0,1);
  const lastDay=new Date(year,month0+1,0);
  const daysInMonth=lastDay.getDate();
  // shift Sunday(0) → 6, Monday(1) → 0
  let startWeekday=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startWeekday+daysInMonth)/7)*7;
  const byDay=consultasByDayInMonth(year,month0);
  const today=hoy();

  // Total this month for header
  let totalMes=0;
  for(const arr of byDay.values())totalMes+=arr.length;

  let gridHtml='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startWeekday+1;
    if(dayNum<1||dayNum>daysInMonth){
      gridHtml+=`<div class="mes-cell off"></div>`;
      continue;
    }
    const ds=`${year}-${String(month0+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const consultas=byDay.get(ds)||[];
    const count=consultas.length;
    const density=count===0?'':count<=2?'d1':count<=4?'d2':'d3';
    const isToday=ds===today;
    const dow=(i%7); // 0=Mon ... 5=Sat, 6=Sun
    const weekend=dow>=5?'wknd':'';
    const preview=consultas.slice(0,2).map(c=>{
      const firstName=(c.patientName||'').split(' ')[0]||'';
      const h=(c.hora||'').slice(0,5);
      return `<div class="mes-item"><span class="mes-item-h">${e(h||'--:--')}</span> <span class="mes-item-n">${e(firstName)}</span></div>`;
    }).join('');
    const more=count>2?`<div class="mes-more">+${count-2} más</div>`:'';
    gridHtml+=`<div class="mes-cell ${density} ${isToday?'hoy':''} ${weekend}" onclick="calVerDia('${ds}')" title="${count} consulta${count===1?'':'s'}">
      <div class="mes-head">
        <span class="mes-num">${dayNum}</span>
        ${count>0?`<span class="mes-badge">${count}</span>`:''}
      </div>
      ${preview}${more}
    </div>`;
  }

  document.getElementById('mainArea').innerHTML=`
    <div class="phdr">
      <div style="flex:1">
        <div class="phn">Calendario</div>
        <div class="phm">${mes} de ${year}${totalMes>0?` · ${totalMes} consulta${totalMes===1?'':'s'} este mes`:''}</div>
      </div>
      <button class="ba" onclick="toggleCalendar()">Cerrar calendario</button>
    </div>
    <div class="cal-nav">
      <div class="cal-view-toggle">
        <button class="cal-view-btn on" onclick="calVerMes()">Mes</button>
        <button class="cal-view-btn" onclick="calVerDia('${today}')">Día</button>
      </div>
      <div style="flex:1"></div>
      <button class="ba" onclick="calMesPrev()" title="Mes anterior">‹</button>
      <button class="ba" onclick="calToday()">Hoy</button>
      <button class="ba" onclick="calMesNext()" title="Mes siguiente">›</button>
    </div>
    <div class="panel cal-panel">
      <div class="mes-weekrow">
        ${WEEKDAYS_CORTO.map(w=>`<div class="mes-weekday">${w}</div>`).join('')}
      </div>
      <div class="mes-grid">
        ${gridHtml}
      </div>
    </div>`;
}

function renderPaciente(){
  const p=gp();
  if(!p){renderEmpty();return;}
  const ini=p.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  let tabs=[
    {k:'datos',l:'Datos personales'},
    {k:'clinico',l:'Historia clínica'},
    {k:'odonto',l:'Odontograma'},
    {k:'plan',l:'Plan de tratamiento'},
    {k:'ops',l:'Operatorias'},
    {k:'est',l:'Proc. estéticos'},
    {k:'rec',l:'Récord'},
    {k:'cons',l:`Consultas <span class="badge">${(p.consultas||[]).length}</span>`}
  ];
  // Filter tabs based on who's actually "in scope":
  // • Admin impersonating → use impersonated user's tabsAllowed (so "Ver como" truly matches what the user sees)
  // • Regular user        → use their own tabsAllowed
  // • Admin (not impersonating) → no filter, see all tabs
  const _impersonated = viewAsUid ? allUsersList.find(u=>u.uid===viewAsUid) : null;
  if(_impersonated && Array.isArray(_impersonated.tabsAllowed)){
    const allowed=new Set(_impersonated.tabsAllowed);
    tabs=tabs.filter(t=>allowed.has(t.k));
    if(tabs.length>0 && !tabs.find(t=>t.k===tabActual)){
      tabActual=tabs[0].k;
    }
  } else if(!isAdmin && currentUserPerms && Array.isArray(currentUserPerms.tabsAllowed)){
    const allowed=new Set(currentUserPerms.tabsAllowed);
    tabs=tabs.filter(t=>allowed.has(t.k));
    // If active tab got filtered out, fall back to first allowed
    if(tabs.length>0 && !tabs.find(t=>t.k===tabActual)){
      tabActual=tabs[0].k;
    }
  }
  if(tabs.length===0){
    // User has no tabs allowed at all — show a friendly blocker
    document.getElementById('mainArea').innerHTML=`
      <div class="phdr">
        <div class="pav">${ini}</div>
        <div style="flex:1;min-width:0">
          <div class="phn">${e(p.nombre)}</div>
          <div class="phm">${edad(p.nacimiento)}${edad(p.nacimiento)&&p.ci?' · ':''}${e(p.ci||'')}</div>
        </div>
        <button class="ba" onclick="volverInicio()">← Inicio</button>
      </div>
      <div class="panel"><div class="empty">
        <h3 style="font-family:'DM Sans',sans-serif;font-weight:400">Acceso restringido</h3>
        <p style="font-family:'Fraunces',serif;font-style:italic;color:var(--text2)">No tienes pestañas asignadas. Pide a un administrador que habilite tu acceso.</p>
      </div></div>`;
    return;
  }
  document.getElementById('mainArea').innerHTML=`
    ${impersonationBanner()}
    <div class="phdr">
      <div class="pav">${ini}</div>
      <div style="flex:1;min-width:0">
        <div class="phn">${e(p.nombre)}</div>
        <div class="phm">${edad(p.nacimiento)}${edad(p.nacimiento)&&p.ci?' · ':''}${e(p.ci||'')}${p.telefono?' · '+e(p.telefono):''}</div>
      </div>
      ${isAdmin?`<button class="ba" style="font-size:11px;padding:5px 10px" onclick="exportarPacienteJSON()" title="Descargar JSON de este paciente">⬇ JSON</button>`:''}
      <button class="ba" onclick="volverInicio()" title="Volver al inicio">← Inicio</button>
    </div>
    <div class="tabbar">${tabs.map(t=>`<button class="tab${tabActual===t.k?' on':''}" onclick="cambiarTab('${t.k}')">${t.l}</button>`).join('')}</div>
    <div class="panel" id="panel"></div>`;
  renderTab();
}
