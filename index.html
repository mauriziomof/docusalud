<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuSalud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────────────── */
:root {
  --forest:   #1F3A2A;
  --sage:     #2F5D3A;
  --olive:    #7A8A6E;
  --mist:     #DCE3D2;
  --charcoal: #1A1A17;
  --slate:    #5C5C56;
  --cream:    #F5F1E8;
  --bone:     #FBFAF6;
  --terra:    #B8553E;
  --brass:    #C9A961;
  --petrol:   #4A6B7C;

  --bg:       var(--cream);
  --surface:  var(--bone);
  --surface2: #EDE9DF;
  --border:   rgba(31,58,42,0.12);
  --border2:  rgba(31,58,42,0.22);
  --text:     var(--charcoal);
  --text2:    var(--slate);
  --text3:    var(--olive);
  --accent:   var(--forest);
  --accent-light: var(--mist);
  --accent-border: rgba(31,58,42,0.3);
  --danger:   var(--terra);
  --danger-light: #F7EAE7;
  --warn:     var(--brass);
  --warn-light: #F7F1E0;
  --info:     var(--petrol);
  --info-light: #E5EDF0;

  --r: 8px;
  --rl: 12px;
  --border-default: 0.5px solid var(--border);
}

/* DARK MODE */
[data-theme="dark"] {
  --bg:       #141410;
  --surface:  #1E1E19;
  --surface2: #252520;
  --border:   rgba(220,227,210,0.1);
  --border2:  rgba(220,227,210,0.18);
  --text:     #EDEAE0;
  --text2:    #9A9A8E;
  --text3:    #7A8A6E;
  --accent:   #2F5D3A;
  --accent-light: rgba(31,58,42,0.25);
  --accent-border: rgba(47,93,58,0.5);
  --danger-light: rgba(184,85,62,0.15);
  --warn-light: rgba(201,169,97,0.15);
  --info-light: rgba(74,107,124,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

/* ── LOGIN ──────────────────────────────────────────────────────────── */
.lbg {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.lbox {
  background: var(--surface);
  border: var(--border-default);
  border-radius: var(--rl);
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  text-align: center;
}
.lbox h2 {
  font-family: 'Fraunces', serif;
  font-size: 28px; font-weight: 300;
  color: var(--text); margin-bottom: 4px;
}
.lbox p { font-size: 12px; color: var(--text3); margin-bottom: 28px; letter-spacing: 0.04em; text-transform: uppercase; }
.lbox input {
  width: 100%; padding: 11px 14px;
  font-size: 14px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text);
  outline: none; text-align: center; letter-spacing: 0.12em;
  margin-bottom: 12px; transition: border 0.15s;
}
.lbox input:focus { border-color: var(--forest); }
.lbox button {
  width: 100%; padding: 12px;
  font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist);
  border: none; border-radius: var(--r); cursor: pointer;
  letter-spacing: 0.04em; transition: opacity 0.15s;
}
.lbox button:hover { opacity: 0.88; }
.lerr { font-size: 12px; color: var(--terra); margin-top: 10px; min-height: 16px; }

/* ── TOPBAR ─────────────────────────────────────────────────────────── */
.topbar {
  background: var(--surface);
  border-bottom: var(--border-default);
  padding: 0 20px; height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 700; color: var(--forest);
  letter-spacing: -0.01em;
}
.brand-name span { font-weight: 400; }
.brand-sub { font-size: 9px; color: var(--text3); letter-spacing: 0.18em; text-transform: uppercase; }
.sync-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
.dot.ok { background: #4CAF7D; }
.dot.ing { background: var(--brass); animation: pu 1s infinite; }
.dot.err { background: var(--terra); }
@keyframes pu { 0%,100%{opacity:1} 50%{opacity:.3} }
.tbtn {
  padding: 6px 11px; font-size: 11px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: transparent; color: var(--text2); cursor: pointer;
  letter-spacing: 0.02em; transition: all 0.12s;
}
.tbtn:hover { background: var(--surface2); }
.dark-toggle {
  width: 32px; height: 32px; border-radius: 50%;
  border: var(--border-default); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.12s; color: var(--text2);
}
.dark-toggle:hover { background: var(--surface2); }

/* ── LAYOUT ─────────────────────────────────────────────────────────── */
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 252px; min-width: 252px;
  background: var(--surface);
  border-right: var(--border-default);
  display: flex; flex-direction: column;
}
.stop { padding: 12px; }
.swrap { position: relative; margin-bottom: 8px; }
.swrap::before { content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; color: var(--text3); }
.swrap input {
  width: 100%; padding: 7px 10px 7px 30px;
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none;
  transition: border 0.12s;
}
.swrap input:focus { border-color: var(--forest); }
.bnew {
  width: 100%; padding: 8px;
  font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist);
  border: none; border-radius: var(--r); cursor: pointer;
  letter-spacing: 0.02em; transition: opacity 0.12s;
}
.bnew:hover { opacity: 0.88; }
.plist { flex: 1; overflow-y: auto; padding: 6px; }
.pi {
  padding: 10px 11px; border-radius: var(--r);
  cursor: pointer; margin-bottom: 2px;
  border: 0.5px solid transparent; transition: all 0.1s;
}
.pi:hover { background: var(--surface2); }
.pi.on { background: var(--accent-light); border-color: var(--accent-border); }
.pn { font-size: 13px; font-weight: 500; color: var(--text); }
.pi.on .pn { color: var(--forest); }
.pm { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sfoot { padding: 10px 12px; border-top: var(--border-default); font-size: 11px; color: var(--text3); text-align: center; letter-spacing: 0.04em; }

/* ── MAIN ───────────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.phdr {
  background: var(--surface); border-bottom: var(--border-default);
  padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.pav {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--mist); border: 0.5px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--forest); flex-shrink: 0;
  letter-spacing: -0.02em;
}
.phn { font-size: 15px; font-weight: 500; color: var(--text); }
.phm { font-size: 11px; color: var(--text3); margin-top: 2px; letter-spacing: 0.02em; }
.tabbar {
  background: var(--surface); border-bottom: var(--border-default);
  padding: 0 16px; display: flex; overflow-x: auto; flex-shrink: 0;
}
.tabbar::-webkit-scrollbar { height: 0; }
.tab {
  padding: 12px 13px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  color: var(--text3); border: none; background: none; cursor: pointer;
  border-bottom: 1.5px solid transparent; margin-bottom: -0.5px;
  white-space: nowrap; transition: all 0.1s; letter-spacing: 0.01em;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--forest); border-bottom-color: var(--forest); font-weight: 500; }
.panel { flex: 1; overflow-y: auto; padding: 20px; }

/* ── EMPTY ──────────────────────────────────────────────────────────── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; }
.empty h3 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 300; color: var(--text2); }
.empty p { font-size: 13px; color: var(--text3); }

/* ── CARDS ──────────────────────────────────────────────────────────── */
.card { background: var(--surface); border: var(--border-default); border-radius: var(--rl); padding: 16px 18px; margin-bottom: 14px; }
.ct { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: var(--text3); text-transform: uppercase; margin-bottom: 14px; }
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.fg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.f { display: flex; flex-direction: column; gap: 4px; }
.f.full { grid-column: 1/-1; }
.f label { font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
.f input,.f select,.f textarea {
  padding: 8px 10px; font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none; transition: border 0.12s;
}
.f input:focus,.f select:focus,.f textarea:focus { border-color: var(--forest); background: var(--surface); }
.f textarea { resize: vertical; min-height: 68px; line-height: 1.65; }

/* ── BUTTONS ────────────────────────────────────────────────────────── */
.bs {
  padding: 9px 20px; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  background: var(--forest); color: var(--mist); border: none; border-radius: var(--r);
  cursor: pointer; letter-spacing: 0.03em; transition: opacity 0.12s;
}
.bs:hover { opacity: 0.88; }
.bd {
  padding: 9px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  background: none; color: var(--terra); border: 0.5px solid rgba(184,85,62,0.35);
  border-radius: var(--r); cursor: pointer; transition: all 0.12s;
}
.bd:hover { background: var(--danger-light); }
.ba {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: var(--r);
  background: var(--surface); color: var(--text2); cursor: pointer;
  margin-bottom: 12px; transition: all 0.12s; letter-spacing: 0.01em;
}
.ba:hover { background: var(--surface2); border-color: var(--border2); }

/* ── ODONTOGRAMA ────────────────────────────────────────────────────── */
.ow { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.al { font-size: 9px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.12em; }
.tr { display: flex; gap: 3px; }
.tooth {
  width: 30px; height: 38px; border: var(--border-default); border-radius: 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; background: var(--surface2); transition: all 0.1s; gap: 1px;
}
.tooth:hover { transform: translateY(-1px); border-color: var(--border2); }
.tooth .tn { font-size: 8px; color: var(--text3); line-height: 1; }
.tooth .ts { font-size: 10px; font-weight: 500; line-height: 1; }
.tooth.caries { background: var(--danger-light); border-color: rgba(184,85,62,0.4); } .tooth.caries .ts { color: var(--terra); }
.tooth.tratado { background: var(--accent-light); border-color: var(--accent-border); } .tooth.tratado .ts { color: var(--forest); }
.tooth.ausente { opacity: .4; } .tooth.ausente .ts { color: var(--text3); }
.tooth.corona { background: var(--info-light); border-color: rgba(74,107,124,0.35); } .tooth.corona .ts { color: var(--petrol); }
.tooth.endodoncia { background: var(--warn-light); border-color: rgba(201,169,97,0.4); } .tooth.endodoncia .ts { color: var(--brass); }
.tooth.protesis { background: #F0EBF7; border-color: rgba(120,80,160,0.3); } .tooth.protesis .ts { color: #785090; }
.ml { width: 0.5px; background: var(--border2); height: 36px; margin: 0 3px; align-self: center; }
.tleg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
.leg {
  display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2);
  cursor: pointer; padding: 4px 10px; border-radius: 20px;
  border: var(--border-default); background: var(--surface); user-select: none; transition: all 0.1s;
}
.leg:hover { border-color: var(--border2); }
.leg.sel { border-color: var(--forest); background: var(--accent-light); color: var(--forest); font-weight: 500; }
.ld { width: 10px; height: 10px; border-radius: 2px; border: 0.5px solid; }

/* ── TABLES ─────────────────────────────────────────────────────────── */
.ptbl,.otbl,.rtbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.ptbl th,.otbl th,.rtbl th {
  font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.08em;
  padding: 6px 8px; border-bottom: var(--border-default); background: var(--surface2); text-align: left; text-transform: uppercase;
}
.ptbl td,.otbl td { padding: 5px 7px; border-bottom: var(--border-default); vertical-align: middle; }
.ptbl td:first-child { color: var(--text2); min-width: 180px; }
.rtbl td { padding: 8px 10px; border-bottom: var(--border-default); color: var(--text); vertical-align: top; }
.rtbl tr:last-child td { border-bottom: none; }
.rtbl tr:hover td { background: var(--surface2); }
.ptbl input,.otbl input {
  width: 100%; padding: 5px 7px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  border: var(--border-default); border-radius: 6px; background: var(--surface2); color: var(--text); outline: none;
}
.ptbl input:focus,.otbl input:focus { border-color: var(--forest); }
.bdel { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.bdel:hover { color: var(--terra); }

/* ── CONSULTAS ──────────────────────────────────────────────────────── */
.cc { background: var(--surface); border: var(--border-default); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; transition: border 0.1s; }
.cc:hover { border-color: var(--border2); }
.cch { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.ccd { font-size: 10px; color: var(--text3); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.cct { font-size: 14px; font-weight: 500; color: var(--text); margin-top: 2px; }
.ccn { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.65; }
.ccc { font-size: 11px; font-weight: 500; color: var(--forest); background: var(--mist); padding: 2px 9px; border-radius: 20px; }

/* ── MODAL ──────────────────────────────────────────────────────────── */
.mbg { position: fixed; inset: 0; background: rgba(26,26,23,0.5); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; backdrop-filter: blur(2px); }
.mbox { background: var(--surface); border-radius: var(--rl); padding: 24px; width: 100%; max-width: 420px; border: var(--border-default); max-height: 90vh; overflow-y: auto; }
.mbox h3 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; margin-bottom: 18px; color: var(--text); }
.mact { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.bc { padding: 8px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: transparent; color: var(--text2); cursor: pointer; }
.mf { margin-bottom: 12px; }
.mf label { display: block; font-size: 10px; font-weight: 500; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
.mf input,.mf textarea,.mf select { width: 100%; padding: 8px 10px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: var(--border-default); border-radius: var(--r); background: var(--surface2); color: var(--text); outline: none; }
.mf textarea { min-height: 68px; resize: vertical; }
.mf input:focus,.mf textarea:focus { border-color: var(--forest); }

/* ── FIRMAS ─────────────────────────────────────────────────────────── */
.fr { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
.fb { text-align: center; }
.fl { border-top: var(--border-default); margin-top: 44px; padding-top: 6px; font-size: 11px; color: var(--text3); letter-spacing: 0.04em; }

/* ── TOAST ──────────────────────────────────────────────────────────── */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--charcoal); color: var(--cream); padding: 10px 18px; border-radius: var(--r); font-size: 12px; opacity: 0; transition: opacity 0.2s; z-index: 999; pointer-events: none; letter-spacing: 0.02em; }
.toast.show { opacity: 1; }
.badge { background: var(--mist); color: var(--forest); font-size: 10px; padding: 1px 7px; border-radius: 20px; margin-left: 4px; font-weight: 500; }

/* ── SCROLLBAR ──────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

/* ── MOBILE ─────────────────────────────────────────────────────────── */
@media(max-width:768px){
  body { height: 100dvh; }
  .layout { flex-direction: column; height: calc(100dvh - 54px - 58px); }
  .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: var(--border-default); display: none; }
  .sidebar.open { display: flex; flex-direction: column; position: fixed; inset: 54px 0 58px 0; z-index: 100; }
  .main { flex: 1; overflow: hidden; }
  .panel { padding: 12px; }
  .topbar { padding: 0 12px; }
  .brand-sub { display: none; }
  .sync-wrap span { display: none; }
  .tbtn { padding: 5px 8px; font-size: 11px; }
  .fg { grid-template-columns: 1fr; }
  .fg3 { grid-template-columns: 1fr 1fr; }
  .tab { padding: 10px 9px; font-size: 11px; }
  .phdr { padding: 10px 12px; }
  .card { padding: 12px 14px; }
  .mbox { padding: 18px; }
  .tooth { width: 24px; height: 30px; }
  .tooth .tn { font-size: 7px; }
  .tooth .ts { font-size: 9px; }
  .ml { height: 28px; }
  .bottom-nav { display: flex; }
  #menuBtn { display: block !important; }
}

/* ── BOTTOM NAV ─────────────────────────────────────────────────────── */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: 58px; background: var(--surface); border-top: var(--border-default);
  z-index: 99; align-items: stretch;
}
.bn-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; border: none; background: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 9px; color: var(--text3);
  padding: 0; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.1s;
}
.bn-btn.on { color: var(--forest); }
.bn-btn svg { width: 20px; height: 20px; }

/* ── PRINT ──────────────────────────────────────────────────────────── */
@media print {
  .sidebar,.topbar,.tabbar,.bs,.ba,.bnew,.bd,.tbtn,.bottom-nav { display: none !important; }
  body,html { overflow: visible; height: auto; }
  .layout,.main { overflow: visible; }
  .panel { overflow: visible; padding: 0; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="lbg" id="loginBg">
  <div class="lbox">
    <!-- LOGO: D-portapapeles -->
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:16px">
      <rect width="52" height="52" rx="12" fill="#1F3A2A"/>
      <rect x="14" y="9" width="24" height="34" rx="3" fill="#DCE3D2" opacity="0.15" stroke="#DCE3D2" stroke-width="1.5"/>
      <rect x="20" y="6" width="12" height="6" rx="2" fill="#1F3A2A" stroke="#DCE3D2" stroke-width="1.5"/>
      <line x1="19" y1="22" x2="33" y2="22" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="19" y1="27" x2="33" y2="27" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="24" y1="17" x2="28" y2="17" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="15" x2="26" y2="19" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/>
      <line x1="19" y1="33" x2="28" y2="33" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </svg>
    <h2>DocuSalud</h2>
    <p>Historias clínicas · Acceso privado</p>
    <input type="password" id="loginPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkLogin()">
    <button onclick="checkLogin()">Entrar</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCn1ELv-CLd2-C-agYGVt7dHeYlrw7T-_M",
  authDomain: "docusalud-4b215.firebaseapp.com",

};

const app = initializeApp(firebaseConfig);

const UPPER=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];

const SIMBOLOS={sano:'',caries:'C',tratado:'T',ausente:'✕',corona:'Cor',endodoncia:'E',protesis:'P'};
const PROCS=['Impresiones / Escaneo','Mock Up / Provisionales','Preparación de dientes','Colocación de provisionales','Impresiones / Escaneo (final)','Prueba de porcelana terminado','Prueba de rodete','Prueba de enfilado','Instalación de prótesis','Cementación de coronas','Cementación de carillas','Tipo y marca de cemento'];

let pacientes=[],idActual=null,tabActual='datos',estadoDiente='caries',syncTimer=null,modalFn=null;

// DARK MODE
window.toggleDark=function(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',isDark?'':'dark');

  localStorage.setItem('ds_theme',isDark?'':'dark');
}

if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('darkBtn').textContent='☀️';}

// LOGIN
window.checkLogin=function(){
  const pass=document.getElementById('loginPass').value;
  if(pass==='ds-temp-2026-04'){
    document.getElementById('loginBg').style.display='none';
    sessionStorage.setItem('ds_auth','1');
  } else {
    document.getElementById('loginErr').textContent='Contraseña incorrecta';

  }
}
if(sessionStorage.getItem('ds_auth')==='1') document.getElementById('loginBg').style.display='none';

// MOBILE
window.toggleSidebar=function(){document.getElementById('sidebar').classList.toggle('open')}
function isMobile(){return window.innerWidth<=768}
function checkMobile(){
  const btn=document.getElementById('menuBtn');

  if(bn) bn.style.display=isMobile()?'flex':'none';
}
window.addEventListener('resize',checkMobile);
checkMobile();

// UTILS
function ss(state,label){document.getElementById('syncDot').className='dot '+state;document.getElementById('syncLabel').textContent=label}
function gp(){return pacientes.find(p=>p.id===idActual)}
function g(id){const el=document.getElementById(id);return el?el.value:''}
function e(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ff(d){if(!d)return'';const[y,m,dd]=d.split('-');const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(dd)} ${M[parseInt(m)-1]} ${y}`}
function edad(nac){if(!nac)return'';const h=new Date(),n=new Date(nac);let a=h.getFullYear()-n.getFullYear();if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate()))a--;return`${a} años`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

// FIRESTORE
onSnapshot(collection(db,'pacientes'),snap=>{
  pacientes=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderLista();
  if(idActual&&gp())renderPaciente();
  ss('ok','Sincronizado');
},()=>ss('err','Sin conexión'));

async function guardar(p){ss('ing','Guardando...');const{id,...data}=p;try{await setDoc(doc(db,'pacientes',id),data);ss('ok','Guardado')}catch(err){ss('err','Error')}}
async function crear(data){ss('ing','Guardando...');try{const ref=await addDoc(collection(db,'pacientes'),data);ss('ok','Guardado');return ref.id}catch(err){ss('err','Error');return null}}
async function borrar(id){try{await deleteDoc(doc(db,'pacientes',id))}catch(err){}}

// EXPORTAR / IMPORTAR
window.exportar=function(){
  const data=JSON.stringify({pacientes,exportado:new Date().toISOString()},null,2);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=`docusalud_${new Date().toISOString().slice(0,10)}.json`;a.click();toast('Respaldo exportado');
}
window.importar=async function(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e2=>{
    try{const d=JSON.parse(e2.target.result);if(!d.pacientes){alert('Archivo inválido');return}
      if(!confirm(`¿Importar ${d.pacientes.length} pacientes?`))return;
      const ex=new Set(pacientes.map(p=>p.id));let count=0;
      for(const p of d.pacientes){if(!ex.has(p.id)){const{id,...data}=p;await setDoc(doc(db,'pacientes',p.id),data);count++}}
      toast(`${count} pacientes importados`);
    }catch(err){alert('Error al leer el archivo')}
  };reader.readAsText(file);ev.target.value='';
}

// LISTA
function renderLista(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=pacientes.filter(p=>p.nombre.toLowerCase().includes(q)||(p.ci||'').includes(q)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  document.getElementById('plist').innerHTML=f.length===0?'<p style="font-size:12px;color:var(--text3);padding:10px 8px">Sin resultados</p>':
    f.map(p=>`<div class="pi${p.id===idActual?' on':''}" onclick="seleccionar('${p.id}')"><div class="pn">${e(p.nombre)}</div><div class="pm">${e(p.ci||'Sin CI')} · ${(p.consultas||[]).length} consulta${(p.consultas||[]).length!==1?'s':''}</div></div>`).join('');
  document.getElementById('sfooter').textContent=`${pacientes.length} paciente${pacientes.length!==1?'s':''}`;
}
window.filtrar=function(){renderLista()}
window.seleccionar=function(id){
  idActual=id;tabActual='datos';renderLista();renderPaciente();
  if(isMobile()) document.getElementById('sidebar').classList.remove('open');
}

// PACIENTE
function logoSVG(size=28){return`<svg width="${size}" height="${size}" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="52" height="52" rx="12" fill="#1F3A2A"/><rect x="14" y="9" width="24" height="34" rx="3" fill="#DCE3D2" opacity="0.15" stroke="#DCE3D2" stroke-width="1.5"/><rect x="20" y="6" width="12" height="6" rx="2" fill="#1F3A2A" stroke="#DCE3D2" stroke-width="1.5"/><line x1="19" y1="22" x2="33" y2="22" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/><line x1="19" y1="27" x2="33" y2="27" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round"/><line x1="24" y1="17" x2="28" y2="17" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/><line x1="26" y1="15" x2="26" y2="19" stroke="#DCE3D2" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="33" x2="28" y2="33" stroke="#DCE3D2" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/></svg>`}

function renderPaciente(){
  const p=gp();if(!p)return;
  const ini=p.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const tabs=[{k:'datos',l:'Datos personales'},{k:'clinico',l:'Historia clínica'},{k:'odonto',l:'Odontograma'},{k:'plan',l:'Plan de tratamiento'},{k:'ops',l:'Operatorias'},{k:'est',l:'Proc. estéticos'},{k:'rec',l:'Récord'},{k:'cons',l:`Consultas <span class="badge">${(p.consultas||[]).length}</span>`}];
  document.getElementById('mainArea').innerHTML=`
    <div class="phdr"><div class="pav">${ini}</div><div><div class="phn">${e(p.nombre)}</div><div class="phm">${edad(p.nacimiento)}${edad(p.nacimiento)&&p.ci?' · ':''}${e(p.ci||'')}${p.telefono?' · '+e(p.telefono):''}</div></div></div>
    <div class="tabbar">${tabs.map(t=>`<button class="tab${tabActual===t.k?' on':''}" onclick="cambiarTab('${t.k}')">${t.l}</button>`).join('')}</div>
    <div class="panel" id="panel"></div>`;
  renderTab();
}
window.cambiarTab=function(tab){tabActual=tab;document.querySelectorAll('.tab').forEach((b,i)=>{const k=['datos','clinico','odonto','plan','ops','est','rec','cons'];b.classList.toggle('on',k[i]===tab)});renderTab()}
function renderTab(){const t=tabActual;if(t==='datos')renderDatos();else if(t==='clinico')renderClinico();else if(t==='odonto')renderOdonto();else if(t==='plan')renderPlan();else if(t==='ops')renderOps();else if(t==='est')renderEst();else if(t==='rec')renderRec();else if(t==='cons')renderCons()}

// DATOS
function renderDatos(){const p=gp();document.getElementById('panel').innerHTML=`
  <div class="card"><div class="ct">Datos personales</div>
    <div class="fg"><div class="f full"><label>Nombre y Apellido</label><input id="d_n" value="${e(p.nombre||'')}"></div></div>
    <div class="fg3"><div class="f"><label>Fecha de nacimiento</label><input type="date" id="d_nac" value="${e(p.nacimiento||'')}"></div><div class="f"><label>CI</label><div style="display:flex;gap:5px"><select id="d_ci_tipo" onchange="const i=document.getElementById('d_ci');i.maxLength=this.value==='J'?9:8"><option value="V"${(p.ci||'').startsWith('J')?'':' selected'}>V</option><option value="J"${(p.ci||'').startsWith('J')?' selected':''}>J</option><option value="E"${(p.ci||'').startsWith('E')?' selected':''}>E</option></select><input id="d_ci" value="${e((p.ci||'').replace(/^[VJE]-/,''))}" maxlength="8" type="text" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div></div><div class="f"><label>Sexo</label><select id="d_sx"><option value="">—</option><option value="F"${p.sexo==='F'?' selected':''}>Femenino</option><option value="M"${p.sexo==='M'?' selected':''}>Masculino</option><option value="O"${p.sexo==='O'?' selected':''}>Otro</option></select></div></div>
    <div class="fg"><div class="f"><label>Teléfono</label><input id="d_t1" value="${e(p.telefono||'')}"></div><div class="f"><label>Teléfono 2</label><input id="d_t2" value="${e(p.telefono2||'')}"></div></div>

  </div>
  <div style="display:flex;gap:8px"><button class="bs" onclick="guardarDatos()">Guardar</button><button class="bd" onclick="eliminarP()">Eliminar paciente</button></div>`}
window.guardarDatos=async function(){const p=gp();p.nombre=g('d_n')||p.nombre;p.nacimiento=g('d_nac');p.ci=g('d_ci_tipo')+'-'+g('d_ci');p.sexo=g('d_sx');p.telefono=g('d_t1');p.telefono2=g('d_t2');p.email=g('d_em');await guardar(p);renderLista();toast('Guardado')}
window.eliminarP=async function(){if(!confirm(`¿Eliminar a "${gp().nombre}"?`))return;await borrar(idActual);idActual=null;renderLista();document.getElementById('mainArea').innerHTML=`<div class="panel"><div class="empty">${logoSVG(52)}<h3>DocuSalud</h3><p>Selecciona un paciente.</p></div></div>`}

// HISTORIA CLINICA
function renderClinico(){const p=gp();document.getElementById('panel').innerHTML=`
  <div class="card"><div class="ct">Historia clínica</div>

// ODONTOGRAMA
function renderOdonto(){const p=gp();const est=estadoDiente;

  function br(nums){const mid=nums.length/2;return nums.map((n,i)=>{const st=(p.teeth||{})[n]||'sano';return`${i===mid?'<div class="ml"></div>':''}<div class="tooth ${st}" onclick="mDiente(${n})" oncontextmenu="rDiente(event,${n})" title="Diente ${n}"><span class="tn">${n}</span><span class="ts">${SIMBOLOS[st]||''}</span></div>`}).join('')}

    <p style="font-size:11px;color:var(--text3);text-align:center;margin-top:10px">Selecciona un estado y haz clic en el diente · Clic derecho para restablecer</p>

    <button class="bs" style="margin-top:10px" onclick="guardarObs()">Guardar observaciones</button>
  </div>`}
window.setEst=function(st){estadoDiente=st;renderOdonto()}

    <div class="fg"><div class="f"><label>Material elegido</label><input id="pt_ma" value="${e(p.material||'')}"></div><div class="f"><label>Color dental</label><input id="pt_cd" value="${e(p.color_dental||'')}"></div></div>
    <div class="fg"><div class="f"><label>Color deseado</label><input id="pt_cs" value="${e(p.color_deseado||'')}"></div><div class="f"><label>Laboratorio / Técnico</label><input id="pt_la" value="${e(p.laboratorio||'')}"></div></div>
    <div class="f" style="margin-bottom:10px"><label>Indicaciones al técnico dental</label><textarea id="pt_in">${e(p.indicaciones_tecnico||'')}</textarea></div>
    <div class="f"><label>Observaciones importantes</label><textarea id="pt_ob">${e(p.obs_importantes||'')}</textarea></div>
  </div>
  <div class="card"><div class="ct">Firmas</div>
    <div class="fr"><div class="fb"><div class="fl">Firma del paciente</div></div><div class="fb"><div class="fl">Firma del odontólogo</div></div></div>
  </div>
  <button class="bs" onclick="guardarPlan()">Guardar</button>`;renderEspTbl()}
function renderEspTbl(){const p=gp();const esp=p.especialistas||[];const tb=document.getElementById('esp-body');if(!tb)return;
  tb.innerHTML=esp.length===0?`<tr><td colspan="3" style="font-size:12px;color:var(--text3);padding:8px 10px">Sin especialistas.</td></tr>`:
    esp.map((x,i)=>`<tr><td><input value="${e(x.odontologo||'')}" onchange="updEsp(${i},'odontologo',this.value)" style="width:100%;padding:5px 7px;font-size:12px;border:var(--border-default);border-radius:6px;background:var(--surface2);font-family:'DM Sans',sans-serif;color:var(--text);outline:none"></td><td><input value="${e(x.tratamiento||'')}" onchange="updEsp(${i},'tratamiento',this.value)" style="width:100%;padding:5px 7px;font-size:12px;border:var(--border-default);border-radius:6px;background:var(--surface2);font-family:'DM Sans',sans-serif;color:var(--text);outline:none"></td><td><button class="bdel" onclick="delEsp(${i})">✕</button></td></tr>`).join('')}
window.addEsp=async function(){const p=gp();if(!p.especialistas)p.especialistas=[];p.especialistas.push({odontologo:'',tratamiento:''});await guardar(p);renderEspTbl()}
window.updEsp=function(i,k,v){const p=gp();if(p.especialistas&&p.especialistas[i])p.especialistas[i][k]=v;clearTimeout(syncTimer);syncTimer=setTimeout(()=>guardar(p),700)}
window.delEsp=async function(i){const p=gp();p.especialistas.splice(i,1);await guardar(p);renderEspTbl()}
window.guardarPlan=async function(){const p=gp();p.plan=g('pt_pl');p.plan_aceptado=g('pt_ac');p.restauracion=g('pt_re');p.material=g('pt_ma');p.color_dental=g('pt_cd');p.color_deseado=g('pt_cs');p.laboratorio=g('pt_la');p.indicaciones_tecnico=g('pt_in');p.obs_importantes=g('pt_ob');await guardar(p);toast('Guardado')}

// OPERATORIAS
function renderOps(){const p=gp();const ops=p.operatorias||[];
  const rows=Array.from({length:Math.max(ops.length+2,6)},(_,i)=>{const o=ops[i]||{ud:'',fibra:'',color:'',marca:''};return`<tr><td><input value="${e(o.ud)}" onchange="updOp(${i},'ud',this.value)"></td><td><input value="${e(o.fibra)}" onchange="updOp(${i},'fibra',this.value)"></td><td><input value="${e(o.color)}" onchange="updOp(${i},'color',this.value)"></td><td><input value="${e(o.marca)}" onchange="updOp(${i},'marca',this.value)"></td></tr>`}).join('');
  document.getElementById('panel').innerHTML=`
  <div class="card"><div class="ct">Operatorias realizadas</div>
    <div style="overflow-x:auto"><table class="otbl" style="min-width:480px"><thead><tr><th>Unidad Dentaria</th><th>Fibra de vidrio</th><th>Color resinas</th><th>Marca resina</th></tr></thead><tbody>${rows}</tbody></table></div>
    <button class="ba" style="margin-top:10px" onclick="addOp()">+ Agregar fila</button>
  </div>`}
window.updOp=function(i,k,v){const p=gp();if(!p.operatorias)p.operatorias=[];while(p.operatorias.length<=i)p.operatorias.push({ud:'',fibra:'',color:'',marca:''});p.operatorias[i][k]=v;clearTimeout(syncTimer);syncTimer=setTimeout(()=>guardar(p),700)}
window.addOp=async function(){const p=gp();if(!p.operatorias)p.operatorias=[];p.operatorias.push({ud:'',fibra:'',color:'',marca:''});await guardar(p);renderOps()}

// ESTETICO
function renderEst(){const p=gp();const pr=p.procs||{};
  const rows=PROCS.map(proc=>{const k=proc.replace(/[^a-z0-9]/gi,'_').toLowerCase();const d=pr[k]||{fecha:'',obs:''};return`<tr><td>${proc}</td><td><input type="date" value="${e(d.fecha)}" onchange="updProc('${k}','fecha',this.value)"></td><td><input value="${e(d.obs)}" placeholder="Observaciones..." onchange="updProc('${k}','obs',this.value)"></td></tr>`}).join('');
  document.getElementById('panel').innerHTML=`
  <div class="card"><div class="ct">Procedimientos estéticos / protésicos</div>
    <div style="overflow-x:auto"><table class="ptbl" style="min-width:480px"><thead><tr><th>Procedimiento</th><th>Fecha</th><th>Observaciones</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`}
window.updProc=function(k,f,v){const p=gp();if(!p.procs)p.procs={};if(!p.procs[k])p.procs[k]={fecha:'',obs:''};p.procs[k][f]=v;clearTimeout(syncTimer);syncTimer=setTimeout(()=>guardar(p),700)}

// RECORD
function renderRec(){const p=gp();const recs=[...(p.records||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  document.getElementById('panel').innerHTML=`
  <button class="ba" onclick="modalRec()">+ Agregar registro</button>
  <div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
    <table class="rtbl" style="min-width:380px"><thead><tr><th style="width:110px">Fecha</th><th>Tratamiento realizado</th><th style="width:36px"></th></tr></thead>
    <tbody>${recs.length===0?'<tr><td colspan="3" style="font-size:12px;color:var(--text3);padding:12px">Sin registros aún.</td></tr>':recs.map(r=>`<tr><td style="white-space:nowrap;color:var(--text3);font-size:11px;letter-spacing:0.02em">${ff(r.fecha)}</td><td>${e(r.tratamiento)}</td><td><button class="bdel" onclick="delRec('${r.id}')">✕</button></td></tr>`).join('')}</tbody>
    </table></div></div>`}
window.modalRec=function(){const hoy=new Date().toISOString().split('T')[0];
  abrirModal('Nuevo registro',`<div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${hoy}"></div><div class="mf"><label>Tratamiento realizado</label><textarea id="m_tr" placeholder="Describe el tratamiento..."></textarea></div>`,
    async()=>{const tr=g('m_tr').trim();if(!tr){alert('Ingresa el tratamiento.');return}const p=gp();if(!p.records)p.records=[];p.records.push({id:Date.now().toString(),fecha:g('m_fe'),tratamiento:tr});await guardar(p);cerrarModal();renderRec();toast('Registro agregado')})}
window.delRec=async function(rid){if(!confirm('¿Eliminar este registro?'))return;const p=gp();p.records=(p.records||[]).filter(r=>r.id!==rid);await guardar(p);renderRec()}

// CONSULTAS
function renderCons(){const p=gp();const sorted=[...(p.consultas||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const total=(p.consultas||[]).reduce((s,c)=>s+(parseFloat(c.costo)||0),0);
  let html=`<button class="ba" onclick="modalCons()">+ Nueva consulta</button>`;
  if(sorted.length>0)html+=`<p style="font-size:12px;color:var(--text2);margin-bottom:14px;letter-spacing:0.02em">Total acumulado: <strong style="color:var(--forest)">$${total.toLocaleString()}</strong></p>`;
  else html+=`<p style="font-size:13px;color:var(--text3)">Sin consultas registradas aún.</p>`;
  sorted.forEach(c=>{html+=`<div class="cc"><div class="cch"><div><div class="ccd">${ff(c.fecha)}</div><div class="cct">${e(c.tratamiento)}</div></div><div style="display:flex;gap:6px;align-items:center">${c.costo?`<span class="ccc">$${parseFloat(c.costo).toLocaleString()}</span>`:''}<button class="bdel" onclick="delCons('${c.id}')">✕</button></div></div>${c.notas?`<div class="ccn">${e(c.notas)}</div>`:''}${c.dientes?`<div style="font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:0.02em">Dientes: ${e(c.dientes)}</div>`:''}</div>`});
  document.getElementById('panel').innerHTML=html;}
window.modalCons=function(){const hoy=new Date().toISOString().split('T')[0];
  abrirModal('Nueva consulta',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="mf"><label>Fecha</label><input type="date" id="m_fe" value="${hoy}"></div><div class="mf"><label>Costo ($)</label><input type="number" id="m_co" placeholder="0"></div></div><div class="mf"><label>Tratamiento realizado *</label><input id="m_tr" placeholder="Limpieza, extracción..."></div><div class="mf"><label>Dientes involucrados</label><input id="m_di" placeholder="Ej: 16, 17"></div><div class="mf"><label>Notas clínicas</label><textarea id="m_no" placeholder="Observaciones..."></textarea></div>`,
    async()=>{const tr=g('m_tr').trim();if(!tr){alert('El tratamiento es obligatorio.');return}const p=gp();if(!p.consultas)p.consultas=[];p.consultas.push({id:Date.now().toString(),fecha:g('m_fe'),tratamiento:tr,notas:g('m_no'),costo:g('m_co'),dientes:g('m_di')});await guardar(p);cerrarModal();renderLista();renderCons();toast('Consulta registrada')})}
window.delCons=async function(cid){if(!confirm('¿Eliminar esta consulta?'))return;const p=gp();p.consultas=(p.consultas||[]).filter(c=>c.id!==cid);await guardar(p);renderLista();renderCons()}

// MODAL
function abrirModal(titulo,body,fn){modalFn=fn;const div=document.createElement('div');div.className='mbg';div.id='MB';div.innerHTML=`<div class="mbox"><h3>${titulo}</h3>${body}<div class="mact"><button class="bc" onclick="cerrarModal()">Cancelar</button><button class="bs" onclick="confirmarModal()">Guardar</button></div></div>`;document.body.appendChild(div)}
function cerrarModal(){const m=document.getElementById('MB');if(m)m.remove()}
function confirmarModal(){if(modalFn)modalFn()}
window.cerrarModal=cerrarModal;
window.confirmarModal=confirmarModal;

window.modalNuevo=function(){
  abrirModal('Nuevo paciente',`<div class="mf"><label>Nombre completo *</label><input id="m_no" placeholder="Nombre y apellidos"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="mf"><label>CI</label><div style="display:flex;gap:5px"><select id="m_ci_tipo" onchange="const i=document.getElementById('m_ci');i.maxLength=this.value==='J'?9:8"><option>V</option><option>J</option><option>E</option></select><input id="m_ci" placeholder="0000000" maxlength="8" type="text" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div></div><div class="mf"><label>Teléfono</label><input id="m_te" placeholder="000-000-0000"></div></div><div class="mf"><label>Fecha de nacimiento</label><input type="date" id="m_na"></div>`,
    async()=>{const nombre=g('m_no').trim();if(!nombre){alert('El nombre es obligatorio.');return}
      const data={nombre,ci:g('m_ci_tipo')+'-'+g('m_ci'),telefono:g('m_te'),nacimiento:g('m_na'),telefono2:'',email:'',sexo:'',motivo:'',antecedentes:'',patologias:'',oclusion:'',diagnostico:'',plan:'',plan_aceptado:'',restauracion:'',material:'',color_dental:'',color_deseado:'',laboratorio:'',indicaciones_tecnico:'',obs_importantes:'',teeth:{},teeth_obs:'',operatorias:[],procs:{},especialistas:[],records:[],consultas:[]};
      const newId=await crear(data);if(newId){idActual=newId;cerrarModal();toast('Paciente creado')}})}

ss('ing','Conectando...');
</script>
</body>
</html>
